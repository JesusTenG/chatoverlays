body{

/*//////////////BUBBLE//////////////////*/

.cs-bubble{
    --cs-bubble-border-color:
        var(
            --cs-usercolor,
            #315bd8
        );


    /*//////////////DEFAULT USER COLOR SURFACE//////////////////*/

    --cs-bubble-background-color:

        linear-gradient(

            color-mix(

                var(--cs-usercolor,#315bd8) 58%,
                #15171b

            0%,

            color-mix(
                in srgb,
                var(--cs-usercolor,#315bd8) 42%,
                #07080a
            )
            50%,

            color-mix(
                in srgb,
                var(--cs-usercolor,#315bd8) 28%,
                #020203
            )
            100%
        );


    /*//////////////DEFAULT USERNAME//////////////////*/

    --cs-username-background-color:
        color-mix(
            in srgb,
            var(--cs-usercolor,#315bd8) 68%,
            #090a0c

    /*//////////////COLORS//////////////////*/

    --accent:
        var(
            --cs-bubble-border-color,
            var(--cs-usercolor,#315bd8)
        );

    --chip:
        var(--accent);

    --chip-bright:
        color-mix(
            in srgb,
            var(--chip) 68%,
            #fff
        );

    --chip-mid:
        color-mix(
            in srgb,
            var(--chip) 84%,
            #111827
        );

    --chip-dark:
        color-mix(
            in srgb,
            var(--chip) 52%,
            #05070d
        );

    --chip-deep:
        color-mix(
            in srgb,
            var(--chip) 26%,
            #020307
        );

    --marker:#fffdf2;

    --outline:#07080c;

    --text:#ffffff;


    /*//////////////CHIP SIZE//////////////////*/

    --chip-size:
        clamp(
            8rem,

    /*//////////////PILL MASK//////////////////*/

    --pill-mask-x:

            var(--chip-size) * .52

    --pill-real-left:
        calc(

    --pill-hidden-left:

    padding:0;

    border:0;

    background:transparent;

    box-shadow:none;

/*//////////////PILL MASK STAGE//////////////////*/

.cs-pill-stage{
    position:absolute;

    top:-1rem;

    right:-1rem;

    bottom:-1rem;

    left:
        var(--pill-mask-x);

    z-index:1;

    overflow:hidden;

    pointer-events:none;
}


/*//////////////PILL FRAME//////////////////*/

.cs-pill-frame{
    position:absolute;

    top:1rem;

    right:1rem;

    bottom:1rem;

    left:
        calc(
            -1 *
            var(--pill-hidden-left)
        );

    background:transparent;

    pointer-events:none;

    animation:
        cs-pill-slide-out
        var(--pill-enter-duration)
        cubic-bezier(.16,.82,.18,1)
        var(--pill-enter-delay)
        both;

    will-change:
        transform,
        opacity;
}


/*//////////////MESSAGE SURFACE//////////////////*/

.cs-pill-frame::before{
    content:"";

    position:absolute;

    top:
        var(--pill-surface-inset);

    right:
        var(--pill-surface-inset);

    bottom:
        var(--pill-surface-inset);

    left:
        var(--pill-surface-inset);

    z-index:0;

    border:
        var(--pill-inner-outline)
        solid
        var(--outline);

    border-radius:
        0
        calc(
            (
                var(--chip-size) -
                (
                    var(--pill-surface-inset) * 2
                )
            ) / 2
        )
        calc(
            (
                var(--chip-size) -
                (
                    var(--pill-surface-inset) * 2
                )
            ) / 2
        )
        0;

    background-color:
        var(
            --cs-bubble-background-color,
            #fff
        );

    background-image:
        var(
            --cs-bubble-background-gradient,
            none
        );

    background-repeat:no-repeat;

    box-shadow:

        inset
        0
        .1rem
        0
        rgba(
            255,
            255,
            255,
            var(
                --cs-surface-highlight-opacity,
                .18
            )
        ),

        inset
        0
        -.12rem
        0
        rgba(0,0,0,.10);

    pointer-events:none;
}


/*//////////////PATTERN CLIP//////////////////*/

.cs-pattern-clip{
    position:absolute;

    top:
        var(--pill-surface-inset);

    right:
        var(--pill-surface-inset);

    bottom:
        var(--pill-surface-inset);

    left:
        var(--pill-surface-inset);

    z-index:1;

    overflow:hidden;

    border-radius:
        0
        calc(
            (
                var(--chip-size) -
                (
                    var(--pill-surface-inset) * 2
                )
            ) / 2
        )
        calc(
            (
                var(--chip-size) -
                (
                    var(--pill-surface-inset) * 2
                )
            ) / 2
        )
        0;

    pointer-events:none;
}


/*//////////////PATTERN LAYER//////////////////*/

.cs-pattern-layer{
    position:absolute;

    top:
        calc(
            -1 *
            var(
                --cs-pattern-layer-extension,
                var(--cs-pattern-loop-distance)
            )
        );

    right:0;

    bottom:
        calc(
            -1 *
            var(
                --cs-pattern-layer-extension,
                var(--cs-pattern-loop-distance)
            )
        );

    left:0;

    background-image:
        var(
            --cs-pattern-image,
            none
        );

    background-size:
        var(
            --cs-pattern-width,
            450px
        )
        auto;

    background-position:
        var(
            --cs-pattern-position,
            center top
        );

    background-repeat:
        var(
            --cs-pattern-repeat,
            repeat
        );

    opacity:
        var(
            --cs-pattern-opacity,
            0
        );

    mix-blend-mode:
        var(
            --cs-pattern-blend-mode,
            normal
        );

    filter:
        var(
            --cs-pattern-filter,
            none
        );

    transform:
        translate3d(
            0,
            0,
            0
        );

    animation:
        var(
            --cs-pattern-animation,
            none
        );

    will-change:transform;

    pointer-events:none;
}


/*//////////////PILL SVG//////////////////*/

.cs-pill-frame__svg{
    position:absolute;

    inset:0;

    z-index:2;

    display:block;

    width:100%;

    height:100%;

    overflow:visible;

    pointer-events:none;

    shape-rendering:geometricPrecision;
}


/*//////////////PILL PATH//////////////////*/

.cs-pill-frame__stroke{
    x:
        var(--pill-svg-inset);

    y:
        var(--pill-svg-inset);

    width:
        calc(
            100% -
            var(--pill-svg-inset-double)
        );

    height:
        calc(
            100% -
            var(--pill-svg-inset-double)
        );

    rx:
        var(--pill-path-radius);

    ry:
        var(--pill-path-radius);

    fill:none;

    stroke-linecap:butt;

    stroke-linejoin:round;

    pointer-events:none;
}


/*//////////////PILL DEPTH//////////////////*/

.cs-pill-frame__depth{
    stroke:
        var(--chip-deep);

    stroke-width:
        var(--pill-outline-width);

    transform:
        translateY(
            var(--pill-depth-y)
        );

    opacity:.98;
}


/*//////////////PILL OUTER OUTLINE//////////////////*/

.cs-pill-frame__outline{
    stroke:
        var(--outline);

    stroke-width:
        var(--pill-outline-width);
}


/*//////////////PILL COLOR BASE//////////////////*/

.cs-pill-frame__color{
    stroke:
        var(--chip);

    stroke-width:
        var(--pill-band-width);
}


/*//////////////PILL WHITE MARKERS//////////////////*/

.cs-pill-frame__markers{
    stroke:
        var(--marker);

    stroke-width:
        var(--pill-band-width);

    stroke-dasharray:
        var(--pill-dash-white)
        var(--pill-dash-color);

    stroke-dashoffset:.18rem;
}


/*//////////////CHIP//////////////////*/

/*//////////////CHIP INNER RING//////////////////*/

.cs-header::before{

        solid

.cs-header::after{

/*//////////////PILL ENTRANCE//////////////////*/

@keyframes cs-pill-slide-out{

    0%{
        visibility:hidden;

        opacity:0;

        transform:
            translate3d(
                calc(
                    -100% +
                    var(--pill-hidden-left) +
                    .2rem
                ),
                0,
                0
            );
    }

    1%{
        visibility:visible;

        opacity:1;

        transform:
            translate3d(
                calc(
                    -100% +
                    var(--pill-hidden-left) +
                    .2rem
                ),
                0,
                0
            );
    }

    82%{
        visibility:visible;

        opacity:1;

        transform:
            translate3d(
                .1rem,
                0,
                0
            );
    }

    100%{
        visibility:visible;

        opacity:1;

        transform:
            translate3d(
                0,
                0,
                0
            );
    }
}


/*//////////////CHIP ENTRANCE//////////////////*/

@keyframes cs-chip-roll-in{

    0%{
        opacity:0;

        transform:
            translate3d(
                -150%,
                0,
                0
            )
            rotate(-720deg)
            scale(.94);
    }

    78%{
        opacity:1;

        transform:
            translate3d(
                .3rem,
                0,
                0
            )
            rotate(8deg)
            scale(1.015);
    }

    100%{
        opacity:1;

        transform:
            translate3d(
                0,
                0,
                0
            )
            rotate(0)
            scale(1);
    }
}


/*//////////////EVENT SPIN//////////////////*/

@keyframes csEventSpin{

    from{
        transform:
            rotate(0);
    }

    to{
        transform:
            rotate(360deg);
    }
}


/*//////////////TEXT ENTRANCE//////////////////*/

@keyframes cs-text-enter{

    0%{
        opacity:0;

        transform:
            translate3d(
                -.5rem,
                0,
                0
            );
    }

    100%{
        opacity:1;

        transform:
            translate3d(
                0,
                0,
                0
            );
    }
}


/*//////////////PATTERN FALL//////////////////*/

@keyframes cs-pattern-fall{

    from{
        transform:
            translate3d(
                0,
                0,
                0
            );
    }

    to{
        transform:
            translate3d(
                0,
                var(--cs-pattern-loop-distance),
                0
            );
    }
}

@media(max-width:620px){

        min-width:

                7rem
            );

        max-width:
            calc(
                100vw -
                .5rem
            );

        margin:.55rem .25rem;
    }

    .cs-content{
        min-width:6rem;

        max-width:
            calc(
                100vw -
                var(--chip-size) -

            );

        padding:
            1rem
            1.2rem
            .85rem
            1.05rem;
    }

    .cs-message{
        line-height:1.26;

        max-height:3.78em;
    }
}
