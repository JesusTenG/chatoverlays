    }

    58% {
        opacity: 1;

        transform:
            translateY(-1.3px)
            scale(1.003);
    }

    78% {
        transform:
            translateY(.4px)
            scale(.999);
    }

    100% {
        opacity: 1;

        transform: none;
    }
}

    0% {
        opacity: 0;

    }

        opacity: .72;
    }

    100% {
        opacity: 1;
    }
}
