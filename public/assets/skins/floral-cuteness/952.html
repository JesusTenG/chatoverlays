    font-weight:

    line-height:
        1.2;

    letter-spacing:
        .08px;


    white-space:
        normal;

    overflow-wrap:
        anywhere;

    word-break:
        normal;


    -webkit-text-stroke:
        var(
            --cs-message-text-stroke-width,
            .35px
        )
        var(
            --cs-message-text-stroke-color,
            var(--bloom-message-text)
        );


    paint-order:
        stroke fill;


    text-shadow:
        var(--cs-message-text-shadow-offset-x, 0px)
        var(--cs-message-text-shadow-offset-y, 0px)
        var(--cs-message-text-shadow-blur-radius, 0px)
        var(
            --cs-message-text-shadow-color,
            transparent
        );


    rotate:
        -.65deg;

    transform-origin:
        center;
}


/*//////////////EMOTES//////////////*/

.cs-message .emote {
    display:
        inline-block;

    flex:
        0 0 auto;

    width:
        auto !important;

    inline-size:
        auto !important;

    height:
        calc(
            var(--cs-message-font-size,16px)
            * 1.55
        )
        !important;

    block-size:
        calc(
            var(--cs-message-font-size,16px)
            * 1.55
        )
        !important;

    max-width:

    max-inline-size:
        none !important;

    max-height:
        calc(
            var(--cs-message-font-size,16px)
            * 1.55
        )
        !important;

    max-block-size:
        calc(
            var(--cs-message-font-size,16px)
            * 1.55
        )

        contain;

    vertical-align:

/*//////////////EVENT//////////////*/

.cs-bubble.cs-event {
    --bloom-event-min:
        var(--bloom-min-bubble);


    position:
        relative;

    display:
        inline-flex;

    flex-direction:
        column;

    align-items:
        center;

    justify-content:
        center;


    inline-size:
        fit-content;

    min-inline-size:
        var(--bloom-event-min);

    max-inline-size:
        min(
            var(--cs-bubble-width, 430px),
            calc(100% - 20px)
        );


    box-sizing:
        border-box;


    padding-block-start:
        calc(
            var(
                --cs-bubble-padding-top,
                var(--cs-bubble-padding, 0px)
            )
            + 14px
        );

    padding-inline-end:
        calc(
            var(
                --cs-bubble-padding-right,
                var(--cs-bubble-padding, 0px)
            )
            + 22px
        );

    padding-block-end:
        calc(
            var(
                --cs-bubble-padding-bottom,
                var(--cs-bubble-padding, 0px)
            )
            + 14px
        );

    padding-inline-start:
        calc(
            var(
                --cs-bubble-padding-left,
                var(--cs-bubble-padding, 0px)
            )
            + 22px
        );


    /*
        The visible event bubble is drawn by
        .bloom-event-shell so it can reveal later.
    */

    background:
        transparent;

    border:
        0;

    box-shadow:
        none;


    overflow:
        visible;

    isolation:
        isolate;


    animation:
        none;
}


/*//////////////EVENT STAGE//////////////*/

.bloom-event-stage {
    display:
        none;
}


.cs-event
.bloom-event-stage {
    position:
        absolute;

    inset:
        0;

    z-index:
        0;

    display:
        block;

    overflow:
        visible;

    pointer-events:
        none;
}


/*//////////////EVENT SHELL//////////////*/

.bloom-event-shell {
    position:
        absolute;

    inset:
        0;

    z-index:
        1;

    display:
        block;

    box-sizing:
        border-box;


    /* SAME FRAMEWORK BUBBLE COLORS */

    background-color:
        var(--bloom-shell);

    background-image:
        var(
            --cs-bubble-background-gradient,
            none
        );

    background-repeat:
        no-repeat;


    border-width:
        var(
            --cs-bubble-border-width,
            2.5px
        );

    border-style:
        var(
            --cs-bubble-border-style,
            solid
        );

    border-color:
        var(--bloom-border);


    border-start-start-radius:
        var(
            --cs-bubble-border-radius-top-left,
            var(--cs-bubble-border-radius, 999px)
        );

    border-start-end-radius:
        var(
            --cs-bubble-border-radius-top-right,
            var(--cs-bubble-border-radius, 999px)
        );

    border-end-end-radius:
        var(
            --cs-bubble-border-radius-bottom-right,
            var(--cs-bubble-border-radius, 999px)
        );

    border-end-start-radius:
        var(
            --cs-bubble-border-radius-bottom-left,
            var(--cs-bubble-border-radius, 999px)
        );


    box-shadow:
        var(--cs-bubble-box-shadow-inset,)
        var(--cs-bubble-box-shadow-offset-x, 0px)
        var(--cs-bubble-box-shadow-offset-y, 0px)
        var(--cs-bubble-box-shadow-blur-radius, 0px)
        var(--cs-bubble-box-shadow-spread-radius, 0px)
        var(
            --cs-bubble-box-shadow-color,
            transparent
        );


    opacity:
        0;

    transform-origin:
        center;


    animation:
        bloom-event-shell-open
        560ms
        430ms
        cubic-bezier(.18,.88,.24,1.14)
        forwards;
}


/*//////////////EVENT FLOWERS//////////////*/

.bloom-event-flower {
    position:
        absolute;

    z-index:
        20;

    inset-block-start:
        50%;


    inline-size:
        24px;

    block-size:
        24px;


    pointer-events:
        none;


    opacity:
        0;

    scale:
        .15;
}


/*//////////////EVENT LEFT FLOWER//////////////*/

.bloom-event-flower--left {
    inset-inline-start:

    translate:

    rotate:

    animation:
        bloom-event-flower-left

}


/*//////////////EVENT RIGHT FLOWER//////////////*/

.bloom-event-flower--right {

}
