.cs-username,
.cs-username--inline {

    cs-receipt-user-type !important;

  animation-duration:
    260ms !important;

  animation-delay:
    220ms !important;

  animation-timing-function:
    steps(16, end) !important;

  animation-fill-mode:
    both !important;
}


/*//////////////BADGE TYPEWRITER//////////////////*/

  animation-fill-mode:

    cs-receipt-message-type !important;

  animation-duration:
    420ms !important;

  animation-delay:
    560ms !important;

  animation-fill-mode:
    both !important;

  1% {

  100% {

  }

  1% {
    opacity:
      1;
  }

  100% {
    opacity:
      1;

    clip-path:
      inset(0 0 0 0);
  }
}
