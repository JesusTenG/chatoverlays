/*//////////////EVENT WINDOW SURFACE//////////////////*/

            transparent 3px
        ),

            rgba(255,255,255,.08) 0 .35px,

        ),

        linear-gradient(

/*//////////////HEADER CONTENT//////////////////*/

.cs-header .cs-avatar,
.cs-header .cs-user {

    z-index:
        6;
}


/*//////////////AVATAR ENTRY//////////////////*/

.cs-header .cs-avatar {

        0;

    animation:
        nt-header-content-enter

        var(--nt-header-content-delay)
        linear
        both;
}


/*//////////////USER WRAPPER//////////////////*/

.cs-header .cs-user {
    min-inline-size:
        0;

    max-inline-size:
        100%;

    background-color:
        transparent !important;

    background-image:
        none !important;

    border-color:
        transparent !important;

    box-shadow:
        none !important;
}


/*//////////////USER EXTRA ELEMENTS//////////////////*/

.cs-header .cs-user::before,
.cs-header .cs-user::after {
    content:
        none !important;

        none !important;
}


/*//////////////BADGES//////////////////*/

.cs-header .cs-badges {
    flex-shrink:
        0;
}


.cs-badges,
.cs-badges--inline {
    opacity:
        0;

    animation:
        nt-header-content-enter
        280ms
        calc(
            var(--nt-header-content-delay)
            + 80ms
        )
        linear
        both;
}


/*//////////////BADGES DESATURATED//////////////////*/

.cs-badges img,
.cs-badges--inline img {
    filter:
        saturate(
            var(--nt-badge-saturation)
        );

    opacity:
        .92;
}


/*//////////////USERNAME//////////////////*/

.cs-username,
.cs-username--inline {
    position:
        relative;

    min-inline-size:
        0;

    max-inline-size:
        100%;

    white-space:
        nowrap;

    text-transform:
        none;

    font-family:
        var(
            --cs-username-font-family,
            "VCR OSD Mono"
        ),
        "VCR OSD Mono",
        "MS Gothic",
        "Yu Gothic",
        "Noto Sans JP",
        monospace;

    background:
        transparent !important;

    border:
        0 !important;

    box-shadow:
        none !important;
}


/*//////////////REAL USERNAME//////////////////*/

.nt-username-real {
    position:
        relative;

    display:
        inline-block;

    background:
        transparent !important;

    border:
        0 !important;

    box-shadow:
        none !important;
}


/*//////////////USERNAME COLOR//////////////////*/

.cs-header .cs-username,
.cs-username--inline {
    color:
        var(--nt-username);
}


/*//////////////USERNAME READABILITY//////////////////*/

.cs-header .cs-username {
    text-shadow:

        var(
            --cs-username-text-shadow-offset-x,
            0px
        )
        var(
            --cs-username-text-shadow-offset-y,
            0px
        )
        var(
            --cs-username-text-shadow-blur-radius,
            0px
        )
        var(
            --cs-username-text-shadow-color,
            transparent
        ),

        -.45px 0
        rgba(74,89,190,.25),

        .45px 0
        rgba(159,67,134,.17),

        0 1px 0
        rgba(0,0,0,.45);
}


/*//////////////NO EXE OR OLD USER SIGNAL//////////////////*/

.cs-username::before,
.cs-username::after,
.cs-username--inline::before,
.cs-username--inline::after {
    content:
        none;

    display:
        none;
}


/*//////////////MESSAGE PANEL BORDER//////////////////*/

.cs-content {
    position:
        relative;

    z-index:
        5;

    min-inline-size:
        0;

    box-sizing:
        border-box;

    padding:
        calc(7px + var(--nt-border-size))
        calc(10px + var(--nt-border-size))
        calc(9px + var(--nt-border-size));

    overflow:
        hidden;

    border-start-end-radius:
        0;

    clip-path:
        polygon(
            0 0,
            100% 0,
            100% calc(100% - var(--nt-cut-end)),
            calc(100% - var(--nt-cut-end)) 100%,
            var(--nt-cut-start) 100%,
            0 calc(100% - var(--nt-cut-start))
        );

    background:
        var(--nt-border);
}


/*//////////////MESSAGE PANEL SURFACE//////////////////*/

.cs-content::before {
    content:
        "";

    position:
        absolute;

    z-index:
        0;

    inset:
        var(--nt-border-size);

    pointer-events:
        none;

    clip-path:
        polygon(
            0 0,
            100% 0,
            100% calc(100% - var(--nt-cut-end)),
            calc(100% - var(--nt-cut-end)) 100%,
            var(--nt-cut-start) 100%,
            0 calc(100% - var(--nt-cut-start))
        );

    background-color:
        var(--nt-body-bg);

    background-image:

        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 3px,
            rgba(119,100,162,.038) 3px,
            rgba(119,100,162,.038) 4px
        ),

        linear-gradient(
            rgba(101,83,148,.045) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(101,83,148,.022) 1px,
            transparent 1px
        ),

        radial-gradient(
            ellipse at 32% 35%,
            rgba(112,95,155,.032),
            transparent 60%
        ),

        var(--nt-body-gradient);

    background-size:
        auto,
        100% 17px,
        20px 100%,
        auto,
        auto;

    background-repeat:
        repeat,
        repeat,
        repeat,
        no-repeat,
        no-repeat;
}


/*//////////////CONTENT CHILDREN//////////////////*/

.cs-content > .cs-user--inline,
.cs-content > .cs-message,
.cs-content > .cs-events {
    position:
        relative;

    z-index:
        3;
}


/*//////////////NORMAL NO HUD//////////////////*/

.cs-bubble:not(.cs-event)
.cs-content::after {
    content:
        none;

    display:
        none;
}


/*//////////////EVENT PANEL//////////////////*/

.cs-bubble.cs-event
.cs-content {
    padding:
        calc(9px + var(--nt-border-size))
        calc(12px + var(--nt-border-size))
        calc(10px + var(--nt-border-size));

    background:
        var(--nt-border);

    animation:
        nt-event-border-hit
        460ms
        calc(
            var(--nt-event-delay)
            + 750ms
        )
        steps(1, end)
        both;
}


/*//////////////EVENT PANEL SURFACE//////////////////*/

.cs-bubble.cs-event
.cs-content::before {
    background-color:
        var(--nt-event-body-bg);

    background-image:

        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 2px,
            rgba(189,169,215,.042) 2px,
            rgba(189,169,215,.042) 3px
        ),

        linear-gradient(
            90deg,
            rgba(111,91,164,.10),
            transparent 22%,
            transparent 78%,
            rgba(177,89,154,.055)
        ),

        radial-gradient(
            ellipse at 50% 0%,
            rgba(135,108,183,.12),
            transparent 52%
        ),

        var(--nt-body-gradient);
}


/*//////////////EVENT BRACKETS//////////////////*/

.cs-bubble.cs-event
.cs-content::after {
    content:
        "";

    position:
        absolute;

    z-index:
        2;

    inset:
        calc(
            var(--nt-border-size)
            + 4px
        );

    pointer-events:
        none;

    opacity:
        .62;

    background:

        linear-gradient(
            var(--nt-event-bracket),
            var(--nt-event-bracket)
        )
        left top
        / 14px 1px
        no-repeat,

        linear-gradient(
            var(--nt-event-bracket),
            var(--nt-event-bracket)
        )
        left top
        / 1px 9px
        no-repeat,

        linear-gradient(
            var(--nt-event-bracket),
            var(--nt-event-bracket)
        )
        right bottom
        / 14px 1px
        no-repeat,

        linear-gradient(
            var(--nt-event-bracket),
            var(--nt-event-bracket)
        )
        right bottom
        / 1px 9px
        no-repeat;

    animation:
        nt-event-bracket-hit
        480ms
        calc(
            var(--nt-event-delay)
            + 760ms
        )
        steps(1, end)
        both;
}


/*//////////////NORMAL BORDER SIGNAL HIT//////////////////*/

.cs-bubble:not(.cs-event)
.cs-content {
    animation:
        nt-normal-border-hit
        440ms
        calc(
            var(--nt-normal-transmission-delay)
            + 760ms
        )
        steps(1, end)
        both;
}


/*//////////////NORMAL TITLE SIGNAL HIT//////////////////*/

.cs-bubble:not(.cs-event)
.nt-titlebar {
    animation:
        nt-titlebar-rise
        var(--nt-titlebar-enter-time)
        var(--nt-titlebar-enter-delay)
        cubic-bezier(.22, .68, .25, 1)
        both,

        nt-normal-title-hit
        420ms
        calc(
            var(--nt-normal-transmission-delay)
            + 770ms
        )
        steps(1, end)
        both;
}


/*//////////////EVENT TITLE SIGNAL HIT//////////////////*/

.cs-bubble.cs-event
.nt-titlebar {
    animation:
        nt-titlebar-rise
        var(--nt-titlebar-enter-time)
        var(--nt-titlebar-enter-delay)
        cubic-bezier(.22, .68, .25, 1)
        both,

        nt-event-title-hit
        440ms
        calc(
            var(--nt-event-delay)
            + 770ms
        )
        steps(1, end)
        both;
}


/*//////////////MESSAGE//////////////////*/

.cs-message {
    position:
        relative;

    z-index:
        4;

    isolation:
        isolate;

    font-family:
        var(
            --cs-message-font-family,
            "VCR OSD Mono"
        ),
        "VCR OSD Mono",
        "MS Gothic",
        "Yu Gothic",
        "Noto Sans JP",
        monospace;

    font-size:
        var(
            --cs-message-font-size,
            14px
        );

    line-height:
        1.18;

    text-align:
        start;

    text-shadow:

        var(
            --cs-message-text-shadow-offset-x,
            0px
        )
        var(
            --cs-message-text-shadow-offset-y,
            0px
        )
        var(
            --cs-message-text-shadow-blur-radius,
            0px
        )
        var(
            --cs-message-text-shadow-color,
            transparent
        ),

        -.4px 0
        rgba(77,92,199,.25),

        .4px 0
        rgba(170,76,143,.16);
}


/*//////////////NO OLD MESSAGE SIGNAL//////////////////*/

.cs-message::before,
.cs-message::after {
    content:
        none;

    display:
        none;
}


/*//////////////REAL MESSAGE//////////////////*/

.nt-message-real {
    position:
        relative;

    display:
        block;

    min-inline-size:
        0;

    max-inline-size:
        100%;
}


/*//////////////NORMAL USERNAME//////////////////*/

.cs-bubble:not(.cs-event)
.nt-username-real {
    opacity:
        0;

    animation:
        nt-normal-real-user
        var(--nt-normal-transmission-time)
        var(--nt-normal-transmission-delay)
        steps(1, end)
        both;
}


/*//////////////NORMAL MESSAGE//////////////////*/

.cs-bubble:not(.cs-event)
.nt-message-real {
    opacity:
        0;

    animation:
        nt-normal-real-message
        var(--nt-normal-transmission-time)
        var(--nt-normal-transmission-delay)
        steps(1, end)
        both;
}


/*//////////////EVENT USERNAME//////////////////*/

.cs-bubble.cs-event
.nt-username-real {
    opacity:
        0;

    animation:
        nt-event-real-user
        var(--nt-event-time)
        var(--nt-event-delay)
        steps(1, end)
        both;
}


/*//////////////EVENT MESSAGE//////////////////*/

.cs-bubble.cs-event
.nt-message-real {
    opacity:
        0;

    padding:
        4px
        6px;

    border:
        0;

    background:
        linear-gradient(
            90deg,
            rgba(113,91,164,.10),
            transparent 74%
        );

    animation:
        nt-event-real-message
        var(--nt-event-time)
        var(--nt-event-delay)
        steps(1, end)
        both;
}


/*//////////////EMOTES//////////////////*/

.cs-message .emote,
.cs-message img.emote {
    width:
        auto !important;

    inline-size:
        auto !important;

    max-width:
        none !important;

    max-inline-size:
        none !important;

    height:
        calc(
            var(--cs-message-font-size, 14px)
            * 1.55
        ) !important;

    block-size:
        calc(
            var(--cs-message-font-size, 14px)
            * 1.55
        ) !important;

    max-height:
        calc(
            var(--cs-message-font-size, 14px)
            * 1.55
        ) !important;

    max-block-size:
        calc(
            var(--cs-message-font-size, 14px)
            * 1.55
        ) !important;

    object-fit:
        contain;

    vertical-align:
        middle;

    filter:
        grayscale(
            var(--nt-emote-grayscale)
        )
        saturate(
            var(--nt-emote-saturation)
        )
        contrast(1.08)
        brightness(.91);

    opacity:
        .90;
}


/*//////////////TRANSMISSION DEFAULT//////////////////*/

.nt-transmission {
    display:
        none;
}


/*//////////////TRANSMISSION COMMON//////////////////*/

.cs-bubble
.nt-transmission {
    position:
        absolute;

    z-index:
        20;

    inset:
        var(--nt-border-size);

    display:
        grid;

    place-items:
        center;

    box-sizing:
        border-box;

    padding:
        8px;

    overflow:
        hidden;

    pointer-events:
        none;

    clip-path:
        polygon(
            0 0,
            100% 0,
            100% calc(100% - var(--nt-cut-end)),
            calc(100% - var(--nt-cut-end)) 100%,
            var(--nt-cut-start) 100%,
            0 calc(100% - var(--nt-cut-start))
        );
}


/*//////////////NORMAL TRANSMISSION//////////////////*/

.cs-bubble:not(.cs-event)
.nt-transmission {
    background:
        linear-gradient(
            180deg,
            rgba(14,11,24,.97),
            rgba(7,6,13,.98)
        );

    animation:
        nt-normal-transmission-cover
        var(--nt-normal-transmission-time)
        var(--nt-normal-transmission-delay)
        steps(1, end)
        both;
}


/*//////////////EVENT TRANSMISSION//////////////////*/

.cs-bubble.cs-event
.nt-transmission {
    background:
        linear-gradient(
            180deg,
            rgba(23,17,37,.98),
            rgba(10,8,18,.98)
        );

    animation:
        nt-event-transmission-cover
        var(--nt-event-time)
        var(--nt-event-delay)
        steps(1, end)
        both;
}


/*//////////////TRANSMISSION STATUS//////////////////*/

.nt-transmission-status {
    position:
        relative;

    display:
        block;

    max-inline-size:
        100%;

    text-align:
        center;

    white-space:
        nowrap;

    color:
        #e4d7eb;

    font-family:
        "MS Gothic",
        "Yu Gothic",
        "Noto Sans JP",
        monospace;

    font-size:
        calc(
            var(--cs-message-font-size, 14px)
            * .90
        );

    font-weight:
        700;

    line-height:
        1;

    letter-spacing:
        .07em;

    text-shadow:
        -1px 0
        color-mix(
            in srgb,
            var(--nt-signal-a) 70%,
            transparent
        ),

        1px 0
        color-mix(
            in srgb,
            var(--nt-signal-b) 60%,
            transparent
        );
}


/*//////////////NORMAL TRANSMISSION TEXT//////////////////*/

.cs-bubble:not(.cs-event)
.nt-transmission-status::before {
    content:
        var(--nt-m1);

    animation:
        nt-normal-transmission-signal
        var(--nt-normal-transmission-time)
        var(--nt-normal-transmission-delay)
        steps(1, end)
        both;
}


/*//////////////EVENT TRANSMISSION TEXT//////////////////*/

.cs-bubble.cs-event
.nt-transmission-status::before {
    content:
        "トク";

    animation:
        nt-event-transmission-signal
        var(--nt-event-time)
        var(--nt-event-delay)
        steps(1, end)
        both;
}


/*//////////////NORMAL CONTROL HIT//////////////////*/

.cs-bubble:not(.cs-event)
.nt-window-min {
    animation:
        nt-control-hit
        300ms
        calc(
            var(--nt-normal-transmission-delay)
            + 720ms
        )
        steps(1, end)
        both;
}


.cs-bubble:not(.cs-event)
.nt-window-max {
    animation:
        nt-control-hit
        300ms
        calc(
            var(--nt-normal-transmission-delay)
            + 760ms
        )
        steps(1, end)
        both;
}


.cs-bubble:not(.cs-event)
.nt-window-close {
    animation:
        nt-control-hit
        300ms
        calc(
            var(--nt-normal-transmission-delay)
            + 800ms
        )
        steps(1, end)
        both;
}


/*//////////////EVENT CONTROL HIT//////////////////*/

.cs-bubble.cs-event
.nt-window-min {
    animation:
        nt-control-hit
        300ms
        calc(
            var(--nt-event-delay)
            + 720ms
        )
        steps(1, end)
        both;
}


.cs-bubble.cs-event
.nt-window-max {
    animation:
        nt-control-hit
        300ms
        calc(
            var(--nt-event-delay)
            + 760ms
        )
        steps(1, end)
        both;
}


.cs-bubble.cs-event
.nt-window-close {
    animation:
        nt-control-hit
        300ms
        calc(
            var(--nt-event-delay)
            + 800ms
        )
        steps(1, end)
        both;
}


/*//////////////BODY ENTRY//////////////////*/

@keyframes nt-shell-enter {

    0% {
        opacity:
            0;

        transform:
            scaleY(.18);

        transform-origin:
            center bottom;
    }


    22% {
        opacity:
            .72;
    }


    100% {
        opacity:
            1;

        transform:
            scaleY(1);
    }
}


/*//////////////CRT ENTRY//////////////////*/

@keyframes nt-crt-enter {

    0% {
        opacity:
            0;
    }


    22% {
        opacity:
            .24;
    }


    31% {
        opacity:
            .08;
    }


    39% {
        opacity:
            .31;
    }


    49% {
        opacity:
            .19;
    }


    100% {
        opacity:
            var(--nt-grain-opacity);
    }
}


/*//////////////USERNAME PANEL RISE//////////////////*/

@keyframes nt-titlebar-rise {

    0% {
        opacity:
            0;

        transform:
            translateY(
                calc(
                    var(--nt-header-height)
                    + 12px
                )
            );
    }


    16% {
        opacity:
            .30;
    }


    100% {
        opacity:
            1;

        transform:
            translateY(0);
    }
}


/*//////////////WINDOW PANEL RISE//////////////////*/

@keyframes nt-window-panel-rise {

    0% {
        opacity:
            0;

        transform:
            translateY(
                calc(
                    var(--nt-header-height)
                    + 9px
                )
            );
    }


    18% {
        opacity:
            .30;
    }


    100% {
        opacity:
            1;

        transform:
            translateY(0);
    }
}


/*//////////////HEADER CONTENT ENTRY//////////////////*/

@keyframes nt-header-content-enter {

    0% {
        opacity:
            0;
    }


    100% {
        opacity:
            1;
    }
}


/*//////////////NORMAL TRANSMISSION SIGNAL//////////////////*/

@keyframes nt-normal-transmission-signal {

    0% {
        content:
            var(--nt-m1);

        opacity:
            0;

        color:
            #e4d7eb;

        transform:
            none;
    }


    8% {
        content:
            var(--nt-m1);

        opacity:
            .72;
    }


    20% {
        content:
            var(--nt-m2);

        opacity:
            .92;
    }


    35% {
        content:
            var(--nt-m3);
    }


    50% {
        content:
            var(--nt-m4);

        opacity:
            1;
    }


    61% {
        content:
            var(--nt-m4);
    }


    /*//////////////SIGNAL LOCK//////////////////*/

    66% {
        content:
            "シグナル";

        color:
            var(--nt-signal-a);

        transform:
            translateX(
                var(--nt-jump-a)
            );

        text-shadow:
            -2px 0
            var(--nt-signal-a),

            2px 0
            var(--nt-signal-b);
    }


    /*//////////////GLITCH A//////////////////*/

    69% {
        content:
            "シグナルロック";

        color:
            var(--nt-signal-b);

        opacity:
            .38;

        transform:
            translateX(
                var(--nt-jump-b)
            );
    }


    /*//////////////GLITCH B//////////////////*/

    72% {
        color:
            var(--nt-signal-c);

        opacity:
            1;

        transform:
            translateX(
                var(--nt-jump-c)
            );

        text-shadow:
            2px 0
            var(--nt-signal-a),

            -2px 0
            var(--nt-signal-b);
    }


    75% {
        opacity:
            .18;

        transform:
            translateX(
                var(--nt-real-jump-a)
            );
    }


    78%,
    100% {
        content:
            "";

        opacity:
            0;

        visibility:
            hidden;

        transform:
            none;
    }
}


/*//////////////NORMAL TRANSMISSION COVER//////////////////*/

@keyframes nt-normal-transmission-cover {

    0% {
        opacity:
            0;

        background:
            rgba(9,7,16,.98);

        transform:
            none;
    }


    5% {
        opacity:
            1;
    }


    62% {
        opacity:
            1;

        background:
            rgba(9,7,16,.98);
    }


    66% {
        background:
            color-mix(
                in srgb,
                var(--nt-signal-a) 35%,
                #080710 65%
            );

        transform:
            translateX(
                var(--nt-jump-a)
            );
    }

/*//////////////RTL//////////////////*/

.cs-bubble.cs-direction-rtl {
    direction:
        rtl;

    --nt-jump-a:
        3px;

    --nt-jump-b:
        -4px;

    --nt-jump-c:
        2px;

    --nt-real-jump-a:
        -4px;

    --nt-real-jump-b:
        2px;

    --nt-real-jump-c:
        -2px;
}


/*//////////////RTL TEXT//////////////////*/

.cs-bubble.cs-direction-rtl
.cs-header,

.cs-bubble.cs-direction-rtl
.cs-content,

.cs-bubble.cs-direction-rtl
.cs-user,

.cs-bubble.cs-direction-rtl
.cs-user--inline,

.cs-bubble.cs-direction-rtl
.cs-username,

.cs-bubble.cs-direction-rtl
.cs-username--inline,

.cs-bubble.cs-direction-rtl
.cs-message {
    direction:
        rtl;

    text-align:
        start;
}


/*//////////////RTL BODY GEOMETRY//////////////////*/

.cs-bubble.cs-direction-rtl
.nt-shell,

.cs-bubble.cs-direction-rtl
.nt-shell::before,

.cs-bubble.cs-direction-rtl
.nt-crt-layer,

.cs-bubble.cs-direction-rtl
.cs-content,

.cs-bubble.cs-direction-rtl
.cs-content::before,

.cs-bubble.cs-direction-rtl
.nt-transmission {
    clip-path:
        polygon(
            0 0,
            100% 0,
            100% calc(100% - var(--nt-cut-start)),
            calc(100% - var(--nt-cut-start)) 100%,
            var(--nt-cut-end) 100%,
            0 calc(100% - var(--nt-cut-end))
        );
}


/*//////////////RTL TITLEBAR//////////////////*/

.cs-bubble.cs-direction-rtl
.nt-titlebar,

.cs-bubble.cs-direction-rtl
.nt-titlebar::before {
    clip-path:
        polygon(
            var(--nt-title-cut) 0,
            100% 0,
            100% 100%,
            0 100%
        );

    border-start-start-radius:
        0;

    border-start-end-radius:
        3px;
}


/*//////////////RTL WINDOW PANEL//////////////////*/

.cs-bubble.cs-direction-rtl
.nt-window-panel {
    border-start-end-radius:
        0;

    border-start-start-radius:
        4px;
}


.cs-bubble.cs-direction-rtl
.nt-window-panel::before {
    border-start-end-radius:
        0;

    border-start-start-radius:
        2px;
}


/*//////////////RTL EVENT MESSAGE//////////////////*/

.cs-bubble.cs-event.cs-direction-rtl
.nt-message-real {
    background:
        linear-gradient(
            270deg,
            rgba(113,91,164,.10),
            transparent 74%
        );
}


/*//////////////RTL EVENT BRACKETS//////////////////*/

.cs-bubble.cs-event.cs-direction-rtl
.cs-content::after {
    background:

        linear-gradient(
            var(--nt-event-bracket),
            var(--nt-event-bracket)
        )
        right top
        / 14px 1px
        no-repeat,

        linear-gradient(
            var(--nt-event-bracket),
            var(--nt-event-bracket)
        )
        right top
        / 1px 9px
        no-repeat,

        linear-gradient(
            var(--nt-event-bracket),
            var(--nt-event-bracket)
        )
        left bottom
        / 14px 1px
        no-repeat,

        linear-gradient(
            var(--nt-event-bracket),
            var(--nt-event-bracket)
        )
        left bottom
        / 1px 9px
        no-repeat;
}


/*//////////////REDUCED MOTION//////////////////*/

@media (prefers-reduced-motion: reduce) {

    .nt-shell,
    .nt-titlebar,
    .nt-window-panel,
    .nt-crt-layer,

    .cs-header
    .cs-avatar,

    .cs-badges,
    .cs-badges--inline,

    .nt-username-real,
    .nt-message-real,

    .nt-transmission,
    .nt-transmission-status::before,

    .cs-content,

    .cs-bubble.cs-event
    .cs-content::after,

    .nt-window-control,

    .nt-skin-back,
    .nt-skin-front,
    .nt-skin-node,
    .nt-skin-fx {
        animation:
            none !important;
    }


    .nt-shell,
    .nt-titlebar,
    .nt-window-panel,
    .nt-crt-layer,

    .cs-header
    .cs-avatar,

    .cs-badges,
    .cs-badges--inline,

    .nt-username-real,
    .nt-message-real {
        opacity:
            1;

        transform:
            none;
    }


    .nt-transmission {
        display:
            none !important;
    }
}
.cs-bubble:not(.cs-event) {
    --nt-border: #9a606e;
    --nt-title-bg: #40272f;
    --nt-body-bg: #09060a;

    --nt-window-top: #e0d2d6;
    --nt-window-mid: #bda5ab;
    --nt-window-bottom: #92767e;

    --nt-window-control: #321f25;
    --nt-control-rest: #321f25;

    --nt-username: #f5e9ec;
    --nt-text: #e6dade;

    --nt-signal-a: #c36b7c;
    --nt-signal-b: #816fc1;
    --nt-signal-c: #eee2e8;

    --nt-skin-accent: #9a606e;
    --nt-skin-accent-2: #c36b7c;
    --nt-skin-accent-3: #816fc1;

    --nt-skin-front-opacity: 1;
}


.cs-bubble:not(.cs-event)
.cs-content::before {
    background-color: var(--nt-body-bg);

    background-image:
        repeating-linear-gradient(
            0deg,
            transparent 0 3px,
            color-mix(
                in srgb,
                var(--nt-skin-accent) 9%,
                transparent
            ) 3px 4px
        ),

        radial-gradient(
            ellipse at 40% 38%,
            color-mix(
                in srgb,
                var(--nt-skin-accent) 8%,
                transparent
            ),
            transparent 65%
        );
}


.cs-bubble:not(.cs-event)
.nt-titlebar::before {
    background-color: var(--nt-title-bg);

    background-image:
        linear-gradient(
            180deg,
            color-mix(
                in srgb,
                var(--nt-skin-accent) 13%,
                transparent
            ),
            transparent 48%,
            rgba(0,0,0,.18)
        );
}


.cs-bubble:not(.cs-event)
.nt-skin-front {
    visibility: visible;
    opacity: 1;
    overflow: hidden;
}


.cs-bubble:not(.cs-event)
.nt-skin-fx--1 {
    display: block;

    inset-inline: 7%;
    inset-block-start: 60%;

    block-size: 1px;

    opacity: 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--nt-skin-accent-2),
            var(--nt-skin-accent),
            var(--nt-skin-accent-3),
            transparent
        );

    animation:
        nt-skin-signal-slice
        10.2s 4s
        steps(1,end)
        infinite;
}


.cs-bubble:not(.cs-event)
.nt-username-real {
    animation:
        nt-normal-real-user
        var(--nt-normal-transmission-time)
        var(--nt-normal-transmission-delay)
        steps(1,end)
        both,

        nt-skin-control-glitch
        10.2s 4s
        steps(1,end)
