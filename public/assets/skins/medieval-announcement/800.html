            var(--iron-mid) 45%,
            var(--iron-black)
        );
}

.cs-role-banner__rod::before {
    inset-inline-start:
        -1px;
}

.cs-role-banner__rod::after {
    inset-inline-end:
        -1px;
}


/*//////////////BANNER FIXINGS//////////////*/

.cs-role-banner__rod i {
    position:
        absolute;

    inset:
        0;

    pointer-events:
        none;
}

.cs-role-banner__rod i::before,
.cs-role-banner__rod i::after {
    content:
        "";

    position:
        absolute;

    inset-block-start:
        2px;

    inline-size:
        3px;

    block-size:
        4px;

    border-radius:
        0 0 1px 1px;

    background:

        linear-gradient(
            90deg,
            var(--iron-black),
            var(--iron-mid),
            var(--iron-black)
        );

    opacity:
        .72;
}

.cs-role-banner__rod i::before {
    inset-inline-start:
        20%;
}

.cs-role-banner__rod i::after {
    inset-inline-end:
        20%;
}


/*//////////////HEADER//////////////*/

.cs-header {
    display:
        contents;
}


/*//////////////USER//////////////*/

.cs-user {
    grid-area:
        user;

    position:
        relative;

    z-index:
        8;

    align-self:
        end;

    display:
        flex;

    align-items:
        center;

    gap:
        4px;

    min-inline-size:
        0;

    padding:
        0;

    background:
        transparent;

    border:
        0;

    box-shadow:
        none;
}


/*//////////////USERNAME//////////////*/

.cs-username,
.cs-username--inline {
    position:
        relative;

    z-index:
        8;

    font-family:
        var(
            --cs-username-font-family,
            "Noto Serif"
        ),
        Georgia,
        serif;

    font-size:
        var(
            --cs-username-font-size,
            14px
        );

    font-weight:
        var(
            --cs-username-font-weight,
            650
        );

    line-height:
        1.18;

    letter-spacing:
        -.008em;

    color:
        var(--carved-text);

    -webkit-text-stroke:
        .14px
        color-mix(
            in srgb,
            var(--carved-cut) 55%,
            transparent
        );

    text-shadow:

        0 -1px 0
        var(--carved-cut),

        0 -1.35px .55px
        rgba(0, 0, 0, .5),

        0 1px 0
        color-mix(
            in srgb,
            var(--carved-light) 42%,
            transparent
        ),

        0 1.35px .35px
        rgba(255, 218, 163, .09),

        .45px 0 .25px
        var(--carved-inner);
}


/*//////////////CONTENT//////////////*/

.cs-content {
    grid-area:
        content;

    position:
        relative;

    z-index:
        8;

    min-inline-size:
        0;
}


/*//////////////MESSAGE//////////////*/

.cs-message {
    padding:
        0;

    background:
        transparent;

    border:
        0;

    font-family:
        var(
            --cs-message-font-family,
            "Noto Serif"
        ),
        Georgia,
        serif;

    font-size:
        var(
            --cs-message-font-size,
            14px
        );

    font-weight:
        var(
            --cs-message-font-weight,
            600
        );

    line-height:
        1.36;

    color:
        var(--carved-text);

    -webkit-text-stroke:
        .12px
        color-mix(
            in srgb,
            var(--carved-cut) 52%,
            transparent
        );

    text-shadow:

        0 -1px 0
        var(--carved-cut),

        0 -1.3px .5px
        rgba(0, 0, 0, .47),

        0 1px 0
        color-mix(
            in srgb,
            var(--carved-light) 39%,
            transparent
        ),

        0 1.3px .35px
        rgba(255, 218, 163, .08),

        .4px 0 .22px
        var(--carved-inner);
}


/*//////////////BADGES//////////////*/

.cs-badges,
.cs-badges--inline {
    display:
        inline-flex;

    align-items:
        center;

    gap:
        2px;

    flex-shrink:
        0;
}

.cs-badges img,
.cs-badges--inline img {

        clamp(
            10px,
            calc(
                var(--cs-username-font-size, 14px)

            ),
            13px
        );

    block-size:
        clamp(
            10px,
            calc(
                var(--cs-username-font-size, 14px)
                - 2px
            ),
            13px
        );

    aspect-ratio:
        1;

    object-fit:
        contain;

    padding:
        0;

    margin:
        0;

    border:
        0;

    border-radius:
        0;

    background:
        transparent;

    opacity:

    mix-blend-mode:
        multiply;

    filter:

        grayscale(1)

        sepia(1)

        saturate(.12)

        brightness(.51)

        contrast(2)

        drop-shadow(
            0 -1px 0
            rgba(6, 3, 1, .8)
        )

        drop-shadow(
            0 1px 0
            rgba(255, 211, 150, .17)
        );
}


/*//////////////AVATAR//////////////*/

.cs-avatar {
    grid-area:
        avatar;

    position:
        relative;

    z-index:
        12;

    align-self:
        center;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    inline-size:
        var(--shield-width);

    block-size:
        var(--shield-height);

    flex-shrink:
        0;

    overflow:
        visible;
}


/*//////////////SHIELD SHADOW//////////////*/

.cs-shield-shadow {
    position:
        absolute;

    z-index:
        0;

    inset:
        2px 0 -2px 1px;

    clip-path:
        var(--shield-shape);

    background:
        rgba(0, 0, 0, .74);

    transform:
        translateY(2px)
        scale(.97);

    filter:
        blur(1.5px);
}


/*//////////////SHIELD RIM//////////////*/

.cs-shield-rim {
    position:
        absolute;

    z-index:
        1;

    inset:
        0;

    clip-path:
        var(--shield-shape);

    background:

        linear-gradient(
            124deg,
            var(--iron-black) 0%,
            var(--iron-dark) 7%,
            var(--iron-light) 13%,
            var(--iron-mid) 20%,
            var(--iron-dark) 32%,
            var(--iron-black) 49%,
            var(--iron-mid) 68%,
            var(--iron-light) 82%,
            var(--iron-dark) 92%,
            var(--iron-black) 100%
        );

    filter:
        drop-shadow(
            0 1px 1px
            rgba(0, 0, 0, .67)
        );
}


/*//////////////SHIELD BED//////////////*/

.cs-shield-bed {
    position:
        absolute;

    z-index:
        2;

    inset:
        1.5px;

    clip-path:
        var(--shield-inner);

    background:

        linear-gradient(
            135deg,

            color-mix(
                in srgb,
                var(--cs-usercolor) 31%,
                #25211d 69%
            ),

            color-mix(
                in srgb,
                var(--cs-usercolor) 48%,
                #151514 52%
            )
            48%,

            color-mix(
                in srgb,
                var(--cs-usercolor) 25%,
                #0d0e0e 75%
            )
        );
}


/*//////////////AVATAR IMAGE//////////////*/

.cs-avatar img {
    position:
        absolute;

    z-index:
        3;

    inset:
        2.5px;

    inline-size:
        calc(
            100% - 5px
        );

    block-size:
        calc(
            100% - 5px
        );

    object-fit:
        cover;

    object-position:
        center;

    padding:
        0;

    margin:
        0;

    border:
        0;

    border-radius:
        0;

    clip-path:
        var(--shield-inner);

    background-color:
        var(
            --cs-avatar-background-color,
            #211711
        );

    filter:

        sepia(.17)

        saturate(.75)

        contrast(1.12)

        brightness(.91);
}


/*//////////////SHIELD BEVEL//////////////*/

.cs-shield-bevel {
    position:
        absolute;

    z-index:
        4;

    inset:
        2.5px;

    clip-path:
        var(--shield-inner);

    pointer-events:
        none;

    background:

        linear-gradient(
            132deg,
            rgba(255, 240, 210, .1),
            transparent 19% 64%,
            rgba(46, 25, 13, .22) 84%,
            rgba(0, 0, 0, .34) 100%
        );

    box-shadow:

        inset 0 0 0 1px
        rgba(239, 222, 192, .09),

        inset -1px -2px 3px
        rgba(0, 0, 0, .27),

        inset 0 0 7px
        rgba(56, 31, 16, .08);
}


/*//////////////NORMAL REVEAL//////////////*/

.cs-bubble:not(
    .cs-event
)
.cs-surface,

.cs-bubble.cs-event:is(
    .cs-event-action,
    .cs-event-cheer,
    .cs-event-highlight,
    .cs-event-channel-points,
    .cs-event-gigantified
)
.cs-surface {
    animation:
        wood-in
        400ms
        cubic-bezier(.18, .78, .18, 1)
        both;
}


/*//////////////NORMAL CONTENT REVEAL//////////////*/

.cs-bubble:not(
    .cs-event
)
.cs-user,

.cs-bubble.cs-event:is(
    .cs-event-action,
    .cs-event-cheer,
    .cs-event-highlight,
    .cs-event-channel-points,
    .cs-event-gigantified
)
.cs-user {
    animation:
        carving-in
        320ms
        70ms
        ease-out
        both;
}

.cs-bubble:not(
    .cs-event
)
.cs-content,

.cs-bubble.cs-event:is(
    .cs-event-action,
    .cs-event-cheer,
    .cs-event-highlight,
    .cs-event-channel-points,
    .cs-event-gigantified
)
.cs-content {
    animation:
        carving-in
        350ms
        110ms
        ease-out
        both;
}


/*//////////////NORMAL AVATAR REVEAL//////////////*/

.cs-bubble:not(
    .cs-event
)
.cs-avatar,

.cs-bubble.cs-event:is(
    .cs-event-action,
    .cs-event-cheer,
    .cs-event-highlight,
    .cs-event-channel-points,
    .cs-event-gigantified
)
.cs-avatar {
    animation:
        shield-in
        470ms
        100ms
        cubic-bezier(.18, .8, .2, 1.04)
        both;
}


/*//////////////WOOD EVENTS//////////////*/

.cs-bubble.cs-event:is(
    .cs-event-action,
    .cs-event-cheer,
    .cs-event-highlight,
    .cs-event-channel-points,
    .cs-event-gigantified
)
.cs-scroll {
    display:
        none !important;
}


/*//////////////ACTION//////////////*/

.cs-bubble.cs-event-action
.cs-message {
    font-style:
        italic;
}


/*//////////////CHEER//////////////*/

.cs-bubble.cs-event-cheer
.cs-surface {
    border-color:
        color-mix(
            in srgb,
            var(--frame-source) 70%,
            var(--brass) 30%
        );
}


/*//////////////HIGHLIGHT//////////////*/

.cs-bubble.cs-event-highlight
.cs-surface {
    border-color:
        var(--frame-light);

    box-shadow:

        inset 0 1px 0
        rgba(255, 218, 169, .075),

        inset 0 -1px 0
        rgba(0, 0, 0, .57),

        inset 0 0 15px
        rgba(0, 0, 0, .13),

        0 0 0 1px
        color-mix(
            in srgb,
            var(--frame-light) 16%,
            transparent
        ),

        0 3px 8px
        rgba(0, 0, 0, .2);
}


/*//////////////CHANNEL POINTS//////////////*/

.cs-bubble.cs-event-channel-points
.cs-shield-rim {
    background:

        linear-gradient(
            124deg,

            var(--iron-black),

            color-mix(
                in srgb,
                var(--cs-usercolor) 30%,
                var(--iron-light) 70%
            )
            15%,

            var(--iron-mid)
            35%,

            var(--iron-black)
            51%,

            color-mix(
                in srgb,
                var(--cs-usercolor) 22%,
                var(--iron-mid) 78%
            )
            72%,

            var(--iron-light)
            84%,

            var(--iron-dark)
        );
}


/*//////////////PARCHMENT EVENTS//////////////*/

.cs-bubble.cs-event:not(
    :is(
        .cs-event-action,
        .cs-event-cheer,
        .cs-event-highlight,
        .cs-event-channel-points,
        .cs-event-gigantified
    )
) {
    min-inline-size:
        min(
            220px,
            calc(100vw - 28px)
        );
}


/*//////////////EVENT SURFACE//////////////*/

.cs-bubble.cs-event:not(
    :is(
        .cs-event-action,
        .cs-event-cheer,
        .cs-event-highlight,
        .cs-event-channel-points,
        .cs-event-gigantified
    )
)
.cs-surface {
    position:
        relative;

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    justify-content:
        center;

    row-gap:
        0;

    min-block-size:
        0;

    padding-block:
        9px;

    padding-inline:
        27px;

    background:
        transparent;

    border:
        0;

    border-radius:
        0;

    box-shadow:
        none;

    text-align:
        center;

    overflow:
        visible;

    opacity:
        0;

    visibility:
        hidden;

    animation:
        event-gate
        1ms
        20ms
        steps(1, end)
        forwards;
}


/*//////////////EVENT CLEANUP//////////////*/

.cs-bubble.cs-event:not(
    :is(
        .cs-event-action,
        .cs-event-cheer,
        .cs-event-highlight,
        .cs-event-channel-points,
        .cs-event-gigantified
    )
)
:is(
    .cs-avatar,
    .cs-role-banner,
    .cs-wood-knot,
    .cs-wood-heraldry,
    .cs-corner
) {
    display:
        none !important;
}

.cs-bubble.cs-event:not(
    :is(
        .cs-event-action,
        .cs-event-cheer,
        .cs-event-highlight,
        .cs-event-channel-points,
        .cs-event-gigantified
    )
)
.cs-surface::before,

.cs-bubble.cs-event:not(
    :is(
        .cs-event-action,
        .cs-event-cheer,
        .cs-event-highlight,
        .cs-event-channel-points,
        .cs-event-gigantified
    )
)
.cs-surface::after {
    display:
        none;
}


/*//////////////NO EVENT BADGES//////////////*/

.cs-bubble.cs-event:not(
    :is(
        .cs-event-action,
        .cs-event-cheer,
        .cs-event-highlight,
        .cs-event-channel-points,
        .cs-event-gigantified
    )
)
.cs-badges,

.cs-bubble.cs-event:not(
    :is(
        .cs-event-action,
        .cs-event-cheer,
        .cs-event-highlight,
        .cs-event-channel-points,
        .cs-event-gigantified
    )
)
.cs-badges--inline {
    display:
        none !important;
}


/*//////////////EVENT INLINE//////////////*/

.cs-bubble.cs-event:not(
    :is(
        .cs-event-action,
        .cs-event-cheer,
        .cs-event-highlight,
        .cs-event-channel-points,
        .cs-event-gigantified
    )
)
.cs-user--inline {
    display:
        none !important;
}


/*//////////////EVENT USER//////////////*/

.cs-bubble.cs-event:not(
    :is(
        .cs-event-action,
        .cs-event-cheer,
        .cs-event-highlight,
        .cs-event-channel-points,
        .cs-event-gigantified
    )
)
.cs-user {
    position:
        relative;

    z-index:
        12;

    display:
        flex !important;

    justify-content:
        center;

    align-items:
        center;

    inline-size:
        100%;

    padding:
        0;

    text-align:
        center;

    opacity:
        0;

    visibility:
        hidden;
}


/*//////////////EVENT CONTENT//////////////*/

.cs-bubble.cs-event:not(
    :is(
        .cs-event-action,
        .cs-event-cheer,
        .cs-event-highlight,
        .cs-event-channel-points,
        .cs-event-gigantified
    )
)
.cs-content {
    position:
        relative;

    z-index:
        12;

    inline-size:
        100%;

    text-align:
        center;

    opacity:
        0;

    visibility:
        hidden;
}


/*//////////////EVENT TEXT//////////////*/

.cs-bubble.cs-event:not(
    :is(
        .cs-event-action,
        .cs-event-cheer,
        .cs-event-highlight,
        .cs-event-channel-points,
        .cs-event-gigantified
    )
)
.cs-username,

.cs-bubble.cs-event:not(
    :is(
        .cs-event-action,
        .cs-event-cheer,
        .cs-event-highlight,
        .cs-event-channel-points,
        .cs-event-gigantified
    )
)
.cs-message {
    color:
        var(--event-ink);

    -webkit-text-stroke:
        0;

    text-align:
        center;

    text-shadow:

        0 .5px 0
        rgba(247, 222, 171, .16),

        0 -.45px .3px
        rgba(60, 34, 18, .27);

    filter:
        none;
}

.cs-bubble.cs-event:not(
    :is(
        .cs-event-action,
        .cs-event-cheer,
        .cs-event-highlight,
        .cs-event-channel-points,
        .cs-event-gigantified
    )
)
.cs-message {
    inline-size:
        100%;

    justify-content:
        center;

    text-align:
        center;
}
/*//////////////SCROLL//////////////*/

.cs-scroll {
    display:
        none;

    position:
        absolute;

    z-index:
        1;

    inset:
        -5px -9px;

    pointer-events:
        none;

    overflow:
        visible;
}

.cs-bubble.cs-event:not(
    :is(
        .cs-event-action,
        .cs-event-cheer,
        .cs-event-highlight,
        .cs-event-channel-points,
        .cs-event-gigantified
    )
)
.cs-scroll {
    display:
        block;
}


/*//////////////SCROLL SHADOW//////////////*/

.cs-scroll__shadow {
    position:
        absolute;

    z-index:
        0;

    inset:
        9px 14px 3px;

    border-radius:
        45%;

    opacity:
        0;

    transform:
        translateY(3px)
        scaleX(.04);

    background:
        rgba(0, 0, 0, .27);

    filter:
        blur(3.5px);
}


/*//////////////SCROLL PAPER//////////////*/

.cs-scroll__paper {
    position:
        absolute;

    z-index:
        2;

    inset-block:
        4px;

    inset-inline:
        6px;

    overflow:
        hidden;

    opacity:
        0;

    transform:
        scaleX(.025);

    transform-origin:
        center;

    border-block:
        1px solid
        rgba(96, 59, 29, .32);

    clip-path:
        polygon(
            0 5%,
            10% 3%,
            22% 4%,
            35% 2%,
            49% 4%,
            63% 2%,
            78% 4%,
            90% 3%,
            100% 5%,
            100% 95%,
            89% 97%,
            77% 96%,
            63% 98%,
            49% 96%,
            35% 98%,
            21% 96%,
            10% 98%,
            0 95%
        );

    background:

        linear-gradient(
            45deg,
            transparent 46%,
            rgba(96, 59, 29, .075) 47% 49%,
            transparent 50%
        ),

        linear-gradient(
            -45deg,
            transparent 46%,
            rgba(96, 59, 29, .075) 47% 49%,
            transparent 50%
        ),

        radial-gradient(
            circle at 50% 50%,
            rgba(84, 48, 23, .06) 0 .6px,
            transparent .9px
        ),

        radial-gradient(
            ellipse 70px 26px at 14% 18%,
            rgba(97, 58, 28, .055),
            transparent 64%
        ),

        radial-gradient(
            ellipse 53px 21px at 84% 78%,
            rgba(103, 62, 28, .05),
            transparent 65%
        ),

        repeating-linear-gradient(
            1deg,
            transparent 0 6px,
            rgba(84, 50, 25, .017) 7px,
            transparent 8px 15px
        ),

        linear-gradient(
            90deg,
            var(--parchment-dark) 0%,
            var(--parchment-mid) 3%,
            var(--parchment-light) 9%,
            var(--parchment) 22% 78%,
            var(--parchment-light) 91%,
            var(--parchment-mid) 97%,
            var(--parchment-dark) 100%
        );

    background-size:
        26px 26px,
        26px 26px,
        26px 26px,
        auto,
        auto,
        auto,
        auto;

    box-shadow:

        inset 0 4px 6px
        rgba(82, 49, 24, .07),

        inset 0 -4px 7px
        rgba(82, 49, 24, .095),

        inset 10px 0 11px
        rgba(78, 45, 21, .08),

        inset -10px 0 11px
        rgba(78, 45, 21, .08);
}


/*//////////////ROYAL INNER BORDER//////////////*/

.cs-scroll__paper::before {
    content:
        "";

    position:
        absolute;

    z-index:
        2;

    inset:
        5px 13px;

    pointer-events:
        none;

    opacity:
        .14;

    border-block:
        1px solid
        rgba(89, 54, 29, .55);
}


/*//////////////PAPER FIBRES//////////////*/

.cs-scroll__fibres {
    position:
        absolute;

    z-index:
        1;

    inset:
        0;

    pointer-events:
        none;

    opacity:
        .44;

    background:

        radial-gradient(
            circle at 17% 28%,
            rgba(78, 46, 22, .11) 0 .5px,
            transparent .9px
        ),

        radial-gradient(
            circle at 67% 62%,
            rgba(76, 45, 21, .085) 0 .5px,
            transparent .9px
        ),

        radial-gradient(
            circle at 43% 45%,
            rgba(255, 244, 218, .11) 0 .5px,
            transparent .9px
        );

    background-size:
        19px 17px,
        23px 21px,
        29px 25px;
}


/*//////////////STAINS//////////////*/

.cs-scroll__stain {
    position:
        absolute;

    border-radius:
        50%;

    background:

        radial-gradient(
            ellipse,
            rgba(95, 55, 25, .09),
            rgba(95, 55, 25, .02) 54%,
            transparent 74%
        );
}

.cs-scroll__stain--a {
    inline-size:
        38px;

    block-size:
        17px;

    inset-inline-start:
        12%;

    inset-block-start:
        16%;

    transform:
        rotate(-9deg);
}

.cs-scroll__stain--b {
    inline-size:
        45px;

    block-size:
        18px;

    inset-inline-end:
        10%;

    inset-block-end:
        13%;

    transform:
        rotate(8deg);
}


/*//////////////CREASES//////////////*/

.cs-scroll__crease {
    position:
        absolute;

    block-size:
        1px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(72, 41, 19, .095),
            transparent
        );
}

.cs-scroll__crease--a {
    inline-size:
        57%;

    inset-inline-start:
        11%;

    inset-block-start:
        33%;

    transform:
        rotate(.8deg);
}

.cs-scroll__crease--b {
    inline-size:
        45%;

    inset-inline-end:
        12%;

    inset-block-end:
        23%;

    transform:
        rotate(-1deg);
}


/*//////////////WATERMARK//////////////*/

.cs-scroll__watermark {
    position:
        absolute;

    z-index:
        1;

    inset:
        6px;

    opacity:
        .025;

    background:

        linear-gradient(
            45deg,
            transparent 40%,
            var(--parchment-burn) 41% 46%,
            transparent 47%
        ),

        linear-gradient(
            -45deg,
            transparent 40%,
            var(--parchment-burn) 41% 46%,
            transparent 47%
        );

    background-size:
        26px 26px;
}


/*//////////////SCROLL ORNAMENT//////////////*/

.cs-scroll__ornament {
    position:
        absolute;

    z-index:
        3;

    inset-inline-start:
        50%;

    inline-size:
        56px;

    block-size:
        8px;

    transform:
        translateX(-50%);

    opacity:
        .13;
}

.cs-scroll__ornament--top {
    inset-block-start:
        4px;
}

.cs-scroll__ornament--bottom {
    inset-block-end:
        4px;

    transform:
        translateX(-50%)
        rotate(180deg);
}

.cs-scroll__ornament::before,
.cs-scroll__ornament::after {
    content:
        "";

    position:
        absolute;

    inset-block-start:
        3px;

    inline-size:
        23px;

    block-size:
        5px;

    border-block-start:
        1px solid
        var(--parchment-burn);

    border-radius:
        50%;
}

.cs-scroll__ornament::before {
    inset-inline-start:
        0;

    transform:
        rotate(-11deg);
}

.cs-scroll__ornament::after {
    inset-inline-end:
        0;

    transform:
        rotate(11deg);
}


/*//////////////NO CENTER BANDEROLE//////////////*/

.cs-scroll__banderole {
    display:
        none !important;
}


/*//////////////SCROLL ROLLS//////////////*/

.cs-scroll__roll {
    position:
        absolute;

    z-index:
        6;

    inset-block:
        -1px;

    inline-size:
        17px;

    opacity:
        0;

    overflow:
        visible;

    filter:
        drop-shadow(
            0 2px 1px
            rgba(47, 28, 15, .3)
        );
}

.cs-scroll__roll--left {
    inset-inline-start:
        calc(
            50% - 8.5px
        );
}

.cs-scroll__roll--right {
    inset-inline-end:
        calc(
            50% - 8.5px
        );
}


/*//////////////ROLL BODY//////////////*/

.cs-scroll__roll-body {
    position:
        absolute;

    z-index:
        3;

    inset-block:
        3px;

    inline-size:
        12px;

    border-radius:
        48%;

    background:

        repeating-linear-gradient(
            0deg,
            transparent 0 9px,
            rgba(79, 45, 21, .045) 10px,
            transparent 11px 18px
        ),

        linear-gradient(
            90deg,
            var(--parchment-burn) 0%,
            var(--parchment-dark) 11%,
            var(--parchment-mid) 26%,
            var(--parchment-light) 43%,
            var(--parchment-high) 54%,
            var(--parchment-mid) 71%,
            var(--parchment-dark) 88%,
            var(--parchment-burn) 100%
        );

    box-shadow:

        inset 2px 0 2px
        rgba(72, 39, 18, .18),

        inset -2px 0 2px
        rgba(72, 39, 18, .18);
}

.cs-scroll__roll--left
.cs-scroll__roll-body {
    inset-inline-start:
        1px;
}

.cs-scroll__roll--right
.cs-scroll__roll-body {
    inset-inline-end:
        1px;
}


/*//////////////PAPER CONNECTION//////////////*/

.cs-scroll__roll-body::after {
    content:
        "";

    position:
        absolute;

    z-index:
        -1;

    inset-block:
        2px;

    inline-size:
        8px;

    opacity:
        .97;
}

.cs-scroll__roll--left
.cs-scroll__roll-body::after {
    inset-inline-start:
        8px;

    background:

        linear-gradient(
            90deg,
            var(--parchment-mid),
            var(--parchment-light) 42%,
            var(--parchment)
        );
}

.cs-scroll__roll--right
.cs-scroll__roll-body::after {
    inset-inline-end:
        8px;

    background:

        linear-gradient(
            90deg,
            var(--parchment),
            var(--parchment-light) 58%,
            var(--parchment-mid)
        );
}


/*//////////////ROLL SEAM//////////////*/

.cs-scroll__roll-seam {
    position:
        absolute;

    z-index:
        4;

    inset-block:
        7px;

    inline-size:
        1px;

    background:

        linear-gradient(
            180deg,
            transparent,
            rgba(74, 42, 20, .4) 12% 88%,
            transparent
        );
}

.cs-scroll__roll--left
.cs-scroll__roll-seam {
    inset-inline-start:
        7px;
}

.cs-scroll__roll--right
.cs-scroll__roll-seam {
    inset-inline-end:
        7px;
}


/*//////////////SCROLL HANDLES//////////////*/

.cs-scroll__handle {
    position:
        absolute;

    z-index:
        8;

    inline-size:
        10px;

    block-size:
        6px;

    border-radius:
        50%;

    background:

        radial-gradient(
            ellipse at 50% 50%,
            #b37d4c 0 8%,
            var(--scroll-wood-light) 10% 30%,
            var(--scroll-wood) 32% 55%,
            var(--scroll-wood-dark) 57% 72%,
            transparent 74%
        );
}

.cs-scroll__roll--left
.cs-scroll__handle {
    inset-inline-start:
        2px;
}

.cs-scroll__roll--right
.cs-scroll__handle {
    inset-inline-end:
        2px;
}

.cs-scroll__handle--top {
    inset-block-start:
        -2px;
}

.cs-scroll__handle--bottom {
    inset-block-end:
        -2px;
}

.cs-scroll__handle i {
    position:
        absolute;

    inset-inline-start:
        50%;

    inset-block-start:
        50%;

    inline-size:
        3px;

    block-size:
        3px;

    transform:
        translate(-50%, -50%);

    border-radius:
        50%;

    background:
        var(--scroll-wood-dark);
}


/*//////////////SCROLL REVEAL//////////////*/

.cs-bubble.cs-event:not(
    :is(
        .cs-event-action,
        .cs-event-cheer,
        .cs-event-highlight,
        .cs-event-channel-points,
        .cs-event-gigantified
    )
)
.cs-scroll__paper {
    animation:
        scroll-paper-open
        800ms
        30ms
        cubic-bezier(.2, .7, .18, 1)
        both;
}

.cs-bubble.cs-event:not(
    :is(
        .cs-event-action,
        .cs-event-cheer,
        .cs-event-highlight,
        .cs-event-channel-points,
        .cs-event-gigantified
    )
)
.cs-scroll__roll--left {
    animation:
        scroll-roll-left
        800ms
        30ms
        cubic-bezier(.2, .7, .18, 1)
        both;
}

.cs-bubble.cs-event:not(
    :is(
        .cs-event-action,
        .cs-event-cheer,
        .cs-event-highlight,
        .cs-event-channel-points,
        .cs-event-gigantified
    )
)
.cs-scroll__roll--right {
    animation:
        scroll-roll-right
        800ms
        30ms
        cubic-bezier(.2, .7, .18, 1)
        both;
}

.cs-bubble.cs-event:not(
    :is(
        .cs-event-action,
        .cs-event-cheer,
        .cs-event-highlight,
        .cs-event-channel-points,
        .cs-event-gigantified
    )
)
.cs-scroll__shadow {
    animation:
        scroll-shadow-in
        600ms
        100ms
        ease-out
        both;
}

.cs-bubble.cs-event:not(
    :is(
        .cs-event-action,
        .cs-event-cheer,
        .cs-event-highlight,
        .cs-event-channel-points,
        .cs-event-gigantified,
        .cs-event-raid
    )
)
.cs-user {
    animation:
        event-content-in
        330ms
        690ms
        ease-out
        both;
}

.cs-bubble.cs-event:not(
    :is(
        .cs-event-action,
        .cs-event-cheer,
        .cs-event-highlight,
        .cs-event-channel-points,
        .cs-event-gigantified,
        .cs-event-raid
    )
)
.cs-content {
    animation:
        event-content-in
        360ms
        730ms
        ease-out
        both;
}


/*//////////////GIFT EVENTS//////////////*/

.cs-bubble.cs-event:is(
    .cs-event-subgift,
    .cs-event-mystery-gift,
    .cs-event-reward-gift
)
.cs-surface {
    padding-inline-end:
        31px;
}


/*//////////////WAX SEAL//////////////*/

.cs-bubble.cs-event:is(
    .cs-event-subgift,
    .cs-event-mystery-gift,
    .cs-event-reward-gift
)
.cs-scroll__paper::after {
    content:
        "";

    position:
        absolute;

    z-index:
        5;

    inset-inline-end:
        11px;

    inset-block-end:
        7px;

    inline-size:
        12px;

    block-size:
        12px;

    border-radius:
        47% 53% 45% 55%;

    opacity:
        0;

    transform:
        scale(1.55)
        rotate(-7deg);

    background:

        linear-gradient(
            90deg,
            transparent 42%,
            rgba(45, 7, 6, .58) 43% 57%,
            transparent 58%
        ),

        linear-gradient(
            0deg,
            transparent 42%,
            rgba(45, 7, 6, .58) 43% 57%,
            transparent 58%
        ),

        radial-gradient(
            circle at 50% 50%,
            transparent 0 28%,
            rgba(49, 8, 6, .5) 30% 35%,
            transparent 37%
        ),

        radial-gradient(
            circle at 38% 34%,
            rgba(255, 177, 147, .19) 0 7%,
            transparent 9%
        ),

        radial-gradient(
            circle at 50% 50%,
            var(--wax-light) 0 12%,
            var(--wax) 34%,
            var(--wax-dark) 69%,
            var(--wax-black) 100%
        );

    box-shadow:

        inset 1px 1px 1px
        rgba(255, 190, 160, .18),

        inset -1px -1px 2px
        rgba(30, 4, 3, .38),

        0 1px 1.5px
        rgba(50, 28, 16, .32);

    animation:
        wax-stamp
        340ms
        790ms
        cubic-bezier(.18, .78, .16, 1.15)
        both;
}


/*//////////////ANNOUNCEMENT//////////////*/

.cs-bubble.cs-event-announcement
.cs-scroll__watermark {
    opacity:
        .05;
}

.cs-bubble.cs-event-announcement
.cs-scroll__paper::before {
    opacity:
        .26;
}

.cs-bubble.cs-event-announcement
.cs-username {
    font-weight:
        700;
}

.cs-bubble.cs-event-announcement
.cs-message {
    font-weight:
        620;
}


/*//////////////UNRAID//////////////*/

.cs-bubble.cs-event-unraid
.cs-scroll__paper {
    filter:
        saturate(.82)
        brightness(.95);
}

.cs-bubble.cs-event-unraid
.cs-username,

.cs-bubble.cs-event-unraid
.cs-message {
    color:
        var(--event-ink-soft);
}


/*//////////////RAID//////////////*/

.cs-raid-stage {
    display:
        none;

    position:
        absolute;

    z-index:
        10;

    inset:
        0;

    pointer-events:
        none;

    overflow:
        visible;
}

.cs-bubble.cs-event-raid
.cs-raid-stage {
    display:
        block;
}


/*//////////////RAID SPACE//////////////*/

.cs-bubble.cs-event-raid
.cs-surface {
    padding-block-start:
        8px;

    /*
        Echte separate Schwerterzone.
    */

    padding-block-end:
        43px;
}


/*//////////////RAID USER//////////////*/

.cs-bubble.cs-event-raid
.cs-user {
    position:
        relative;

    z-index:
        12;

    animation:
        event-content-in
        320ms
        1460ms
        ease-out
        both;
}


/*//////////////RAID CONTENT//////////////*/

.cs-bubble.cs-event-raid
.cs-content {
    position:
        relative;

    z-index:
        12;

    animation:
        event-content-in
        350ms
        1500ms
        ease-out
        both;
}


/*//////////////RAID SWORDS//////////////*/

.cs-raid-sword {
    --sword-length:
        104px;

    position:
        absolute;

    z-index:
        8;

    inset-inline-start:
        50%;

    inset-block-start:
        auto;

    /*
        Feste Position am unteren
        Rand statt Prozentwert.
    */

    inset-block-end:
        7px;

    display:
        flex;

    align-items:
        center;

    inline-size:
        var(--sword-length);

    block-size:
        19px;

    opacity:
        0;

    transform-origin:
        center;

    filter:
        drop-shadow(
            0 2px 1px
            rgba(0, 0, 0, .62)
        );
}


/*//////////////POMMEL//////////////*/

.cs-sword__pommel {
    flex:
        0 0 auto;

    inline-size:
        9px;

    block-size:
        9px;

    margin-inline-end:
        -1px;

    clip-path:
        polygon(
            50% 0,
            82% 18%,
            100% 50%,
            82% 82%,
            50% 100%,
            18% 82%,
            0 50%,
            18% 18%
        );

    background:

        radial-gradient(
            circle at 31% 27%,
            var(--brass-glint),
            var(--brass-light) 25%,
            var(--brass) 49%,
            var(--brass-dark) 72%,
            var(--brass-black)
        );
}


/*//////////////GRIP//////////////*/

.cs-sword__grip {
    flex:
        0 0 auto;

    inline-size:
        17px;

    block-size:
        5px;

    border-block:
        1px solid
        #100a06;

    background:

        repeating-linear-gradient(
            116deg,
            #1b100a 0 3px,
            #68432b 3px 4px
        );
}


/*//////////////GUARD//////////////*/

.cs-sword__guard {
    position:
        relative;

    z-index:
        4;

    flex:
        0 0 auto;

    inline-size:
        5px;

    block-size:
        19px;

    margin-inline:
        2px 1px;

    border-radius:
        50%;

    background:

        linear-gradient(
            90deg,
            var(--brass-black),
            var(--brass) 23%,
            var(--brass-glint) 48%,
            var(--brass) 72%,
            var(--brass-black)
        );
}

.cs-sword__guard-tip {
    position:
        absolute;

    inset-inline-start:
        50%;

    inline-size:
        8px;

    block-size:
        3px;

    transform:
        translateX(-50%);

    border-radius:
        50%;

    background:

        linear-gradient(
            90deg,
            var(--brass-black),
            var(--brass-light),
            var(--brass-dark)
        );
}

.cs-sword__guard-tip--top {
    inset-block-start:
        0;

    transform:
        translateX(-50%)
        rotate(-8deg);
}

.cs-sword__guard-tip--bottom {
    inset-block-end:
        0;

    transform:
        translateX(-50%)
        rotate(8deg);
}


/*//////////////RICASSO//////////////*/

.cs-sword__ricasso {
    flex:
        0 0 auto;

    inline-size:
        6px;

    block-size:
        8px;

    margin-inline-start:
        -1px;

    clip-path:
        polygon(
            0 12%,
            100% 0,
            100% 100%,
            0 88%
        );

    background:

        linear-gradient(
            180deg,
            var(--iron-glint),
            var(--iron-light) 22%,
            var(--iron-mid) 52%,
            var(--iron-black)
        );
}


/*//////////////BLADE//////////////*/

.cs-sword__blade {
    position:
        relative;

    flex:
        1;

    min-inline-size:
        58px;

    block-size:
        6px;

    margin-inline-start:
        -1px;

    clip-path:
        polygon(
            0 4%,
            calc(100% - 12px) 4%,
            100% 50%,
            calc(100% - 12px) 96%,
            0 96%
        );

    background:

        linear-gradient(
            180deg,
            #ebe8e0 0%,
            #c4c2bc 20%,
            #818285 39%,
            #454749 49%,
            #77797b 55%,
            #bab9b3 75%,
            #dfdcd4 100%
        );
}

.cs-sword__blade::before {
    content:
        "";

    position:
        absolute;

    inset-inline-start:
        3px;

    inset-inline-end:
        13px;

    inset-block-start:
        50%;

    block-size:
        1px;

    transform:
        translateY(-50%);

    background:

        linear-gradient(
            90deg,
            rgba(30, 31, 32, .28),
            rgba(255, 255, 255, .23),
            rgba(35, 36, 38, .31)
        );
}


/*//////////////RAID SWORD REVEAL//////////////*/

.cs-bubble.cs-event-raid
.cs-raid-sword--left {
    animation:
        raid-left
        720ms
        870ms
        cubic-bezier(.2, .74, .2, 1)
        both;
}

.cs-bubble.cs-event-raid
.cs-raid-sword--right {
    animation:
        raid-right
        720ms
        900ms
        cubic-bezier(.2, .74, .2, 1)
        both;
}


/*//////////////RAID SPARKS//////////////*/

.cs-raid-spark {
    position:
        absolute;

    z-index:
        9;

    inset-inline-start:
        50%;

    inset-block-start:
        auto;

    inset-block-end:
        17px;

    inline-size:
        7px;

    block-size:
        1.5px;

    opacity:
        0;

    transform-origin:
        0 50%;

    border-radius:
        50%;

    background:

        linear-gradient(
            90deg,
            #d2b15f,
            #8b5827 50%,
            transparent
        );

    animation:
        raid-spark
        620ms
        890ms
        both;
}

.cs-raid-spark--1 {
    --spark-angle:
        -62deg;

    --spark-distance:
        13px;
}

.cs-raid-spark--2 {
    --spark-angle:
        -17deg;

    --spark-distance:
        11px;
}

.cs-raid-spark--3 {
    --spark-angle:
        38deg;

    --spark-distance:
        13px;
}

.cs-raid-spark--4 {
    --spark-angle:
        106deg;

    --spark-distance:
        10px;
}


/*//////////////AVATAR HIDDEN//////////////*/

.cs-bubble.cs-avatar-hidden:not(
    .cs-event
)
.cs-surface {
    grid-template-columns:
        minmax(0, 1fr);

    grid-template-areas:
        "user"
        "content";
}

.cs-bubble.cs-avatar-hidden
.cs-avatar,

.cs-bubble.cs-avatar-hidden
.cs-role-banner {
    display:
        none !important;
}


/*//////////////INLINE//////////////*/

.cs-bubble.cs-username-position-inline:not(
    .cs-event
)
.cs-surface {
    grid-template-areas:
        "avatar content"
        "avatar content";
}


/*//////////////AVATAR RIGHT//////////////*/

.cs-bubble.cs-avatar-position-right:not(
    .cs-avatar-hidden,
    .cs-event
)
.cs-surface {
    grid-template-columns:
        minmax(0, 1fr)
        auto;

    grid-template-areas:
        "user avatar"
        "content avatar";
}

.cs-bubble.cs-avatar-position-right:not(
    .cs-avatar-hidden,
    .cs-event
)
.cs-role-banner {
    inset-inline-start:
        auto;

    inset-inline-end:
        calc(
            var(
                --cs-bubble-padding-right,
                var(--cs-bubble-padding, 8px)
            )
            + 3px
        );
}


/*//////////////RTL//////////////*/

.cs-bubble.cs-direction-rtl:not(
    .cs-avatar-hidden,
    .cs-event
)
.cs-surface {
    grid-template-columns:
        minmax(0, 1fr)
        auto;

    grid-template-areas:
        "user avatar"
        "content avatar";
}

.cs-bubble.cs-direction-rtl:not(
    .cs-avatar-hidden,
    .cs-event
)
.cs-role-banner {
    inset-inline-start:
        auto;

    inset-inline-end:
        calc(
            var(
                --cs-bubble-padding-right,
                var(--cs-bubble-padding, 8px)
            )
            + 3px
        );
}

.cs-bubble.cs-direction-rtl
.cs-user,

.cs-bubble.cs-direction-rtl
.cs-content {
    direction:
        rtl;
}


/*//////////////RTL NORMAL AVATAR//////////////*/

.cs-bubble.cs-direction-rtl:not(
    .cs-event
)
.cs-avatar {
    animation:
        shield-in-rtl
        470ms
        100ms
        cubic-bezier(.18, .8, .2, 1.04)
        both;
}


/*//////////////FULL WIDTH//////////////*/

.cs-chat.cs-full-width
.cs-bubble,

.cs-chat.cs-full-width
.cs-surface {
    inline-size:
        100%;

    max-inline-size:
        none;
}


/*//////////////HORIZONTAL//////////////*/

.cs-chat.cs-chat--horizontal
.cs-bubble {
    min-inline-size:
        180px;

    max-inline-size:
        300px;
}

            1;

    }

    68% {
        opacity:
            1;

        transform:
            translateX(1px)
            rotate(.5deg)
            scale(1.02);
    }

    100% {

            1;

        transform:
            translateX(0)
            rotate(0)
            scale(1);
    }

            1;

            rotate(0)
            scale(1);
    }

        opacity:
            1;

            blur(0)
            contrast(1.03);
    }
}


/*//////////////EVENT GATE//////////////*/

@keyframes event-gate {

    from {
        opacity:
            0;

        visibility:
            hidden;
    }

    to {
        opacity:
            1;

        visibility:
            visible;
    }
}

        opacity:
            0;

        transform:

            1;
    }

    to {
        opacity:
            1;

        transform:
            scaleX(1);
    }
}


/*//////////////ROLL LEFT//////////////*/

    from {
        opacity:
            0;

            calc(

        opacity:
            1;
    }

    to {
        opacity:
            1;

        inset-inline-start:
            0;
    }

        opacity:
            0;

            1;

            1;

            0;

    18% {

            1;

    52% {

            1;

        transform:
            translateX(-55%)
            rotate(17deg)
            scale(1);

            1;

        transform:

            1;
    }

        opacity:
            1;

        transform:

            1;

        transform:

        opacity:
            1;

        transform:
            translateX(-48%)
            rotate(161deg)

    }

/*//////////////RAID SPARK//////////////*/

@keyframes raid-spark {

    0%,
    43% {

            0;
