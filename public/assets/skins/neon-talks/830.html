            --cs-message-text-stroke-width,
            0px
        )
        var(
            --cs-message-text-stroke-color,
            #000000
        );

    text-shadow:
        var(
            --cs-message-text-shadow-offset-x,
            0px
        )
        var(
            --cs-message-text-shadow-offset-y,
            0px
        )
        var(
            --cs-message-text-shadow-blur-radius,
            0px
        )
        var(
            --cs-message-text-shadow-color,
            transparent
        );

    word-break: break-word;

    vertical-align: middle;
}


/*//////////////EMOTES//////////////*/

.cs-message .emote {
    display: inline-block;

    flex: 0 0 auto;

    width: auto !important;

    inline-size: auto !important;

    height:
        calc(
            var(--cs-message-font-size, 12px)
            * 1.55
        )
        !important;

    block-size:
        calc(
            var(--cs-message-font-size, 12px)
            * 1.55
        )
        !important;

    max-width: none !important;

    max-inline-size: none !important;

    max-height:
        calc(
            var(--cs-message-font-size, 12px)
            * 1.55
        )
        !important;

    max-block-size:
        calc(
            var(--cs-message-font-size, 12px)
            * 1.55
        )
        !important;

    object-fit: contain;

    margin-inline: 2px;

    vertical-align: middle;
}


/*//////////////BADGES HIDDEN//////////////*/

.cs-bubble.cs-badges-hidden .cs-badges,
.cs-bubble.cs-badges-hidden .cs-badges--inline {
    display: none;
}


/*//////////////RTL BUBBLE//////////////*/

.cs-bubble.cs-direction-rtl {
    direction: ltr;

    grid-template-columns:
        minmax(0, 1fr)
        auto;
}


/*//////////////RTL AVATAR//////////////*/

.cs-bubble.cs-direction-rtl .cs-header {
    grid-column: 2;
    grid-row: 1;

    animation-name:
        vapor-avatar-track-enter-rtl;
}


/*//////////////RTL CONTENT//////////////*/

.cs-bubble.cs-direction-rtl .cs-content {
    grid-column: 1;
    grid-row: 1;

    direction: rtl;

    animation-name:
        vapor-content-enter-rtl;
}


/*//////////////RTL BORDER TRACE//////////////*/

.cs-bubble.cs-direction-rtl .cs-content::before,
.cs-bubble.cs-direction-rtl .cs-content::after {
    background:
        linear-gradient(
            var(--vapor-neon),
            var(--vapor-neon)
        )
        top right /
        0%
        var(--vapor-border-width)
        no-repeat,

        linear-gradient(
            var(--vapor-neon),
            var(--vapor-neon)
        )
        top left /
        var(--vapor-border-width)
        0%
        no-repeat,

        linear-gradient(
            var(--vapor-neon),
            var(--vapor-neon)
        )
        bottom left /
        0%
        var(--vapor-border-width)
        no-repeat,

        linear-gradient(
            var(--vapor-neon),
            var(--vapor-neon)
        )
        bottom right /
        var(--vapor-border-width)
        0%
        no-repeat;

    animation-name:
        vapor-border-trace-rtl;
}


/*//////////////RTL INLINE//////////////*/

.cs-bubble.cs-direction-rtl .cs-user--inline {
    direction: rtl;
}

.cs-bubble.cs-direction-rtl .cs-username--inline {
    direction: rtl;
}

.cs-bubble.cs-direction-rtl .cs-message {
    direction: rtl;
}


/*//////////////AVATAR HIDDEN//////////////*/

.cs-bubble.cs-avatar-hidden,
.cs-bubble:has(.cs-avatar:empty) {
    grid-template-columns:
        minmax(0, 1fr);

    column-gap: 0;
}

.cs-bubble.cs-avatar-hidden .cs-header,
.cs-bubble:has(.cs-avatar:empty) .cs-header {
    display: none;
}

.cs-bubble.cs-avatar-hidden .cs-content,
.cs-bubble:has(.cs-avatar:empty) .cs-content {
    grid-column: 1;
    grid-row: 1;
}


/*//////////////EVENTS//////////////*/

.cs-bubble.cs-event {
    grid-template-columns:
        var(--vapor-avatar-track)
        minmax(0, 1fr);

    column-gap: 0;
}

.cs-bubble.cs-event .cs-header {
    display: none;
}

.cs-bubble.cs-event .cs-content {
    grid-column: 2;
    grid-row: 1;

    text-align: center;

    padding-block-start:
        var(
            --cs-bubble-padding-top,
            var(--cs-bubble-padding, 5px)
        );

    padding-block-end:
        var(
            --cs-bubble-padding-bottom,
            var(--cs-bubble-padding, 5px)
        );

    animation-name:
        vapor-event-enter;
}

.cs-bubble.cs-event .cs-user--inline {
    justify-content: center;
}

.cs-bubble.cs-event .cs-username--inline {
    text-align: center;
}

.cs-bubble.cs-event .cs-message {
    text-align: center;
}


/*//////////////EVENTS RTL//////////////*/

.cs-bubble.cs-event.cs-direction-rtl {
    direction: ltr;

    grid-template-columns:
        minmax(0, 1fr)
        var(--vapor-avatar-track);
}

.cs-bubble.cs-event.cs-direction-rtl .cs-content {
    grid-column: 1;
    grid-row: 1;

    direction: rtl;

    text-align: center;

    animation-name:
        vapor-event-enter;
}


/*//////////////FULL WIDTH//////////////*/

.cs-chat.cs-full-width .cs-bubble {
    inline-size: 100%;

    max-inline-size: none;
}


/*//////////////CONTENT REVEAL//////////////*/

@keyframes vapor-content-enter {
    0% {
        opacity: 0;

        transform:
            translateX(-6px)
            translateY(2px);
    }

    35% {
        opacity: .3;
    }

    72% {
        opacity: 1;

        transform:
            translateX(0)
            translateY(0);
    }

    100% {
        opacity: 1;

        transform:
            translateX(0)
            translateY(0);
    }
}


/*//////////////CONTENT REVEAL RTL//////////////*/

@keyframes vapor-content-enter-rtl {
    0% {
        opacity: 0;

        transform:
            translateX(6px)
            translateY(2px);
    }

    35% {
        opacity: .3;
    }

    72% {
        opacity: 1;

        transform:
            translateX(0)
            translateY(0);
    }

    100% {
        opacity: 1;

        transform:
            translateX(0)
            translateY(0);
    }
}


/*//////////////BORDER TRACE//////////////*/

@keyframes vapor-border-trace {
    0% {
        background-size:
            0% var(--vapor-border-width),
            var(--vapor-border-width) 0%,
            0% var(--vapor-border-width),
            var(--vapor-border-width) 0%;
    }

    25% {
        background-size:
            100% var(--vapor-border-width),
            var(--vapor-border-width) 0%,
            0% var(--vapor-border-width),
            var(--vapor-border-width) 0%;
    }

    50% {
        background-size:
            100% var(--vapor-border-width),
            var(--vapor-border-width) 100%,
            0% var(--vapor-border-width),
            var(--vapor-border-width) 0%;
    }

    75% {
        background-size:
            100% var(--vapor-border-width),
            var(--vapor-border-width) 100%,
            100% var(--vapor-border-width),
            var(--vapor-border-width) 0%;
    }

    100% {
        background-size:
            100% var(--vapor-border-width),
            var(--vapor-border-width) 100%,
            100% var(--vapor-border-width),
            var(--vapor-border-width) 100%;
    }
}


/*//////////////BORDER TRACE RTL//////////////*/

@keyframes vapor-border-trace-rtl {
    0% {
        background-size:
            0% var(--vapor-border-width),
            var(--vapor-border-width) 0%,
            0% var(--vapor-border-width),
            var(--vapor-border-width) 0%;
    }

    25% {
        background-size:
            100% var(--vapor-border-width),
            var(--vapor-border-width) 0%,
            0% var(--vapor-border-width),
            var(--vapor-border-width) 0%;
    }

    50% {
        background-size:
            100% var(--vapor-border-width),
            var(--vapor-border-width) 100%,
            0% var(--vapor-border-width),
            var(--vapor-border-width) 0%;
    }

    75% {
        background-size:
            100% var(--vapor-border-width),
            var(--vapor-border-width) 100%,
            100% var(--vapor-border-width),
            var(--vapor-border-width) 0%;
    }

    100% {
        background-size:
            100% var(--vapor-border-width),
            var(--vapor-border-width) 100%,
            100% var(--vapor-border-width),
            var(--vapor-border-width) 100%;
    }
}


/*//////////////AVATAR REVEAL//////////////*/

@keyframes vapor-avatar-track-enter {
    0% {
        opacity: 0;

        transform:
            translateX(-20px)
            scale(.96);
    }

    28% {
        opacity: .15;
    }

    55% {
        opacity: .72;
    }

    82% {
        opacity: 1;

        transform:
            translateX(1px)
            scale(1);
    }

    100% {
        opacity: 1;

        transform:
            translateX(0)
            scale(1);
    }
}


/*//////////////AVATAR REVEAL RTL//////////////*/

@keyframes vapor-avatar-track-enter-rtl {
    0% {
        opacity: 0;

        transform:
            translateX(20px)
            scale(.96);
    }

    28% {
        opacity: .15;
    }

    55% {
        opacity: .72;
    }

    82% {
        opacity: 1;

        transform:
            translateX(-1px)
            scale(1);
    }

    100% {
        opacity: 1;

        transform:
            translateX(0)
            scale(1);
    }
}


/*//////////////EVENT REVEAL//////////////*/

@keyframes vapor-event-enter {
    0% {
        opacity: 0;

        transform:
            translateY(3px);
    }

    45% {
        opacity: .5;
    }

    100% {
        opacity: 1;

        transform:
            translateY(0);
    }
}


/*//////////////REDUCED MOTION//////////////*/

@media (prefers-reduced-motion: reduce) {
    .cs-content,
    .cs-content::before,
    .cs-content::after,
    .cs-header {
        animation-duration: 1ms;
        animation-delay: 0ms;
    }
}
