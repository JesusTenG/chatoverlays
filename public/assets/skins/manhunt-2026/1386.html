        opacity: 1;

        letter-spacing: .17em;

        transform:
            translate3d(
                0,
                -50%,
                0
            )
            scaleX(1);

        filter:
            blur(0);
    }

    65% {
        opacity: 1;

        letter-spacing: .17em;

        transform:
            translate3d(
                0,
                -50%,
                0
            )
            scaleX(1);

        filter:
            blur(0);
    }

    72% {
        opacity: .96;

        letter-spacing: .16em;

        transform:
            translate3d(
                -1px,
                -50%,
                0
            )
            scaleX(.995);

        filter:
            blur(.1px);
    }

    78% {
        opacity: .76;

        letter-spacing: .145em;

        transform:
            translate3d(
                -3px,
                -50%,
                0
            )
            scaleX(.985);

        filter:
            blur(.45px);
    }

    83% {
        opacity: .50;

        letter-spacing: .125em;

        transform:
            translate3d(
                -6px,
                -50%,
                0
            )
            scaleX(.97);

        filter:
            blur(.9px);
    }

    88% {

        letter-spacing: .105em;

        transform:
            translate3d(

/*//////////////SVG DRAW//////////////////*/

@keyframes mh-event-svg-draw {

    from {
        stroke-dashoffset: 1;
    }

    to {
        stroke-dashoffset: 0;
    }
}


/*//////////////SVG FILL//////////////////*/

@keyframes mh-event-svg-fill {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}


/*//////////////FINAL SVG REVEAL//////////////////*/

@keyframes mh-event-final-mark-reveal {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}


/*//////////////EVENT CONTENT REVEAL//////////////////*/

@keyframes mh-event-content-reveal {

    from {
        opacity: 0;

        transform:
            translate3d(
                8px,
                0,
                0
            );
    }

    to {
        opacity: 1;

        transform:
            translate3d(
                0,
                0,
                0
            );
    }
}


/*//////////////EVENT INTRO HIDE//////////////////*/

@keyframes mh-event-intro-hide {

    to {
        visibility: hidden;
    }
}


/*//////////////FINAL SVG HANDOFF//////////////////*/

.cs-bubble.cs-event
.mh-mark {
    animation:
        mh-event-mark-settle
        1s
        3.31s
        cubic-bezier(.22, 1, .36, 1)
        both,

        mh-event-energy-breathe
        5s
        4.75s
        ease-in-out
        infinite;

    will-change:
        filter;
}


/*//////////////FINAL SVG SETTLE//////////////////*/

@keyframes mh-event-mark-settle {

    0% {
        filter:
            drop-shadow(
                0 0 4px
                var(--mh-glow)
            )
            drop-shadow(
                0 0 11px
                var(--mh-glow)
            )
            drop-shadow(
                0 0 21px
                var(--mh-glow-medium)
            );
    }

    35% {
        filter:
            drop-shadow(
                0 0 3px
                var(--mh-glow)
            )
            drop-shadow(
                0 0 8px
                var(--mh-glow-medium)
            )
            drop-shadow(
                0 0 14px
                var(--mh-glow-soft)
            );
    }

    100% {
        filter:
            drop-shadow(
                0 0 0
                transparent
            )
            drop-shadow(
                0 0 0
                transparent
            )
            drop-shadow(
                0 0 0
                transparent
            );
    }
}


/*//////////////SIMPLE WHITE IDLE GLOW//////////////////*/

@keyframes mh-event-energy-breathe {

    /*//////////////START WEISS//////////////////*/

    0% {
        color: #ffffff;

        filter:
            drop-shadow(
                0 0 0
                transparent
            )
            drop-shadow(
                0 0 0
                transparent
            )
            drop-shadow(
                0 0 0
                transparent
            );
    }


    /*//////////////SOFTER AUFBAU//////////////////*/

    15% {
        color: #ffffff;

        filter:
            drop-shadow(
                0 0 1px
                var(--mh-glow-soft)
            )
            drop-shadow(
                0 0 3px
                var(--mh-glow-soft)
            )
            drop-shadow(
                0 0 7px
                var(--mh-glow-soft)
            );
    }


    /*//////////////EIN PEAK//////////////////*/

    30% {
        color: #ffffff;

        filter:
            drop-shadow(
                0 0 3px
                var(--mh-glow)
            )
            drop-shadow(
                0 0 8px
                var(--mh-glow)
            )
            drop-shadow(
                0 0 16px
                var(--mh-glow-medium)
            );
    }


    /*//////////////SOFTER RELEASE//////////////////*/

    45% {
        color: #ffffff;

        filter:
            drop-shadow(
                0 0 1px
                var(--mh-glow-soft)
            )
            drop-shadow(
                0 0 3px
                var(--mh-glow-soft)
            )
            drop-shadow(
                0 0 7px
                var(--mh-glow-soft)
            );
    }


    /*//////////////GLOW KOMPLETT AUS//////////////////*/

    60% {
        color: #ffffff;

        filter:
            drop-shadow(
                0 0 0
                transparent
            )
            drop-shadow(
                0 0 0
                transparent
            )
            drop-shadow(
                0 0 0
                transparent
            );
    }


    /*//////////////2 SEKUNDEN REINES WEISS//////////////////*/

    100% {
        color: #ffffff;

        filter:
            drop-shadow(
                0 0 0
                transparent
            )
            drop-shadow(
                0 0 0
                transparent
            )
            drop-shadow(
                0 0 0
                transparent
            );
    }
}


/*//////////////REDUCED MOTION//////////////////*/

@media (prefers-reduced-motion: reduce) {

    .mh-event-intro {
        display: none !important;
    }

    .mh-mark-slot {
        opacity: 1 !important;

        animation: none !important;
    }

    .mh-main {
        opacity: 1 !important;

        transform: none !important;

        animation: none !important;
    }

    .mh-mark {
        color: #ffffff !important;

        opacity: 1 !important;

        filter: none !important;

        animation: none !important;
    }

    .mh-mark path {
        stroke: transparent !important;

        stroke-opacity: 0 !important;

        animation: none !important;
    }
}
.cs-bubble {
    --cs-username-font-color: #FFB3E5;
}

.cs-bubble .mh-mark {
    color: #FF00AA;
}

.cs-bubble .mh-event-mark-fill {
    fill: #FF00AA;
}
