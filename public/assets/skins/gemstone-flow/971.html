html,
body{
    margin:0;
    padding:0;
    overflow:visible;
    background:transparent;
    font-family:"Bitter",Georgia,serif;
}

*,
*::before,
*::after{
    box-sizing:border-box;
}


/*//////////////CHAT//////////////*/

.cs-chat{
    --cs-bubble-gap:5px;
}


/*//////////////BUBBLE//////////////*/

.cs-bubble{
    --gold:var(--cs-bubble-border-color,#d6aa3e);
    --gold-light:#fff0a6;
    --gold-mid:#b47c16;
    --gold-dark:#654107;

    --surface-a:
        var(
            --cs-bubble-background-color,
            #211b10
        );

    --surface-b:
        color-mix(
            in srgb,
            var(--surface-a) 30%,
            #000 70%
        );

    --text:
        var(
            --cs-message-font-color,
            #fffaf0
        );

    --name:
        var(
            --cs-username-font-color,
            #ffecaa
        );

    --avatar-edge:
        var(
            --cs-avatar-border-color,
            var(--gold)
        );

    --gem:
        var(
            --cs-usercolor,
            #d6aa3e
        );

    --gem-dark:
        color-mix(
            in srgb,
            var(--gem) 66%,
            #000 34%
        );

    --gem-light:
        color-mix(
            in srgb,
            var(--gem) 76%,
            #fff 24%
        );

    --gem-glow:
        color-mix(
            in srgb,
            var(--gem) 52%,
            transparent
        );


    /*//////////////FONTS//////////////*/

    --cs-username-font-family:"Libre Baskerville";
    --cs-message-font-family:"Bitter";


    /*//////////////LAYOUT//////////////*/

    --radius:1.35rem;

    --gem-size:.94rem;

    --rail-position:-2.7rem;

    --rail-size:24px;

    --rail-step:84px;

    --outer:
        rgba(
            218,
            168,
            43,
            .23
        );

    --outer-soft:
        rgba(
            218,
            168,
            43,
            .08
        );


    /*//////////////ANIMATION//////////////*/

    --cs-bubble-animation:
        baroque-bubble-reveal;

    --cs-bubble-animation-duration:
        420ms;

    --cs-bubble-animation-delay:
        0ms;

    --cs-bubble-animation-timing-function:
        cubic-bezier(.22,.7,.22,1);


    --cs-avatar-animation:
        baroque-avatar-reveal;

    --cs-avatar-animation-duration:
        460ms;

    --cs-avatar-animation-delay:
        120ms;

    --cs-avatar-animation-timing-function:
        cubic-bezier(.22,.7,.22,1);


    --cs-username-animation:
        baroque-user-reveal;

    --cs-username-animation-duration:
        440ms;

    --cs-username-animation-delay:
        220ms;

    --cs-username-animation-timing-function:
        cubic-bezier(.22,.7,.22,1);


    --cs-message-animation:
        baroque-message-reveal;

    --cs-message-animation-duration:
        480ms;

    --cs-message-animation-delay:
        320ms;

    --cs-message-animation-timing-function:
        cubic-bezier(.22,.7,.22,1);


    position:relative;

    isolation:isolate;

    display:inline-grid;

    grid-template-columns:
        6.4rem
        minmax(14rem,auto);

    grid-template-rows:
        auto
        1fr;

    width:fit-content;

    min-width:
        min(
            24rem,
            calc(100vw - 5rem)
        );

    max-width:
        min(
            var(--cs-bubble-width,48rem),
            calc(100vw - 5rem)
        );

    min-height:6.7rem;

    margin:
        .48rem
        .5rem
        .48rem
        4.2rem;

    overflow:visible;

    border:
        1.5px
        solid
        transparent;

    border-radius:
        var(--radius);

    background:
        linear-gradient(
            115deg,
            rgba(255,218,116,.035),
            transparent 28%
        )
        padding-box,

        linear-gradient(
            145deg,
            var(--surface-a),
            var(--surface-b) 74%
        )
        padding-box,

        linear-gradient(
            120deg,
            var(--gold-dark),
            var(--gold) 28%,
            var(--gold-light) 50%,
            var(--gold) 72%,
            var(--gold-dark)
        )
        border-box;

    box-shadow:
        0 .9rem 1.9rem
        rgba(0,0,0,.54),

        0 0 .8rem
        var(--outer),

        0 0 1.8rem
        var(--outer-soft),

        inset 0 1px
        rgba(255,255,255,.07),

        inset 0 0 0 1px
        rgba(255,222,130,.07);

    backface-visibility:hidden;
}


/*//////////////GEMLINE//////////////*/

.cs-bubble::before{
    content:"";

    position:absolute;

    z-index:-1;

    left:
        calc(
            var(--rail-position)
            - (var(--rail-size) / 2)
        );

    top:-1rem;
    bottom:-1rem;

    width:
        var(--rail-size);

    pointer-events:none;

    background:
        radial-gradient(
            circle at 50% 42px,
            #fff8cf 0 1px,
            var(--gold-light) 1.2px 1.7px,
            var(--gold) 1.9px 2.4px,
            transparent 2.7px
        )
        center top /
        100%
        var(--rail-step)
        repeat-y,

        radial-gradient(
            ellipse 9px 12px
            at 100% 50%,
            transparent 0 59%,
            rgba(255,240,166,.74) 60%,
            rgba(214,170,62,.9) 62%,
            rgba(101,65,7,.45) 63%,
            transparent 66%
        )
        left 0
        top 9px /
        11px
        var(--rail-step)
        repeat-y,

        radial-gradient(
            ellipse 9px 12px
            at 0 50%,
            transparent 0 59%,
            rgba(255,240,166,.74) 60%,
            rgba(214,170,62,.9) 62%,
            rgba(101,65,7,.45) 63%,
            transparent 66%
        )
        right 0
        top 51px /
        11px
        var(--rail-step)
        repeat-y,

        radial-gradient(
            ellipse 4px 2px
            at 78% 50%,
            var(--gold-light) 0,
            var(--gold) 44%,
            transparent 67%
        )
        left 4px
        top 29px /
        9px
        var(--rail-step)
        repeat-y,

        radial-gradient(
            ellipse 4px 2px
            at 22% 50%,
            var(--gold-light) 0,
            var(--gold) 44%,
            transparent 67%
        )
        right 4px
        top 70px /
        9px
        var(--rail-step)
        repeat-y,

        linear-gradient(
            90deg,
            transparent
            calc(50% - 1.4px),

            #4f3104
            calc(50% - 1.4px),

            #8c5a0b
            calc(50% - .95px),

            var(--gold)
            calc(50% - .45px),

            var(--gold-light)
            50%,

            var(--gold)
            calc(50% + .45px),

            #8c5a0b
            calc(50% + .95px),

            #4f3104
            calc(50% + 1.4px),

            transparent
            calc(50% + 1.4px)
        );

    filter:
        drop-shadow(
            0 0 2px
            rgba(214,170,62,.42)
        )

        drop-shadow(
            0 0 5px
            rgba(214,170,62,.1)
        );

    animation:
        baroque-rail-down
        720ms
        55ms
        cubic-bezier(.22,.7,.22,1)
        both;
}


/*//////////////VERTICAL FLOW//////////////*/

.cs-chat.cs-chat--top-down
.cs-bubble::before,

.cs-chat.cs-chat--bottom-up
.cs-bubble::before{
    animation:
        baroque-rail-down
        720ms
        55ms
        cubic-bezier(.22,.7,.22,1)
        both!important;
}


/*//////////////DEFAULT GEM//////////////*/

.cs-bubble::after{
    content:none;
}


/*//////////////HEADER//////////////*/

.cs-header{
    display:contents;
}


/*//////////////AVATAR//////////////*/

.cs-avatar{
    position:relative;

    z-index:2;

    grid-column:1;

    grid-row:1 / 3;

    display:block;

    width:100%;

    height:100%;

    min-width:0;

    min-height:100%;

    padding:0;

    overflow:hidden;

    border-right:
        1.5px
        solid
        var(--avatar-edge);

    border-radius:
        calc(var(--radius) - 1.5px)
        0
        0
        calc(var(--radius) - 1.5px);

    background:
        var(
            --cs-avatar-background-color,
            #090704
        );

    box-shadow:
        inset -1px 0
        rgba(255,245,207,.13),

        .5rem 0 1.15rem
        rgba(0,0,0,.27);
}


/*//////////////AVATAR OVERLAY//////////////*/

.cs-avatar::before{
    content:"";

    position:absolute;

    z-index:4;

    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.16),
            transparent 31%
        ),

        linear-gradient(
            0deg,
            rgba(0,0,0,.35),
            transparent 58%
        );

    box-shadow:
        inset 0 0 0 1px
        rgba(255,238,175,.13),

        inset 0 0 1.1rem
        rgba(0,0,0,.24);
}


/*//////////////AVATAR IMAGE//////////////*/

.cs-avatar > *,
.cs-avatar img{
    display:block!important;

    width:100%!important;

    height:100%!important;

    min-width:100%!important;

    min-height:100%!important;

    max-width:none!important;

    max-height:none!important;

    margin:0!important;

    padding:0!important;

    border:0!important;

    border-radius:0!important;

    object-fit:cover!important;

    object-position:center!important;

    background-size:cover!important;

    background-position:center!important;

    background-repeat:no-repeat!important;

    backface-visibility:hidden;
}


/*//////////////USER//////////////*/

.cs-user{
    position:relative;

    z-index:3;

    grid-column:2;

    grid-row:1;

    display:flex;

    align-items:center;

    gap:4px;

    min-width:0;

    padding:
        1rem
        2.5rem
        .25rem
        1.35rem;
}


/*//////////////USERNAME//////////////*/

.cs-username,
.cs-username--inline{
    min-width:0;

    max-width:100%;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;

    color:
        var(--name);

    font-family:
        var(
            --cs-username-font-family,
            "Libre Baskerville"
        ),
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        var(
            --cs-username-font-size,
            clamp(
                1.3rem,
                3.1vw,
                1.65rem
            )
        );

    font-weight:
        var(
            --cs-username-font-weight,
            700
        );

    line-height:1;

    letter-spacing:.008em;

    text-shadow:
        var(
            --cs-username-text-shadow-offset-x,
            0
        )

        var(
            --cs-username-text-shadow-offset-y,
            2px
        )

        var(
            --cs-username-text-shadow-blur-radius,
            .3rem
        )

        var(
            --cs-username-text-shadow-color,
            rgba(0,0,0,.96)
        );
}


/*//////////////PRONOUNS//////////////*/

.cs-pronouns{
    color:
        var(
            --cs-pronouns-font-color,
            currentColor
        );

    background-color:
        var(
            --cs-pronouns-background-color,
            transparent
        );
}


/*//////////////BADGES//////////////*/

.cs-badges{
    flex-shrink:0;
}

.cs-badges img,
.cs-badges--inline img{
    object-fit:contain;
}


/*//////////////CONTENT//////////////*/

.cs-content{
    position:relative;

    z-index:2;

    grid-column:2;

    grid-row:2;

    min-width:14rem;

    max-width:39rem;

    padding:
        .28rem
        2.5rem
        1rem
        1.35rem;
}


/*//////////////MESSAGE//////////////*/

.cs-message{
    width:auto;

    min-width:0;

    max-width:36rem;

    color:
        var(--text);

    font-family:
        var(
            --cs-message-font-family,
            "Bitter"
        ),
        Georgia,
        serif;

    font-size:
        var(
            --cs-message-font-size,
            clamp(
                .98rem,
                2.1vw,
                1.12rem
            )
        );

    font-weight:
        var(
            --cs-message-font-weight,
            600
        );

    line-height:1.45;

    letter-spacing:.001em;

    overflow-wrap:anywhere;

    word-break:normal;

    text-shadow:
        var(
            --cs-message-text-shadow-offset-x,
            0
        )

        var(
            --cs-message-text-shadow-offset-y,
            1px
        )

        var(
            --cs-message-text-shadow-blur-radius,
            .24rem
        )

        var(
            --cs-message-text-shadow-color,
            rgba(0,0,0,.96)
        );
}


/*//////////////MESSAGE MEDIA//////////////*/

.cs-message img{
    display:inline-block;

    width:auto;

    max-width:100%;

    height:auto;

    max-height:1.45em;

    vertical-align:middle;
}


/*//////////////INNER DECORATION//////////////*/

.cs-user::after,
.cs-content::after{
    content:none!important;

    display:none!important;
}


/*//////////////GEMSTONE//////////////*/

.cs-bubble:is(

    .cs-vip,
    .cs-mod,
    .cs-broadcaster,
    .cs-event

        ),

        linear-gradient(
            45deg,

            transparent
            0 65%,

            color-mix(
                in srgb,
                var(--gem) 58%,
                #fff 42%
            )
            66% 73%,

        ),

        );

        .07rem
        .12rem

        .14rem

        0 0 0 2.6px
        rgba(63,39,4,.96),

        0 0 .4rem

    pointer-events:none;

    animation:
        baroque-gem-reveal

        200ms
        cubic-bezier(.22,.7,.22,1)
        both;
}
