/*//////////////CHAT//////////////*/

.cs-chat {
    --cs-silver-dark: #5a5a5f;
    --cs-silver-mid: #8f8f96;
    --cs-silver-light: #d8d8dc;

    --cs-avatar-box-size:
        calc(
            var(--cs-avatar-size, 28px)
            + var(--cs-avatar-padding-left, var(--cs-avatar-padding, 0px))
            + var(--cs-avatar-padding-right, var(--cs-avatar-padding, 0px))
            + var(--cs-avatar-border-width, 1px)
            + var(--cs-avatar-border-width, 1px)
        );

    --cs-avatar-gap: 8px;

    --cs-compact-avatar-track:
        calc(
            var(--cs-avatar-box-size)
            + var(--cs-avatar-gap)
        );

    --cs-message-reveal-duration: 1450ms;
    --cs-avatar-reveal-duration: 450ms;
    --cs-avatar-reveal-delay: 1000ms;

    gap:
        var(
            --cs-bubble-gap,
            4px
        );

    padding-block-start:
        var(
            --cs-chat-padding-top,
            var(--cs-chat-padding, 6px)
        );

    padding-inline-end:
        var(
            --cs-chat-padding-right,
            var(--cs-chat-padding, 10px)
        );

    padding-block-end:
        var(
            --cs-chat-padding-bottom,
            var(--cs-chat-padding, 6px)
        );

    padding-inline-start:
        var(
            --cs-chat-padding-left,
            var(--cs-chat-padding, 10px)
        );
}


/*//////////////BUBBLE//////////////*/

.cs-bubble {
    position: relative;

    display: grid;

    grid-template-columns:
        auto
        minmax(0, 1fr);

    align-items: center;

    column-gap:
        var(--cs-avatar-gap);

    max-inline-size:
        var(
            --cs-bubble-width,
            650px
        );

    padding: 0;

    background: transparent;

    border: 0;

    box-shadow: none;

    line-height: 1.35;

    animation-name:
        var(
            --cs-bubble-animation,
            none
        );

    animation-duration:
        var(
            --cs-bubble-animation-duration,
            750ms
        );

    animation-delay:
        var(
            --cs-bubble-animation-delay,
            0ms
        );

    animation-timing-function:
        var(
            --cs-bubble-animation-timing-function,
            ease-out
        );

    animation-fill-mode: both;
}


/*//////////////HEADER//////////////*/

.cs-header {
    position: relative;

    grid-column: 1;
    grid-row: 1;

    display: flex;

    align-items: center;
    justify-content: center;

    min-inline-size: 0;
}


/*//////////////HEADER USER//////////////*/

.cs-header .cs-user {
    display: none;
}


/*//////////////AVATAR//////////////*/

.cs-avatar {
    position: relative;
    z-index: 3;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    will-change:
        transform,
        opacity;

    animation:
        cs-avatar-enter
        var(--cs-avatar-reveal-duration)
        cubic-bezier(.16, 1, .3, 1)
        var(--cs-avatar-reveal-delay)
        both;
}

.cs-avatar img {
    box-sizing: content-box;

    inline-size:
        var(
            --cs-avatar-size,
            28px
        );

    block-size:
        var(
            --cs-avatar-size,
            28px

    object-fit: cover;

    padding-block-start:
        var(
            --cs-avatar-padding-top,
            var(--cs-avatar-padding, 0px)
        );

    padding-inline-end:
        var(
            --cs-avatar-padding-right,
            var(--cs-avatar-padding, 0px)
        );

    padding-block-end:
        var(
            --cs-avatar-padding-bottom,
            var(--cs-avatar-padding, 0px)
        );

    padding-inline-start:
        var(
            --cs-avatar-padding-left,
            var(--cs-avatar-padding, 0px)
        );

    background-color:
        var(
            --cs-avatar-background-color,
            #0a0a0b
        );

    background-image:
        var(
            --cs-avatar-background-gradient,
            none
        );

    background-repeat: no-repeat;

    border-width:
        var(
            --cs-avatar-border-width,
            1px
        );

    border-style:
        var(
            --cs-avatar-border-style,
            solid
        );

    border-color:
        var(
            --cs-avatar-border-color,
            #94949a
        );

    border-start-start-radius:
        var(
            --cs-avatar-border-radius-top-left,
            var(--cs-avatar-border-radius, 4px)
        );

    border-start-end-radius:
        var(
            --cs-avatar-border-radius-top-right,
            var(--cs-avatar-border-radius, 4px)
        );

    border-end-end-radius:

            var(--cs-avatar-border-radius, 4px)

        );

    box-shadow:
        var(

            0px
        )
        var(

            rgb(0 0 0 / 45%)
        );
}


/*//////////////CONTENT//////////////*/

.cs-content {
    position: relative;

    grid-column: 2;

        cubic-bezier(.16, 1, .3, 1)
        both;
}


/*//////////////TRIANGLE LEFT OUTER//////////////*/

.cs-content::before {
    content: "";

    position: absolute;
    z-index: 0;

    left: -8px;
    top: 50%;

    width: 0;
    height: 0;

    transform:
        translateY(-50%);

    border-top:

    border-bottom:
        7px solid transparent;

/*//////////////TRIANGLE LEFT INNER//////////////*/

.cs-content::after {
    content: "";

    z-index: 1;

    top: 50%;

    width: 0;
    height: 0;

    transform:

    border-top:

    border-bottom:

        var(--cs-compact-avatar-track)
        minmax(0, 1fr);

    column-gap: 0;
}

.cs-bubble.cs-event .cs-header {
    display: none;
}

.cs-bubble.cs-event .cs-content {
    grid-column: 2;
    grid-row: 1;

    text-align: center;

    padding-block-start:
        var(
            --cs-bubble-padding-top,
            var(--cs-bubble-padding, 7px)
        );

    padding-inline-end:
        var(
            --cs-bubble-padding-right,
            var(--cs-bubble-padding, 11px)
        );

    padding-block-end:
        var(
            --cs-bubble-padding-bottom,
            var(--cs-bubble-padding, 7px)
        );

    padding-inline-start:
        var(
            --cs-bubble-padding-left,
            var(--cs-bubble-padding, 11px)
        );

    background-color:
        var(
            --cs-bubble-background-color,
            #09090a
        );

    background-image:
        var(
            --cs-bubble-background-gradient,
            linear-gradient(
                180deg,
                rgb(255 255 255 / 4%),
                rgb(255 255 255 / 0%) 65%
            )
        );

    border-color:
        var(
            --cs-bubble-border-color,
            #9a9aa0
        );

    animation:
        cs-event-enter
        380ms
        cubic-bezier(.16, 1, .3, 1)
        both;
}

.cs-bubble.cs-event .cs-content::before,
.cs-bubble.cs-event .cs-content::after {
    display: none;
}

.cs-bubble.cs-event .cs-user--inline {
    justify-content: center;
}

.cs-bubble.cs-event .cs-username--inline {
    text-align: center;
}

.cs-bubble.cs-event .cs-message {
    text-align: center;

    color:
        var(
            --cs-message-font-color,
            #eeeeef
        );
}


/*//////////////EVENTS RTL//////////////*/

.cs-bubble.cs-event.cs-direction-rtl {
    direction: ltr;

    grid-template-columns:
        minmax(0, 1fr)
        var(--cs-compact-avatar-track);
}

.cs-bubble.cs-event.cs-direction-rtl .cs-content {
    grid-column: 1;
    grid-row: 1;

    direction: rtl;

    text-align: center;

    animation-name:
        cs-event-enter;
}


/*//////////////FULL WIDTH//////////////*/

.cs-chat.cs-full-width .cs-bubble {
    inline-size: 100%;

    max-inline-size: none;
}


/*//////////////LTR CONTENT REVEAL//////////////*/

@keyframes cs-content-enter {
    0% {
        opacity: 0;

        transform:
            translateX(
                calc(
                    0px - var(--cs-compact-avatar-track)
                )
            )
            translateY(3px);
    }

    12% {
        opacity: 1;

        transform:
            translateX(
                calc(
                    0px - var(--cs-compact-avatar-track)
                )
            )
            translateY(0);
    }

    68% {
        opacity: 1;

        transform:
            translateX(
                calc(
                    0px - var(--cs-compact-avatar-track)
                )
            );
    }

    90% {
        opacity: 1;

        transform:
            translateX(2px);
    }

    100% {
        opacity: 1;

        transform:
            translateX(0);
    }
}


/*//////////////RTL CONTENT REVEAL//////////////*/

@keyframes cs-content-enter-rtl {
    0% {
        opacity: 0;

        transform:
            translateX(
                var(--cs-compact-avatar-track)
            )
            translateY(3px);
    }

    12% {
        opacity: 1;

        transform:
            translateX(
                var(--cs-compact-avatar-track)
            )
            translateY(0);
    }

    68% {
        opacity: 1;

        transform:
            translateX(
                var(--cs-compact-avatar-track)
            );
    }

    90% {
        opacity: 1;

        transform:
            translateX(-2px);
    }

    100% {
        opacity: 1;

        transform:
            translateX(0);
    }
}


/*//////////////LTR AVATAR REVEAL//////////////*/

@keyframes cs-avatar-enter {
    0% {
        opacity: 0;

        transform:
            translateX(-22px)
            scale(.92);
    }

    30% {
        opacity: 1;
    }

    75% {
        opacity: 1;

        transform:
            translateX(2px)
            scale(1.015);
    }

    100% {
        opacity: 1;

        transform:
            translateX(0)
            scale(1);
    }
}


/*//////////////RTL AVATAR REVEAL//////////////*/

@keyframes cs-avatar-enter-rtl {
    0% {
        opacity: 0;

        transform:
            translateX(22px)
            scale(.92);
    }

    30% {
        opacity: 1;
    }

    75% {
        opacity: 1;

        transform:
            translateX(-2px)
            scale(1.015);
    }

    100% {
        opacity: 1;

        transform:
            translateX(0)
            scale(1);
    }
}


/*//////////////NO AVATAR REVEAL//////////////*/

@keyframes cs-content-enter-no-avatar {
    0% {
        opacity: 0;

        transform:
            translateY(4px)
            scale(.985);
    }

    70% {
        opacity: 1;

        transform:
            translateY(-1px)
            scale(1.002);
    }

    100% {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/*//////////////EVENT REVEAL//////////////*/

@keyframes cs-event-enter {
    0% {
        opacity: 0;

        transform:
            translateY(5px)
            scale(.985);
    }

    65% {
        opacity: 1;

        transform:
            translateY(-1px)
            scale(1.002);
    }

    100% {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/*//////////////REDUCED MOTION//////////////*/

@media (prefers-reduced-motion: reduce) {
    .cs-content,
    .cs-avatar {
        animation-duration: 1ms;
        animation-delay: 0ms;
    }
}
