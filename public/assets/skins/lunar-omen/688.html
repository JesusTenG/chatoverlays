}


/*//////////////HEADER//////////////*/

.cs-header {
    position: relative;
    z-index: 4;

    display: flex;

    align-items: center;

    gap: 8px;

    min-inline-size: 0;

    margin-block-end: 4px;
}


.cs-bubble.cs-avatar-position-left
.cs-header {
    flex-direction: row;
}


.cs-bubble.cs-avatar-position-right
.cs-header {
    flex-direction: row-reverse;
}


.cs-bubble.cs-avatar-position-center
.cs-header {
    flex-direction: column;

    align-items: center;
}


/*//////////////AVATAR//////////////*/

.cs-avatar {
    position: relative;

    flex:
        0
        0
        auto;

    overflow: visible;
}


.cs-avatar::before {
    content: "";

    position: absolute;
    z-index: 2;

    inset: 0;

    pointer-events: none;

    border:
        1px solid
        rgba(0, 0, 0, .86);

    border-radius:
        var(--cs-avatar-border-radius);

    animation:
        cs-lunar-avatar-frame-in
        850ms
        cubic-bezier(.18, .72, .2, 1)
        calc(var(--lunar-delay) + 340ms)
        both;
}


.cs-avatar::after {
    content: "";

    position: absolute;
    z-index: 2;

    inset: 3px;

    pointer-events: none;

    border:
        1px solid
        rgba(255, 255, 255, .18);

    border-radius: 2px;

    animation:
        cs-lunar-avatar-frame-in
        850ms
        cubic-bezier(.18, .72, .2, 1)
        calc(var(--lunar-delay) + 420ms)
        both;
}


.cs-avatar img {
    filter:
        grayscale(.7)
        brightness(.92);
}


/*//////////////USER//////////////*/

.cs-user {
    display: flex;

    align-items: center;

    gap: 5px;

    min-inline-size: 0;
}


/*//////////////INLINE USER//////////////*/

.cs-user--inline {
    transform-origin:
        left center;

    animation-name:
        var(--cs-username-animation, none);

    animation-duration:
        var(--cs-username-animation-duration, 750ms);

    animation-delay:
        var(--cs-username-animation-delay, 0ms);

    animation-timing-function:
        var(
            --cs-username-animation-timing-function,
            ease-out
        );

    animation-fill-mode:
        both;
}


/*//////////////BADGES//////////////*/

.cs-badges {
    display: inline-flex;

    flex:
        0
        0
        auto;

    align-items: center;

    gap: 3px;
}


.cs-badges:empty,
.cs-pronouns:empty {
    display: none;
}


.cs-badges img,
.cs-badges svg {
    display: block;

    flex:
        0
        0
        auto;

    block-size: 18px;
    max-inline-size: 21px;

    padding: 2px;

    object-fit: contain;

    background:
        linear-gradient(
            145deg,
            rgba(238, 234, 222, .18),
            rgba(0, 0, 0, .5)
        );

    border:
        1px solid
        rgba(238, 234, 222, .52);

    border-radius: 4px;

    box-shadow:
        0 2px 5px
        rgba(0, 0, 0, .28);

    filter:
        grayscale(.78);

    transform-origin:
        center;

    animation:
        cs-lunar-badge-in
        650ms
        cubic-bezier(.16, .72, .2, 1)
        calc(var(--lunar-delay) + 450ms)
        both;
}


.cs-badges img:nth-child(2),
.cs-badges svg:nth-child(2) {
    animation-delay:
        calc(var(--lunar-delay) + 500ms);
}


.cs-badges img:nth-child(3),
.cs-badges svg:nth-child(3) {
    animation-delay:
        calc(var(--lunar-delay) + 550ms);
}


.cs-badges img:nth-child(4),
.cs-badges svg:nth-child(4) {
    animation-delay:
        calc(var(--lunar-delay) + 600ms);
}


/*//////////////USERNAME//////////////*/

.cs-username,
.cs-username--inline {
    display: inline-flex;

    align-items: baseline;

    gap: 4px;

    min-inline-size: 0;
    max-inline-size: 100%;

    overflow: visible;

    line-height: 1.18;

    letter-spacing: .025em;

    white-space: nowrap;
}


/*//////////////EVENT USERNAME//////////////*/

.cs-bubble.cs-event
.cs-username,
.cs-bubble.cs-event
.cs-username--inline {
    font-size:
        calc(
            var(--cs-username-font-size, 13px)
            + 2px
        );

    line-height: 1.2;
}


/*//////////////PRONOUNS//////////////*/

.cs-pronouns {
    display: inline-block;

    flex:
        0
        0
        auto;

    color:
        var(--cs-pronouns-font-color);

    font-family:
        var(--cs-pronouns-font-family);

    font-size:
        var(--cs-pronouns-font-size);

    font-weight:
        var(--cs-pronouns-font-weight);

    line-height: 1;

    letter-spacing: .08em;

    text-transform: uppercase;
}


/*//////////////CONTENT//////////////*/

.cs-content {
    position: relative;
    z-index: 4;

    display: block;

    min-inline-size: 0;

    animation:
        cs-lunar-content-in
        900ms
        cubic-bezier(.18, .68, .2, 1)
        calc(var(--lunar-delay) + 500ms)
        both;
}


.cs-user--inline {
    display: none;
}


/*//////////////INLINE USERNAME//////////////*/

.cs-bubble.cs-username-position-inline
.cs-user {
    display: none;
}


.cs-bubble.cs-username-position-inline
.cs-content {
    display: flex;

    align-items: baseline;

    flex-wrap: wrap;

    gap: 5px;
}


.cs-bubble.cs-username-position-inline
.cs-user--inline {
    display: inline-flex;

    align-items: baseline;

    gap: 5px;
}


/*//////////////MESSAGE//////////////*/

.cs-message {
    overflow-wrap: anywhere;

    line-height: 1.32;

    letter-spacing: .008em;
}


.cs-bubble.cs-message-align-center
.cs-message {
    text-align: center;
}


.cs-bubble.cs-message-align-end
.cs-message {
    text-align: end;
}


.cs-message a {
    color: var(--gi);

    text-decoration-color:
        var(--gs);

    text-underline-offset: 3px;
}


/*//////////////MOON PHASES//////////////*/

.cs-phases {
    position: absolute;
    z-index: 14;

    inset-block-end: -12px;
    inset-inline-start: 50%;

    inline-size: 114px;
    block-size: 18px;

    overflow: visible;

    color: var(--gis);

    fill: currentColor;

    stroke: currentColor;
    stroke-width: .8;

    transform:
        translateX(-50%);
}


/*//////////////PHASE LINE//////////////*/

.cs-phase-line {
    fill: none;

    stroke: currentColor;
    stroke-width: .8;

    stroke-linecap: round;

    opacity: 0;

    stroke-dasharray: 28;
    stroke-dashoffset: 28;

    animation:
        cs-lunar-phase-line-in
        2.8s
        cubic-bezier(.3, 0, .2, 1)
        calc(var(--lunar-delay) + 720ms)
        forwards;
}


/*//////////////PHASE SYMBOLS//////////////*/

.cs-phases > :not(.cs-phase-line) {
    opacity: 0;

    transform-box: fill-box;
    transform-origin: center;

    animation:
        cs-lunar-phase-in
        900ms
        cubic-bezier(.18, .68, .2, 1)
        both;
}


.cs-phases > :nth-child(7) {
    animation-delay:
        calc(var(--lunar-delay) + 740ms);
}


.cs-phases > :nth-child(6),
.cs-phases > :nth-child(8) {
    animation-delay:
        calc(var(--lunar-delay) + 820ms);
}


.cs-phases > :nth-child(5),
.cs-phases > :nth-child(9) {
    animation-delay:
        calc(var(--lunar-delay) + 900ms);
}


.cs-phases > :nth-child(4),
.cs-phases > :nth-child(10) {
    animation-delay:
        calc(var(--lunar-delay) + 980ms);
}


.cs-phases > :nth-child(2),
.cs-phases > :nth-child(3) {
    animation-delay:
        calc(var(--lunar-delay) + 1060ms);
}


/*//////////////EVENT DEFAULT//////////////*/

.cs-event-celestial {
    display: none;
}


/*//////////////EVENT BUBBLE//////////////*/

.cs-bubble.cs-event {
    --cs-bubble-background-color:
        #030304;

    --cs-bubble-background-gradient:
        radial-gradient(
            circle at 50% -5%,
            rgba(238, 234, 222, .13),
            transparent 40%
        ),
        radial-gradient(
            circle at 50% 110%,
            rgba(238, 234, 222, .06),
            transparent 43%
        ),
        linear-gradient(
            145deg,
            #121216,
            #030304
        );

    --cs-bubble-border-color:
        rgba(238, 234, 222, .82);

    --cs-message-font-color:
        #fffaf0;


    /*//////////////4 SECOND EVENT TIMELINE//////////////*/

    --lunar-event-draw-start:
        calc(var(--lunar-delay) + 100ms);

    --lunar-event-content-start:
        calc(var(--lunar-delay) + 2.95s);

    --lunar-event-corner-start:
        calc(var(--lunar-delay) + 3.25s);

    min-inline-size: 320px;
}


/*//////////////NO EVENT ROLE//////////////*/

.cs-bubble.cs-event
.cs-role {
    display: none;
}


/*//////////////NO EVENT TOP SYMBOL//////////////*/

.cs-bubble.cs-event
.cs-top-decor {
    display: none;
}


/*//////////////NO EVENT ROLE BACKGROUND//////////////*/

.cs-bubble.cs-event
.cs-role-celestial {
    display: none;
}


/*//////////////EVENT USER ELEMENTS//////////////*/

.cs-bubble.cs-event
.cs-avatar,
.cs-bubble.cs-event
.cs-badges,
.cs-bubble.cs-event
.cs-pronouns {
    display: none;
}


/*//////////////EVENT HEADER//////////////*/

.cs-bubble.cs-event
.cs-header {
    justify-content: center;

    inline-size: 100%;

    margin-block-end: 8px;

    animation:
        cs-lunar-event-header-reveal
        500ms
        cubic-bezier(.18, .72, .2, 1)
        var(--lunar-event-content-start)
        both;
}


.cs-bubble.cs-event.cs-username-position-inline
.cs-header {
    display: none;
}


/*//////////////EVENT CELESTIAL//////////////*/

.cs-bubble.cs-event
.cs-event-celestial {
    position: absolute;
    z-index: 3;

    inset: 0;

    display: block;

    pointer-events: none;

    color: var(--gi);
}


/*//////////////EVENT CENTER SIGIL//////////////*/

.cs-event-sigil--center {
    position: absolute;

    inset-block-start: 50%;
    inset-inline-start: 50%;

    inline-size: 194px;
    block-size: 118px;

    overflow: visible;

    opacity: .48;

    transform:
        translate(-50%, -50%);
}


/*//////////////EVENT SIDE SIGILS//////////////*/

.cs-event-sigil--left,
.cs-event-sigil--right {
    position: absolute;

    inset-block-start: 50%;

    inline-size: 38px;
    block-size: 78px;

    overflow: visible;

    opacity: .94;

    transform:
        translateY(-50%);
}


.cs-event-sigil--left {
    inset-inline-start: 2px;
}


.cs-event-sigil--right {
    inset-inline-end: 2px;
}


/*//////////////EVENT DRAW//////////////*/

.cs-event-draw {
    fill: none;

    stroke: currentColor;

    stroke-width: 1.05;

    stroke-linecap: round;
    stroke-linejoin: round;

    vector-effect:
        non-scaling-stroke;

    opacity: 0;

    stroke-dasharray: 420;
    stroke-dashoffset: 420;

    animation:
        cs-lunar-event-draw
        2.8s
        cubic-bezier(.34, 0, .18, 1)
        var(--lunar-event-draw-start)
        forwards;
}


/*//////////////EVENT OUTER//////////////*/

.cs-event-draw--outer {
    animation-duration:
        2.8s;
}


/*//////////////EVENT INNER//////////////*/

.cs-event-draw--inner {
    animation-delay:
        calc(
            var(--lunar-event-draw-start)
            + 80ms
        );

    animation-duration:
        2.6s;
}


/*//////////////EVENT ORBIT//////////////*/

.cs-event-draw--orbit {
    animation-delay:
        calc(
            var(--lunar-event-draw-start)
            + 150ms
        );

    animation-duration:
        2.5s;
}


/*//////////////EVENT LEFT DRAW//////////////*/

.cs-event-sigil--left
.cs-event-draw {
    stroke-width: 1.2;

    animation-delay:
        calc(
            var(--lunar-event-draw-start)
            + 70ms
        );

    animation-duration:
        2.45s;
}


/*//////////////EVENT RIGHT DRAW//////////////*/

.cs-event-sigil--right
.cs-event-draw {
    stroke-width: 1.2;

    animation-delay:
        calc(
            var(--lunar-event-draw-start)
            + 140ms
        );

    animation-duration:
        2.45s;
}


/*//////////////EVENT SIDE FILLS//////////////*/

.cs-event-sigil--left
> circle:nth-child(2) {
    fill:
        rgba(238, 234, 222, .22);
}


.cs-event-sigil--left
> path:nth-child(3) {
    fill:
        rgba(238, 234, 222, .075);
}


.cs-event-sigil--right
> path:nth-child(2) {
    fill:
        rgba(238, 234, 222, .3);
}


.cs-event-sigil--right
> circle:nth-child(3) {
    fill:
        rgba(238, 234, 222, .075);
}


/*//////////////EVENT CENTER FILL//////////////*/

.cs-event-fill {
    fill: transparent;

    stroke: currentColor;

    stroke-width: 1;

    stroke-linecap: round;
    stroke-linejoin: round;

    vector-effect:
        non-scaling-stroke;

    stroke-dasharray: 140;
    stroke-dashoffset: 140;

    animation:
        cs-lunar-event-fill
        2.3s
        cubic-bezier(.32, 0, .18, 1)
        calc(
            var(--lunar-event-draw-start)
            + 300ms
        )
        forwards;
}


/*//////////////EVENT DOTS//////////////*/

.cs-event-dot {
    fill: currentColor;

    opacity: 0;

    transform-box: fill-box;
    transform-origin: center;

    animation:
        cs-lunar-event-dot
        500ms
        cubic-bezier(.16, .7, .2, 1)
        calc(
            var(--lunar-event-draw-start)
            + 2.1s
        )
        forwards;
}


/*//////////////EVENT CONTENT//////////////*/

.cs-bubble.cs-event
.cs-content {
    position: relative;

    justify-content: center;

    margin-inline: 4px;

    padding:
        18px
        28px;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(238, 234, 222, .06),
            transparent 66%
        ),
        linear-gradient(
            90deg,
            transparent,
            rgba(238, 234, 222, .08) 50%,
            transparent
        );

    border-block:
        1px solid
        rgba(238, 234, 222, .27);

    box-shadow:
        inset 0 1px
        rgba(255, 255, 255, .035),

        0 0 16px
        rgba(238, 234, 222, .045);

    transform-origin: center;

    animation:
        cs-lunar-event-content-reveal
        650ms
        cubic-bezier(.18, .7, .2, 1)
        calc(
            var(--lunar-event-content-start)
            + 50ms
        )
        both;
}


/*//////////////EVENT CONTENT FRAME//////////////*/

.cs-bubble.cs-event
.cs-content::before {
    content: "";

    position: absolute;

    inset:
        5px
        9px;

    pointer-events: none;

    border-inline:
        1px solid
        rgba(238, 234, 222, .13);

    transform-origin: center;

    animation:
        cs-lunar-event-inner-frame
        650ms
        cubic-bezier(.18, .7, .2, 1)
        calc(
            var(--lunar-event-content-start)
            + 100ms
        )
        both;
}


/*//////////////EVENT CENTER MARK//////////////*/

.cs-bubble.cs-event
.cs-content::after {

    background:

    font-family:
        Georgia,
        serif;

    line-height: 1;

    transform:
        translateX(-50%);

    animation:
        cs-lunar-event-mark
        500ms
        cubic-bezier(.16, .7, .2, 1)
        calc(
            var(--lunar-event-content-start)
            + 180ms
        )
        both;
}


/*//////////////EVENT MESSAGE//////////////*/

.cs-bubble.cs-event
.cs-message,
.cs-bubble.cs-event
.cs-events {
    position: relative;
    z-index: 4;

    color:
        var(--cs-message-font-color);

    text-align: center;

    text-shadow:
        0 1px 2px #000;

    letter-spacing: .025em;

    animation:
        cs-lunar-event-text-reveal
        600ms
        cubic-bezier(.18, .72, .2, 1)
        calc(
            var(--lunar-event-content-start)
            + 150ms
        )
        both;
}


/*//////////////EVENT PHASE LINE//////////////*/

.cs-bubble.cs-event
.cs-phase-line {
    animation-duration:
        700ms;

    animation-delay:
        calc(
            var(--lunar-event-content-start)
            + 220ms
        );
}


/*//////////////EVENT PHASE SYMBOLS//////////////*/

.cs-bubble.cs-event
.cs-phases > :not(.cs-phase-line) {
    animation-duration:
        450ms;

    animation-delay:
        calc(
            var(--lunar-event-content-start)
            + 280ms
        );
}


.cs-bubble.cs-event
.cs-phases {
    color: var(--gi);
}


/*//////////////EVENT CORNER SPEED//////////////*/

.cs-bubble.cs-event
.cs-corner::before,
.cs-bubble.cs-event
.cs-corner::after {
    animation-duration:
        600ms;
}


/*//////////////EVENT TOP LEFT//////////////*/

.cs-bubble.cs-event
.cs-corner--tl::before {
    animation-delay:
        var(--lunar-event-corner-start);
}


.cs-bubble.cs-event
.cs-corner--tl::after {
    animation-delay:
        calc(
            var(--lunar-event-corner-start)
            + 50ms
        );
}


.cs-bubble.cs-event
.cs-corner--tl {
    animation-duration:
        300ms;

    animation-delay:
        calc(
            var(--lunar-event-corner-start)
            + 350ms
        );
}


/*//////////////EVENT TOP RIGHT//////////////*/

.cs-bubble.cs-event
.cs-corner--tr::before {
    animation-delay:
        calc(
            var(--lunar-event-corner-start)
            + 50ms
        );
}


.cs-bubble.cs-event
.cs-corner--tr::after {
    animation-delay:
        calc(
            var(--lunar-event-corner-start)
            + 100ms
        );
}


.cs-bubble.cs-event
.cs-corner--tr {
    animation-duration:
        300ms;

    animation-delay:
        calc(
            var(--lunar-event-corner-start)
            + 400ms
        );
}


/*//////////////EVENT BOTTOM RIGHT//////////////*/

.cs-bubble.cs-event
.cs-corner--br::before {
    animation-delay:
        calc(
            var(--lunar-event-corner-start)
            + 100ms
        );
}


.cs-bubble.cs-event
.cs-corner--br::after {
    animation-delay:
        calc(
            var(--lunar-event-corner-start)
            + 150ms
        );
}


.cs-bubble.cs-event
.cs-corner--br {
    animation-duration:
        300ms;

    animation-delay:
        calc(
            var(--lunar-event-corner-start)
            + 450ms
        );
}


/*//////////////EVENT BOTTOM LEFT//////////////*/

.cs-bubble.cs-event
.cs-corner--bl::before {
    animation-delay:
        calc(
            var(--lunar-event-corner-start)
            + 150ms
        );
}


.cs-bubble.cs-event
.cs-corner--bl::after {
    animation-delay:
        calc(
            var(--lunar-event-corner-start)
            + 200ms
        );
}


.cs-bubble.cs-event
.cs-corner--bl {
    animation-duration:

    animation-delay:

        );

/*//////////////BUBBLE REVEAL//////////////*/

@keyframes cs-lunar-bubble-in {
    0% {
        opacity: 0;

        transform:
            scale(.97, .84);

        border-color:
            transparent;
    }

    40% {
        opacity: 1;

        transform:
            scale(.987, .95);
    }

    100% {
        opacity: 1;

        transform:
            scale(1);

        border-color:
            var(--cs-bubble-border-color);
    }
}


/*//////////////INNER FRAME//////////////*/

@keyframes cs-lunar-frame-in {
    0% {
        opacity: 0;

        transform:
            scale(.94, .72);
    }

    45% {
        opacity: .62;

        transform:
            scale(.98, .92);
    }

    100% {
        opacity: 1;

        transform:
            scale(1);
    }
}


/*//////////////TOP LINE//////////////*/

@keyframes cs-lunar-top-line-in {
    0% {
        opacity: 0;

        transform:
            scaleX(0);
    }

    100% {
        opacity: .55;

        transform:
            scaleX(1);
    }
}


/*//////////////ROLE REVEAL//////////////*/

@keyframes cs-lunar-role-in {
    0% {
        opacity: 0;

        transform:
            translateY(4px)
            scaleX(.55);
    }

    72% {
        opacity: 1;

        transform:
            translateY(0)
            scaleX(1.025);
    }

    100% {
        opacity: 1;

        transform:
            translateY(0)
            scaleX(1);
    }
}


/*//////////////SYMBOL SHELL//////////////*/

@keyframes cs-lunar-symbol-shell-in {
    0% {
        opacity: 0;

        transform:
            scale(.5)
            rotate(-10deg);
    }

    100% {
        opacity: 1;

        transform:
            scale(1)
            rotate(0deg);
    }
}


/*//////////////SYMBOL DRAW//////////////*/

@keyframes cs-lunar-stroke-draw {
    0% {
        opacity: 0;

        stroke-dashoffset:
            180;
    }

    5% {
        opacity: 1;
    }

    100% {
        opacity: 1;

        stroke-dashoffset:
            0;
    }
}


/*//////////////FILLED SYMBOL DRAW//////////////*/

@keyframes cs-lunar-filled-symbol-draw {
    0% {
        opacity: 0;
