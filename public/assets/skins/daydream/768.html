/*//////////////BASE//////////////////*/

html,
body {
    margin: 0;
    padding: 0;
    overflow: visible;
    background: transparent;
}

.cs-bubble,
.cs-bubble *,
.cs-bubble::before,
.cs-bubble::after {
    box-sizing: border-box;
}

.cs-chat {
    --cs-chat-padding-bottom: 28px;
}


/*//////////////BUBBLE//////////////////*/

.cs-bubble {
    /*//////////////DAYDREAM COLORS//////////////////*/

    --dd-bubble-primary:
        var(--cs-bubble-background-color, #ff7ed6);

    --dd-user-primary:
        var(--cs-username-background-color, #ff7ed6);

    --dd-avatar-primary:
        var(--cs-avatar-background-color, #ff7ed6);

    --dd-white: #fffaff;
    --dd-purple: #b987ff;

    --dd-event-white: #fff7fe;
    --dd-event-purple: #cba7ff;

    --dd-text: #1f1729;


    /*//////////////BUBBLE EFFECT COLORS//////////////////*/

    --dd-bubble-p32:
        color-mix(
            in srgb,
            var(--dd-bubble-primary) 32%,
            transparent
        );

    --dd-bubble-p38:
        color-mix(
            in srgb,
            var(--dd-bubble-primary) 38%,
            transparent
        );

    --dd-bubble-p48:
        color-mix(
            in srgb,
            var(--dd-bubble-primary) 48%,
            transparent
        );

    --dd-bubble-glow:
        rgba(185, 135, 255, .28);

    --dd-bubble-glow-strong:
        rgba(185, 135, 255, .34);

    --dd-bubble-shadow:
        rgba(80, 45, 120, .14);


    /*//////////////USERNAME EFFECT COLORS//////////////////*/

    --dd-user-p38:
        color-mix(
            in srgb,
            var(--dd-user-primary) 38%,
            transparent
        );

    --dd-user-glow:
        rgba(185, 135, 255, .28);


    /*//////////////AVATAR EFFECT COLORS//////////////////*/

    --dd-avatar-p32:
        color-mix(
            in srgb,
            var(--dd-avatar-primary) 32%,
            transparent
        );

    --dd-avatar-p48:
        color-mix(
            in srgb,
            var(--dd-avatar-primary) 48%,
            transparent
        );

    --dd-avatar-glow:
        rgba(185, 135, 255, .32);


    /*//////////////BUBBLE SETTINGS//////////////////*/

    --cs-bubble-width: 430px;

    --cs-bubble-padding-top: 11px;
    --cs-bubble-padding-right: 14px;
    --cs-bubble-padding-bottom: 12px;
    --cs-bubble-padding-left: 14px;

    --cs-bubble-border-width: 1px;
    --cs-bubble-border-style: solid;
    --cs-bubble-border-color: rgba(255, 255, 255, .88);

    --cs-bubble-border-radius-top-left: 15px;
    --cs-bubble-border-radius-top-right: 15px;
    --cs-bubble-border-radius-bottom-right: 15px;
    --cs-bubble-border-radius-bottom-left: 7px;


    /*//////////////AVATAR SETTINGS//////////////////*/

    --cs-avatar-size: 50px;
    --cs-avatar-padding: 0px;

    --cs-avatar-border-width: 1px;
    --cs-avatar-border-style: solid;
    --cs-avatar-border-color: rgba(255, 255, 255, .92);
    --cs-avatar-border-radius: 999px;


    /*//////////////USERNAME SETTINGS//////////////////*/

    --cs-username-padding-top: 6px;
    --cs-username-padding-right: 11px;
    --cs-username-padding-bottom: 6px;
    --cs-username-padding-left: 11px;

    --cs-username-border-width: 1px;
    --cs-username-border-style: solid;
    --cs-username-border-color: rgba(255, 255, 255, .88);
    --cs-username-border-radius: 999px;

    --cs-username-font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

    --cs-username-font-size: 12px;
    --cs-username-font-weight: 700;
    --cs-username-font-color: var(--dd-text);


    /*//////////////PRONOUN SETTINGS//////////////////*/

    --cs-pronouns-font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

    --cs-pronouns-font-size: 8px;
    --cs-pronouns-font-weight: 700;
    --cs-pronouns-font-color: rgba(31, 23, 41, .68);


    /*//////////////MESSAGE SETTINGS//////////////////*/

    --cs-message-font-family:
        "Pixelify Sans",
        "Cascadia Mono",
        Consolas,
        "Courier New",
        monospace;

    --cs-message-font-size: 11px;
    --cs-message-font-weight: 700;
    --cs-message-font-color: var(--dd-text);


    /*//////////////LAYOUT//////////////////*/

    display: block;

    inline-size: fit-content;
    max-inline-size: min(520px, calc(100vw - 28px));

    margin: 2px 14px;
    padding: 0;

    overflow: visible;

    background: transparent;
    border: 0;

    animation: none;
}


/*//////////////PSEUDO ELEMENTS//////////////////*/

.cs-bubble::before,
.cs-bubble::after,
.cs-header::before,
.cs-header::after,
.cs-content::after {
    content: none;
    display: none;
}


/*//////////////HEADER//////////////////*/

.cs-header {
    position: relative;
    z-index: 4;

    display: flex;
    align-items: center;
    gap: 8px;

    inline-size: fit-content;
    max-inline-size: 100%;

    margin: 0 0 -5px;

    overflow: visible;
}

.cs-header > .cs-user {
    order: 1;
}

.cs-header > .cs-avatar {
    order: 2;
}


/*//////////////AVATAR POSITION//////////////////*/

.cs-bubble.cs-avatar-position-left .cs-header > .cs-avatar {
    order: 1;
}

.cs-bubble.cs-avatar-position-left .cs-header > .cs-user {
    order: 2;
}

.cs-bubble.cs-avatar-position-right .cs-header > .cs-user {
    order: 1;
}

.cs-bubble.cs-avatar-position-right .cs-header > .cs-avatar {
    order: 2;
}

.cs-bubble.cs-avatar-position-center .cs-header {
    flex-direction: column;
}

.cs-bubble.cs-avatar-position-center .cs-header > .cs-avatar {
    order: 1;
}

.cs-bubble.cs-avatar-position-center .cs-header > .cs-user {
    order: 2;
}


/*//////////////AVATAR//////////////////*/

.cs-avatar {
    position: relative;
    z-index: 5;

    flex: 0 0 var(--cs-avatar-size);

    display: flex;
    align-items: center;
    justify-content: center;

    inline-size: var(--cs-avatar-size);
    block-size: var(--cs-avatar-size);

    padding: var(--cs-avatar-padding);

    overflow: hidden;

    background-color:
        var(--cs-avatar-background-color, #ff7ed6);

    background-image:
        radial-gradient(
            circle at 30% 20%,
            rgba(255, 255, 255, .95),
            rgba(255, 255, 255, .42) 35%,
            var(--dd-avatar-p32)
        ),
        var(
            --cs-avatar-background-gradient,
            linear-gradient(
                135deg,
                var(--dd-avatar-primary),
                var(--dd-purple)
            )
        );

    border:
        var(--cs-avatar-border-width)
        var(--cs-avatar-border-style)
        var(--cs-avatar-border-color);

    border-radius:
        var(--cs-avatar-border-radius);

    box-shadow:
        0 0 0 1px rgba(255, 255, 255, .22) inset,
        0 0 8px var(--dd-avatar-p48),
        0 0 16px var(--dd-avatar-glow);

    animation:
        daydreamAvatarReveal
        1.2s
        cubic-bezier(.18, 1.28, .32, 1)
        .1s
        both,

        avatarFloat
        3.4s
        ease-in-out
        1.35s
        infinite;
}

.cs-avatar img,
.cs-avatar svg {
    inline-size: 100%;
    block-size: 100%;

    object-fit: cover;
    border-radius: inherit;
}


/*//////////////USER//////////////////*/

.cs-user {
    position: relative;
    z-index: 4;

    display: flex;
    align-items: center;
    gap: 5px;

    inline-size: fit-content;
    max-inline-size: 340px;

    padding:
        var(--cs-username-padding-top)
        var(--cs-username-padding-right)
        var(--cs-username-padding-bottom)
        var(--cs-username-padding-left);

    overflow: hidden;

    background-color:
        var(--cs-username-background-color, #ff7ed6);

    background-image:
        radial-gradient(
            circle at 16% 12%,
            rgba(255, 255, 255, .95),
            rgba(255, 255, 255, .42) 18%,
            transparent 38%
        ),
        var(
            --cs-username-background-gradient,
            linear-gradient(
                120deg,
                var(--dd-white) 0%,
                color-mix(
                    in srgb,
                    var(--dd-user-primary) 28%,
                    white 72%
                ) 15%,
                var(--dd-user-primary) 30%,
                var(--dd-purple) 48%,
                var(--dd-user-primary) 68%,
                #fff 100%
            )
        );

    background-size:
        260% 260%,
        520% 520%;

    background-position:
        0% 0%,
        0% 50%;

    border:
        var(--cs-username-border-width)
        var(--cs-username-border-style)
        var(--cs-username-border-color);

    border-radius:
        var(--cs-username-border-radius);

    box-shadow:
        0 0 0 1px rgba(255, 255, 255, .16) inset,
        0 0 7px var(--dd-user-p38),
        0 0 14px var(--dd-user-glow);

    animation:
        daydreamUserReveal
        1.15s
        cubic-bezier(.18, 1.28, .32, 1)
        .03s
        both;
}


/*//////////////USERNAME//////////////////*/

.cs-username,
.cs-username--inline {
    display: inline-block;

    min-inline-size: 0;
    max-inline-size: 260px;

    overflow: hidden;

    color: var(--cs-username-font-color);

    font-family: var(--cs-username-font-family);
    font-size: var(--cs-username-font-size);
    font-weight: var(--cs-username-font-weight);

    line-height: 1;

    white-space: nowrap;
    text-overflow: ellipsis;

    text-shadow:
        0 1px 0 rgba(255, 255, 255, .55),
        0 0 8px rgba(255, 255, 255, .45);
}


/*//////////////PRONOUNS//////////////////*/

.cs-pronouns {
    display: inline;

    margin-inline-end: 4px;

    color: var(--cs-pronouns-font-color);

    font-family: var(--cs-pronouns-font-family);
    font-size: var(--cs-pronouns-font-size);
    font-weight: var(--cs-pronouns-font-weight);

    line-height: 1;
}


/*//////////////BADGES//////////////////*/

.cs-badges {
    display: inline-flex;
    align-items: center;
    gap: 3px;
}

.cs-badges img,
.cs-badges svg {
    display: block;

    inline-size: 14px;
    block-size: 14px;

    object-fit: contain;
}


/*//////////////CONTENT//////////////////*/

.cs-content {
    position: relative;
    z-index: 2;

    display: block;

    inline-size: fit-content;
    min-inline-size: 0;
    max-inline-size: var(--cs-bubble-width);

    margin: 0 0 0 20px;

    padding:

        ),
        var(
            --cs-bubble-background-gradient,
linear-gradient(
    125deg,
    #ffffff 0%,

    #fffafd 11%,
    color-mix(

    color-mix(

    var(--dd-bubble-primary) 32%,
    var(--dd-purple) 50%,
    var(--dd-bubble-primary) 72%,
    #fff 100%
)
        );

    background-size:
        260% 260%,
        560% 560%;

    background-position:
        0% 0%,
        0% 50%;

    border:

        var(--cs-bubble-border-style)

    border-radius:
        var(--cs-bubble-border-radius-top-left)

    box-shadow:
        0 0 0 1px rgba(255, 255, 255, .18) inset,
        0 0 10px var(--dd-bubble-p38),
        0 0 20px var(--dd-bubble-glow),
        0 8px 18px var(--dd-bubble-shadow);

    animation:
        daydreamContentReveal
        1.25s
        cubic-bezier(.18, 1.25, .32, 1)
        .17s
        both;
}

.cs-content::before {
    content: "";

    position: absolute;
    inset: -7px;
    z-index: -1;

    border-radius: inherit;

    background:
        linear-gradient(
            135deg,
            var(--dd-bubble-p32),
            rgba(185, 135, 255, .24),
            rgba(255, 255, 255, .22)
        );

    filter: blur(8px);
    opacity: .45;

    pointer-events: none;
}


/*//////////////INLINE USER//////////////////*/

.cs-user--inline {
    display: none;
    align-items: baseline;
    gap: 4px;

    margin-inline-end: 5px;

    padding: 3px 7px;

        color-mix(

    box-shadow:

.cs-bubble.cs-username-position-inline .cs-user {
    display: none;
}

.cs-bubble.cs-username-position-inline .cs-user--inline {
    display: inline-flex;
}


/*//////////////MESSAGE//////////////////*/

.cs-message {
    display: block;

    max-inline-size: 100%;

    color: var(--cs-message-font-color);

    font-family: var(--cs-message-font-family);
    font-size: var(--cs-message-font-size);
    font-weight: var(--cs-message-font-weight);

    line-height: 1.3;
    letter-spacing: .1px;

    font-variant-ligatures: none;

    text-shadow:
        0 1px 0 rgba(255, 255, 255, .52);

    white-space: normal;

    word-break: normal;
    overflow-wrap: anywhere;

    animation: none;
}

.cs-bubble.cs-username-position-inline .cs-message {
    display: inline;
}

/*//////////////EMOTE FIX//////////////////*/

.cs-message .emote,
.cs-message img.emote {
    display: inline-block !important;

    width: auto !important;

}

.cs-chat.cs-full-width .cs-content {

.cs-bubble[style*="--cs-message-font-family: 'Inter'"],

        translate: -65px 0;
        scale: .96;
    }

    to {
        opacity: 1;
        translate: 0 0;
        scale: 1;
    }
}


/*//////////////AVATAR REVEAL//////////////////*/

@keyframes daydreamAvatarReveal {
    from {
        opacity: 0;
        translate: 0 -60px;
        scale: .9;
    }

    to {
        opacity: 1;
        translate: 0 0;
        scale: 1;
    }
}


/*//////////////CONTENT REVEAL//////////////////*/

@keyframes daydreamContentReveal {
    from {
        opacity: 0;
        translate: 75px 18px;
        scale: .975;
    }

    to {
        opacity: 1;
        translate: 0 0;
        scale: 1;
    }
}


/*//////////////EVENT REVEAL//////////////////*/

@keyframes daydreamEventReveal {
    from {
        opacity: 0;
        translate: 0 -55px;
        scale: .95;
    }

    to {
        opacity: 1;
        translate: 0 0;
        scale: 1;
    }
}


/*//////////////AVATAR FLOAT//////////////////*/

@keyframes avatarFloat {
    0%,
    100% {
        transform:
            translateY(0)
            rotate(-1deg);
    }

    50% {
        transform:
            translateY(-5px)
            rotate(1.5deg);
    }
}


/*//////////////EVENT FLOAT//////////////////*/

@keyframes daydreamEventFloat {
    0%,
    100% {
        transform:
            translateY(0)
            rotate(0deg);
    }

    50% {
        transform:
            translateY(-5px)
            rotate(1.2deg);
    }
}


/*//////////////EVENT GRADIENT//////////////////*/

@keyframes daydreamEventGradient {
    0% {
        background-position:
            0% 0%,
            0% 35%;
    }

    50% {
        background-position:
            35% 18%,
            100% 65%;
    }

    100% {
        background-position:
            5% 35%,
            35% 20%;
    }
}


/*//////////////EVENT GLOW//////////////////*/

@keyframes daydreamEventGlow {
    0%,
    100% {
        box-shadow:
            0 0 0 1px rgba(255, 255, 255, .26) inset,
            0 0 12px var(--dd-bubble-p48),
            0 0 24px var(--dd-bubble-glow-strong),
            0 8px 18px rgba(80, 45, 120, .16);
    }

    50% {
        box-shadow:
            0 0 0 1px rgba(255, 255, 255, .34) inset,
            0 0 17px var(--dd-bubble-p48),
            0 0 34px var(--dd-bubble-glow-strong),
            0 9px 22px rgba(80, 45, 120, .20);
    }
}
