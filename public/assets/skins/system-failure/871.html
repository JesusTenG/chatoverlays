/*//////////////CHAT//////////////*/

.cs-chat{
    --cs-chat-padding:5px;
}


/*//////////////SYSTEM//////////////*/

.cs-bubble{
    --sys-source:
        var(
            --cs-bubble-border-color,
            #ff3045
        );

    --sys-border-width:
        max(
            1.1px,
            var(--cs-bubble-border-width,1.1px)
        );

    --sys-neon:
        color-mix(
            in srgb,
            var(--sys-source) 94%,
            #ffffff 6%
        );

    --sys-bright:
        color-mix(
            in srgb,
            var(--sys-source) 82%,
            #ffffff 18%
        );

    --sys-dim:
        color-mix(
            in srgb,
            var(--sys-source) 38%,
            #180104 62%
        );

    --sys-glow:
        color-mix(
            in srgb,
            var(--sys-source) 48%,
            transparent
        );

    --stage-badge:.38s;
    --stage-user:.48s;
    --stage-time:.70s;
    --stage-message:.82s;

    position:relative;
    isolation:isolate;

    box-sizing:border-box;

    inline-size:
        min(
            100%,
            var(--cs-bubble-width,520px)
        );

    max-inline-size:
        var(--cs-bubble-width,520px);

    min-inline-size:0;

    flex-shrink:0;

    overflow:hidden;

    padding-block-start:
        var(
            --cs-bubble-padding-top,
            var(--cs-bubble-padding,10px)
        );

    padding-inline-end:
        var(
            --cs-bubble-padding-right,
            var(--cs-bubble-padding,24px)
        );

    padding-block-end:
        var(
            --cs-bubble-padding-bottom,
            var(--cs-bubble-padding,10px)
        );

    padding-inline-start:
        var(
            --cs-bubble-padding-left,
            var(--cs-bubble-padding,24px)
        );


    /*//////////////FRAMEWORK BACKGROUND//////////////*/

    background-color:
        var(
            --cs-bubble-background-color,
            rgba(11,0,2,.05)
        );

    background-image:
        var(
            --cs-bubble-background-gradient,
            none
        );

    background-repeat:no-repeat;


    /*//////////////REAL BORDER//////////////*/

    border-width:
        var(--sys-border-width);

    border-style:
        var(
            --cs-bubble-border-style,
            solid
        );

    border-color:
        var(--sys-source);

    border-start-start-radius:
        var(
            --cs-bubble-border-radius-top-left,
            var(--cs-bubble-border-radius,2px)
        );

    border-start-end-radius:
        var(
            --cs-bubble-border-radius-top-right,
            var(--cs-bubble-border-radius,2px)
        );

    border-end-end-radius:
        var(
            --cs-bubble-border-radius-bottom-right,
            var(--cs-bubble-border-radius,2px)
        );

    border-end-start-radius:
        var(
            --cs-bubble-border-radius-bottom-left,
            var(--cs-bubble-border-radius,2px)
        );


    /*//////////////NEON GLOW//////////////*/

    box-shadow:
        0 0 5px var(--sys-glow),
        inset 0 0 4px var(--sys-glow),

        var(--cs-bubble-box-shadow-inset,)
        var(--cs-bubble-box-shadow-offset-x,0px)
        var(--cs-bubble-box-shadow-offset-y,0px)
        var(--cs-bubble-box-shadow-blur-radius,0px)
        var(--cs-bubble-box-shadow-spread-radius,0px)
        var(--cs-bubble-box-shadow-color,transparent);


    /*//////////////REVEAL//////////////*/

    animation:
        system-shell-in
        .18s
        steps(3,end)
        both,

        real-border-reveal
        .58s
        steps(1,end)
        .06s
        both;
}


/*//////////////LEGACY CORE//////////////*/

.cs-system-core{
    display:none;
}


/*//////////////AVATAR OFF//////////////*/

.cs-avatar{
    display:none !important;
}


/*//////////////PRIMARY BORDER GLITCH//////////////*/

.cs-bubble::before{
    content:"";

    position:absolute;

    inset:-1px;

    z-index:12;

    box-sizing:border-box;

    pointer-events:none;

    border:
        1px solid
        var(--sys-bright);

    border-radius:inherit;

    opacity:0;

    box-shadow:
        0 0 5px var(--sys-neon),
        0 0 12px var(--sys-glow),
        inset 0 0 5px var(--sys-glow);

    animation:
        frame-glitch-primary
        .62s
        steps(1,end)
        .05s
        both;
}


/*//////////////SECONDARY BORDER GLITCH//////////////*/

.cs-bubble::after{
    content:"";

    position:absolute;

    inset:0;

    z-index:13;

    box-sizing:border-box;

    pointer-events:none;

    border:
        1px solid
        var(--sys-neon);

    border-radius:inherit;

    opacity:0;

    box-shadow:
        0 0 7px var(--sys-bright),
        0 0 16px var(--sys-glow);

    animation:
        frame-glitch-secondary
        .68s
        steps(1,end)
        .09s
        both;
}

/*//////////////BADGES//////////////*/

.cs-badges,
.cs-badges--inline{
    position:relative;

    isolation:isolate;

    display:inline-flex;

    align-items:center;
    justify-content:center;

    flex-shrink:0;

    gap:3px;

    padding:0;

    opacity:0;

    animation:
        badge-in
        .15s
        steps(3,end)
        var(--stage-badge)
        forwards,

        badge-corruption
        .34s
        steps(1,end)
        calc(var(--stage-badge) + .02s)
        both;
}

.cs-badges:empty,
.cs-badges--inline:empty{
    display:none !important;
}

.cs-badges img,
.cs-badges--inline img{
    border-radius:1px;

    filter:
        grayscale(1)
        contrast(1.35)
        brightness(.78);
}

.cs-badges::after,
.cs-badges--inline::after{
    content:"";

    position:absolute;

    inset:0;

    z-index:2;

    pointer-events:none;

    background:var(--sys-neon);

    opacity:.9;

    mix-blend-mode:color;
}


/*//////////////NEON TEXT//////////////*/

.cs-username,
.cs-username--inline,
.cs-pronouns,
.cs-timestamp,
.cs-message{
    color:var(--sys-neon) !important;

    text-shadow:
        0 0 2px var(--sys-neon),
        0 0 6px var(--sys-glow),
        0 0 11px var(--sys-glow) !important;
}


/*//////////////USERNAME//////////////*/

.cs-username,
.cs-username--inline{
    position:relative;

    display:inline-block;

    inline-size:max-content;
    max-inline-size:100%;

    font-family:
        var(
            --cs-username-font-family,
            "Space Grotesk"
        ),
        sans-serif;

    font-size:
        var(
            --cs-username-font-size,
            16px
        );

    font-weight:
        var(
            --cs-username-font-weight,
            700
        );

    -webkit-text-stroke:
        var(

            0px

        var(
            --cs-username-text-stroke-color,
            #000000
        );

    line-height:1.12;

    white-space:normal;

    text-align:center;

    opacity:0;

    clip-path:
        inset(
            0 100%
            0 0
        );

    animation:
        username-type
        .30s
        linear
        var(--stage-user)
        forwards,

        text-corruption
        .43s
        steps(1,end)
        calc(var(--stage-user) + .02s)
        both;

/*//////////////USERNAME CURSOR//////////////*/

.cs-username::after,
.cs-username--inline::after{
    content:"";

    position:absolute;

    inset-block-start:50%;
    inset-inline-start:0;

    inline-size:4px;
    block-size:.95em;

    background:var(--sys-neon);

    box-shadow:
        0 0 7px
        var(--sys-neon);

    transform:
        translateY(-50%);

    opacity:0;

    animation:
        username-cursor
        .30s
        linear
        var(--stage-user)
        both;
}


/*//////////////TIMESTAMP//////////////*/

.cs-timestamp{
    position:relative;

    order:2;

    flex-basis:100%;

    display:block;

    inline-size:max-content;
    max-inline-size:100%;

    margin-inline:auto;

    font-family:
        var(
            --cs-message-font-family,
            monospace
        );

    font-size:8px;
    font-weight:700;

    line-height:1;

    letter-spacing:.10em;

    text-align:center;

    opacity:0;

    clip-path:
        inset(
            0 100%
            0 0
        );

    animation:
        timestamp-type
        .18s
        linear
        var(--stage-time)
        forwards,

        timestamp-corruption
        .30s
        steps(1,end)
        calc(var(--stage-time) + .02s)
        both;
}

.cs-timestamp:not(:empty)::before{
    content:"[";

    margin-inline-end:4px;
}

.cs-timestamp:not(:empty)::after{
    content:"]";

    margin-inline-start:4px;
}

.cs-content{

        both;

}

}

        );

    padding-block-end:
        var(
            --cs-bubble-padding-bottom,
            var(--cs-bubble-padding,14px)
        );

    padding-inline-start:

/*//////////////EVENT CLEANUP//////////////*/

.cs-event .cs-avatar,
.cs-event .cs-badges,
.cs-event .cs-badges--inline,
.cs-event .cs-auth{
    display:none !important;
}


/*//////////////EVENT USERNAME//////////////*/

.cs-event .cs-username,
.cs-event .cs-username--inline{
    font-size:
        calc(
            var(--cs-username-font-size,16px)
            * 1.35
        );

    font-weight:
        var(
            --cs-username-font-weight,
            700
        );

    line-height:1.08;

    letter-spacing:.025em;

    text-align:center;
}


/*//////////////EVENT BOOT//////////////*/

.cs-event .cs-boot{
    position:relative;

    z-index:30;

    box-sizing:border-box;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    inline-size:100%;
    min-inline-size:0;
    max-inline-size:100%;

    max-block-size:260px;

    gap:6px;

    margin-block:0 6px;

    padding-block:10px;

    padding-inline:
        clamp(
            10px,
            5vw,
            28px
        );

    color:var(--sys-neon);


    /*//////////////SAME FRAMEWORK BACKGROUND//////////////*/

    background-color:
        var(
            --cs-bubble-background-color,
            rgba(11,0,2,.05)
        );

    background-image:
        var(
            --cs-bubble-background-gradient,
            none
        );

    background-repeat:no-repeat;


    border:
        1px solid
        var(--sys-dim);

    border-radius:
        max(
            0px,
            calc(
                var(--cs-bubble-border-radius,2px)
                - 1px
            )
        );

    text-align:center;

    overflow:hidden;

    opacity:0;

    animation:
        boot-in
        .18s
        steps(3,end)
        .45s
        forwards,

        boot-collapse
        .36s
        linear
        2.88s
        forwards;
}


/*//////////////BOOT TITLE//////////////*/

.cs-boot-title{
    position:relative;

    display:inline-block;

    max-inline-size:100%;

    padding-inline:6px;

    color:var(--sys-neon);

    font-family:
        var(
            --cs-username-font-family,
            monospace
        );

    font-size:
        clamp(
            11px,
            3vw,
            15px
        );

    font-weight:700;

    line-height:1.15;

    letter-spacing:.07em;

    white-space:normal;

    overflow-wrap:anywhere;

    text-align:center;

    text-shadow:
        0 0 3px var(--sys-neon),
        0 0 9px var(--sys-glow);

    opacity:0;

    clip-path:
        inset(
            0 100%
            0 0
        );

    animation:
        boot-type
        .46s
        linear
        .62s
        forwards,

        boot-text-corruption
        .56s
        steps(1,end)
        .68s
        both;
}


/*//////////////BOOT SUB//////////////*/

.cs-boot-sub,
.cs-boot-ready{
    color:var(--sys-neon);

    font-family:
        var(
            --cs-message-font-family,
            monospace
        );

    font-size:8px;
    font-weight:700;

    line-height:1.15;

    letter-spacing:.10em;

    text-align:center;

    text-shadow:
        0 0 3px var(--sys-neon),
        0 0 7px var(--sys-glow);
}

.cs-boot-sub{
    opacity:0;

    animation:
        flicker-in
        .20s
        steps(3,end)
        1.05s
        forwards;
}


/*//////////////BOOT PROGRESS//////////////*/

.cs-boot-progress{
    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    inline-size:100%;
    max-inline-size:440px;
    min-inline-size:0;

    gap:4px;

    opacity:0;

    animation:
        flicker-in
        .18s
        steps(3,end)
        1.26s
        forwards;
}


/*//////////////BOOT TRACK//////////////*/

.cs-boot-track{
    inline-size:100%;
    min-inline-size:0;

    block-size:11px;

    box-sizing:border-box;

    padding:2px;

    border:
        1px solid
        var(--sys-neon);

    box-shadow:
        0 0 5px var(--sys-glow),
        inset 0 0 4px var(--sys-glow);

    overflow:hidden;
}


/*//////////////BOOT FILL//////////////*/

.cs-boot-fill{
    display:block;

    inline-size:100%;
    block-size:100%;

    background:
        repeating-linear-gradient(
            90deg,
            var(--sys-neon) 0 9px,
            transparent 9px 12px
        );

    box-shadow:
        0 0 6px
        var(--sys-neon);

    transform:
        scaleX(.02);

    transform-origin:
        left center;

    animation:
        boot-fill
        1.26s
        steps(15,end)
        1.30s
        forwards;
}


/*//////////////BOOT PERCENT//////////////*/

.cs-boot-percent{
    position:relative;

    inline-size:100%;
    block-size:12px;

    color:var(--sys-neon);

    font-family:
        var(
            --cs-message-font-family,
            monospace
        );

    font-size:9px;
    font-weight:800;

    line-height:12px;

    text-align:center;

    text-shadow:
        0 0 4px
        var(--sys-neon);
}

.cs-pct{
    position:absolute;

    inset:0;

    inline-size:100%;

    text-align:center;

    opacity:0;
}

.cs-pct--1{
    animation:
        pct-flash
        .30s
        steps(1,end)
        1.28s
        both;
}

.cs-pct--2{
    animation:
        pct-flash
        .30s
        steps(1,end)
        1.58s
        both;
}

.cs-pct--3{
    animation:
        pct-flash
        .30s
        steps(1,end)
        1.88s
        both;
}

.cs-pct--4{
    animation:
        pct-flash
        .30s
        steps(1,end)
        2.18s
        both;
}

.cs-pct--5{
    animation:
        pct-final
        .36s
        steps(1,end)
        2.47s
        forwards;
}


/*//////////////BOOT READY//////////////*/

.cs-boot-ready{
    opacity:0;

    animation:
        flicker-in
        .24s
        steps(3,end)
        2.56s
        forwards;
}


/*//////////////EVENT CONTENT LOCK//////////////*/

.cs-event .cs-header{
    max-block-size:0;

    overflow:hidden;

    opacity:0;

    animation:
        event-header-open
        .22s
        linear
        3.24s
        forwards;
}

.cs-event .cs-content{
    max-block-size:0;

.cs-event .cs-header,

    inline-size:100%;

.cs-event::before{
