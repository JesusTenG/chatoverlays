/*//////////////DOCUMENT//////////////*/

html,
body{
    margin:0;
    padding:0;

    overflow:visible;

    background:transparent;
}


/*//////////////CHAT//////////////*/

.cs-chat{
    --cs-chat-padding:4px;
}


/*//////////////BASE//////////////*/

.cs-bubble,
.cs-bubble *,
.cs-bubble::before,
.cs-bubble::after{
    box-sizing:border-box;
}

.cs-bubble{
    --a:
        var(
            --cs-usercolor,
            #ff4040
        );

    --bg:#070913;
    --text:#f7f8ff;


    /*//////////////BUBBLE//////////////*/

    --cs-bubble-width:340px;

    --cs-bubble-background-color:#070913;

    --cs-bubble-background-gradient:
        linear-gradient(
            135deg,
            rgba(255,255,255,.035),
            transparent 42%
        );

    --cs-bubble-border-width:2px;

    --cs-bubble-border-color:
        var(--a);


    /*//////////////AVATAR//////////////*/

    --cs-avatar-size:34px;

    --cs-avatar-border-width:2px;

    --cs-avatar-border-color:
        var(--a);

    --cs-avatar-border-radius:2px;


    /*//////////////USERNAME//////////////*/

    --cs-username-font-family:
        "Press Start 2P",
        monospace;

    --cs-username-font-size:10px;

    --cs-username-font-weight:900;

    --cs-username-font-color:
        var(--a);

    --cs-username-text-shadow-offset-x:1px;
    --cs-username-text-shadow-offset-y:1px;
    --cs-username-text-shadow-blur-radius:0px;

    --cs-username-text-shadow-color:#000;

    --cs-username-background-color:transparent;
    --cs-username-background-gradient:none;

    --cs-username-border-width:0px;
    --cs-username-border-color:transparent;


    /*//////////////MESSAGE//////////////*/

    --cs-message-font-family:
        "Press Start 2P",
        monospace;

    --cs-message-font-size:8px;

    --cs-message-font-weight:700;

    --cs-message-font-color:
        var(--text);

    --cs-message-background-color:transparent;
    --cs-message-background-gradient:none;

    --cs-message-border-width:0px;
    --cs-message-border-color:transparent;


    /*//////////////REVEAL//////////////*/

    --cs-bubble-animation:
        csPixelPanelReveal;

    --cs-bubble-animation-duration:
        520ms;

    --cs-bubble-animation-delay:
        0ms;

    --cs-bubble-animation-timing-function:
        steps(8,end);


    --cs-avatar-animation:
        csPixelAvatarReveal;

    --cs-avatar-animation-duration:
        420ms;

    --cs-avatar-animation-delay:
        145ms;

    --cs-avatar-animation-timing-function:
        steps(6,end);


    --cs-username-animation:
        csPixelUserReveal;

    --cs-username-animation-duration:
        420ms;

    --cs-username-animation-delay:
        220ms;

    --cs-username-animation-timing-function:
        steps(6,end);


    --cs-message-animation:
        csPixelMessageReveal;

    --cs-message-animation-duration:
        500ms;

    --cs-message-animation-delay:
        375ms;

    --cs-message-animation-timing-function:
        steps(8,end);


    /*//////////////PIXEL SHELL//////////////*/

    --pixel-shell:
        polygon(
            6px 0,
            calc(100% - 6px) 0,

            calc(100% - 6px) 3px,
            calc(100% - 3px) 3px,

            calc(100% - 3px) 6px,
            100% 6px,

            100% calc(100% - 6px),

            calc(100% - 3px) calc(100% - 6px),
            calc(100% - 3px) calc(100% - 3px),

            calc(100% - 6px) calc(100% - 3px),
            calc(100% - 6px) 100%,

            6px 100%,

            6px calc(100% - 3px),
            3px calc(100% - 3px),

            3px calc(100% - 6px),
            0 calc(100% - 6px),

            0 6px,

            3px 6px,
            3px 3px,

            6px 3px
        );


    /*//////////////LAYOUT//////////////*/

    position:relative;

    inline-size:fit-content;

    min-inline-size:130px;

    max-inline-size:
        min(
            var(--cs-bubble-width,340px),
            calc(100vw - 8px)
        );

    min-block-size:0;

    margin:
        1px
        3px;

    padding-block-start:
        calc(
            7px +
            var(
                --cs-bubble-padding-top,
                var(--cs-bubble-padding,0px)
            )
        );

    padding-inline-end:
        calc(
            9px +
            var(
                --cs-bubble-padding-right,
                var(--cs-bubble-padding,0px)
            )
        );

    padding-block-end:
        calc(
            7px +
            var(
                --cs-bubble-padding-bottom,
                var(--cs-bubble-padding,0px)
            )
        );

    padding-inline-start:
        calc(
            9px +
            var(
                --cs-bubble-padding-left,
                var(--cs-bubble-padding,0px)
            )
        );

    background:transparent;

    border:0;

    box-shadow:none;

    overflow:visible;

    isolation:isolate;
}


/*//////////////PIXEL SHELL OUTER//////////////*/

.cs-bubble::before{
    content:"";

    position:absolute;

    z-index:0;

    inset:0;

    pointer-events:none;

    background:
        var(
            --cs-bubble-border-color,
            var(--a)
        );

    clip-path:
        var(--pixel-shell);

    filter:
        drop-shadow(
            3px
            3px
            0
            rgba(0,0,0,.32)
        );

    animation:
        csPixelShellFlash
        640ms
        steps(1,end)
        both;
}


/*//////////////PIXEL SHELL INNER//////////////*/

.cs-bubble::after{
    content:"";

    position:absolute;

    z-index:1;

    inset:
        var(
            --cs-bubble-border-width,
            2px
        );

    pointer-events:none;

    background-color:
        var(
            --cs-bubble-background-color,
            var(--bg)
        );

    background-image:
        var(
            --cs-bubble-background-gradient,
            none
        );

    background-repeat:no-repeat;

    clip-path:
        var(--pixel-shell);

    animation:
        csPixelInnerReveal
        540ms
        steps(7,end)
        55ms
        both;
}

/*//////////////HEADER//////////////*/

.cs-header{
    position:relative;

    z-index:3;

    display:flex;

    align-items:center;

    gap:7px;

    inline-size:100%;

    min-inline-size:0;

    margin-block-end:5px;
}


/*//////////////AVATAR//////////////*/

.cs-avatar{
    position:relative;

    z-index:3;

    flex:0 0 auto;
}

.cs-avatar img{
    display:block;

    inline-size:
        var(
            --cs-avatar-size,
            34px
        );

    block-size:
        var(
            --cs-avatar-size,
            34px
        );

    object-fit:cover;

    transform-origin:center;
}


/*//////////////USER//////////////*/

.cs-user,
.cs-user--inline{
    position:relative;

    z-index:3;

    min-inline-size:0;

    gap:4px;
}


/*//////////////PIXEL USER INDICATOR//////////////*/

.cs-user::before,
.cs-user--inline::before{
    content:"";

    flex:0 0 auto;

    inline-size:4px;
    block-size:4px;

    background:
        var(
            --cs-bubble-border-color,
            var(--a)
        );

    animation:
        csPixelIndicatorReveal
        360ms
        steps(5,end)
        265ms
        both;
}


/*//////////////USERNAME//////////////*/

.cs-username,
.cs-username--inline{
    position:relative;

    min-inline-size:0;

    max-inline-size:100%;

    overflow:hidden;

    line-height:1.15;

    letter-spacing:.035em;

    text-overflow:ellipsis;

    white-space:nowrap;

    text-transform:uppercase;
}


/*//////////////PRONOUNS//////////////*/

.cs-pronouns{
    margin-inline-end:3px;

    font-size:.68em;

    opacity:.68;
}


/*//////////////BADGES//////////////*/

.cs-badges,
.cs-badges--inline{
    position:relative;

    z-index:3;

    gap:2px;
}

.cs-badges img,
.cs-badges svg,
.cs-badges--inline img,
.cs-badges--inline svg{
    inline-size:
        calc(
            var(--cs-username-font-size,10px) + 1px
        );

    block-size:
        calc(
            var(--cs-username-font-size,10px) + 1px
        );

    object-fit:contain;
}


/*//////////////BADGE STAGGER//////////////*/

.cs-badges > *,
.cs-badges--inline > *{
    animation:
        csPixelBadgeReveal
        320ms
        steps(5,end)
        both;
}

.cs-badges > :nth-child(1),
.cs-badges--inline > :nth-child(1){
    animation-delay:285ms;
}

.cs-badges > :nth-child(2),
.cs-badges--inline > :nth-child(2){
    animation-delay:325ms;
}

.cs-badges > :nth-child(3),
.cs-badges--inline > :nth-child(3){
    animation-delay:365ms;
}

.cs-badges > :nth-child(4),
.cs-badges--inline > :nth-child(4){
    animation-delay:405ms;
}

.cs-badges > :nth-child(n+5),
.cs-badges--inline > :nth-child(n+5){
    animation-delay:445ms;
}


/*//////////////CONTENT//////////////*/

.cs-content{
    position:relative;

    z-index:3;

    inline-size:100%;

    min-inline-size:0;
}


/*//////////////HEADER DIVIDER//////////////*/

.cs-bubble:not(.cs-username-position-inline):not(.cs-event)
.cs-content::before{
    content:"";

    display:block;

    inline-size:100%;

    block-size:1px;

    margin-block-end:5px;

    background:
        repeating-linear-gradient(

            var(

            transparent 7px 10px

    transform-origin:left center;

    animation:
        csPixelDividerReveal
        390ms
        steps(7,end)

        both;
}


/*//////////////MESSAGE//////////////*/

.cs-message{
    position:relative;

    z-index:3;

    inline-size:100%;

    min-inline-size:0;
    max-inline-size:100%;

/*////////////////////////////////////////////////////////////*/
/*//////////////////// FAST ARCADE IDLE ///////////////////////*/
/*////////////////////////////////////////////////////////////*/


/*//////////////MARQUEE CIRCUIT//////////////*/

@keyframes csArcadeMarqueeCircuit{

    /*
        14 Sekunden Gesamtzyklus.

        Lange Ruhephase.

        Danach:
        schneller Arcade-Marquee-Chase.

        Sichtbarer Chase:
        ungefähr 1.8 Sekunden.
    */


    /*//////////////IDLE//////////////*/

    0%,
    78%{
        background-image:none;

        background-color:
            var(
                --cs-bubble-border-color,
                var(--a)
            );

        background-position:
            0 0,
            100% 0,
            100% 100%,
            0 100%;
    }


    /*//////////////LIGHTS ON//////////////*/

    79%{
        background-image:

            /* TOP */

            repeating-linear-gradient(
                90deg,

                #ffffff
                0 4px,

                transparent
                4px 8px,

                color-mix(
                    in srgb,
                    var(--cs-bubble-border-color,var(--a)) 35%,
                    #ffffff 65%
                )
                8px 12px,

                transparent
                12px 20px
            ),


            /* RIGHT */

            repeating-linear-gradient(
                180deg,

                #ffffff
                0 4px,

                transparent
                4px 8px,

                color-mix(
                    in srgb,
                    var(--cs-bubble-border-color,var(--a)) 35%,
                    #ffffff 65%
                )
                8px 12px,

                transparent
                12px 20px
            ),


            /* BOTTOM */

            repeating-linear-gradient(
                270deg,

                #ffffff
                0 4px,

                transparent
                4px 8px,

                color-mix(
                    in srgb,
                    var(--cs-bubble-border-color,var(--a)) 35%,
                    #ffffff 65%
                )
                8px 12px,

                transparent
                12px 20px
            ),


            /* LEFT */

            repeating-linear-gradient(
                0deg,

                #ffffff
                0 4px,

                transparent
                4px 8px,

                color-mix(
                    in srgb,
                    var(--cs-bubble-border-color,var(--a)) 35%,
                    #ffffff 65%
                )
                8px 12px,

                transparent
                12px 20px
            );

        background-position:
            0 0,
            100% 0,
            100% 100%,
            0 100%;
    }


    /*//////////////CHASE 01//////////////*/

    80.5%{
        background-position:
            14px 0,
            100% 14px,
            calc(100% - 14px) 100%,
            0 calc(100% - 14px);
    }


    /*//////////////CHASE 02//////////////*/

    82%{
        background-position:
            28px 0,
            100% 28px,
            calc(100% - 28px) 100%,
            0 calc(100% - 28px);
    }


    /*//////////////CHASE 03//////////////*/

    83.5%{
        background-position:
            42px 0,
            100% 42px,
            calc(100% - 42px) 100%,
            0 calc(100% - 42px);
    }


    /*//////////////CHASE 04//////////////*/

    85%{
        background-position:
            56px 0,
            100% 56px,
            calc(100% - 56px) 100%,
            0 calc(100% - 56px);
    }


    /*//////////////CHASE 05//////////////*/

    86.5%{
        background-position:
            70px 0,
            100% 70px,
            calc(100% - 70px) 100%,
            0 calc(100% - 70px);
    }


    /*//////////////CHASE 06//////////////*/

    88%{
        background-position:
            84px 0,
            100% 84px,
            calc(100% - 84px) 100%,
            0 calc(100% - 84px);
    }


    /*//////////////CHASE 07//////////////*/

    89.5%{
        background-position:
            98px 0,
            100% 98px,
            calc(100% - 98px) 100%,
            0 calc(100% - 98px);
    }


    /*//////////////CHASE 08//////////////*/

    91%{
        background-position:
            112px 0,
            100% 112px,
            calc(100% - 112px) 100%,
            0 calc(100% - 112px);
    }


    /*//////////////CHASE PEAK//////////////*/

    92%{
        background-position:
            126px 0,
            100% 126px,
            calc(100% - 126px) 100%,
            0 calc(100% - 126px);

        background-color:
            color-mix(
                in srgb,
                var(--cs-bubble-border-color,var(--a)) 72%,
                #ffffff 28%
            );
    }


    /*//////////////FULL CABINET FLASH//////////////*/

    93%{
        background-image:none;

        background-color:#ffffff;
    }


    /*//////////////COLOR LOCK//////////////*/

    94%{
        background-image:none;

        background-color:
            var(
                --cs-bubble-border-color,
                var(--a)
            );
    }


    95%{
        background-color:
            color-mix(
                in srgb,
                var(--cs-bubble-border-color,var(--a)) 55%,
                #ffffff 45%
            );
    }


    96%{
        background-color:
            var(
                --cs-bubble-border-color,
                var(--a)
            );
    }


    /*//////////////RETURN TO IDLE//////////////*/

    97%,
    100%{
        background-image:none;

        background-color:
            var(
                --cs-bubble-border-color,
                var(--a)
            );

        background-position:
            0 0,
            100% 0,
            100% 100%,
            0 100%;

        opacity:1;

        transform:

        transform:

    97%{
        opacity:1;

        transform:
            translateX(0);
    }
}

    94%{

        transform:

        transform:
