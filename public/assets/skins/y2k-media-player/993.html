        rgba(0,0,0,.16),

        inset 0 1px 0
        rgba(255,255,255,.55);

    opacity:
        0;

    animation:
        y2k-header-content-enter
        280ms
        calc(
            var(--y2k-header-content-delay)
            + 40ms
        )
        ease-out
        both;
}


/*//////////////PLAY LCD PIXELS//////////////////*/

.y2k-play-display::after {
    content:
        "";

    position:
        absolute;

    inset:
        0;

    opacity:
        .13;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 2px,
            var(--y2k-lcd-dark) 2px,
            var(--y2k-lcd-dark) 3px
        );
}


/*//////////////PLAY ICON//////////////////*/

.y2k-play-icon {
    position:
        relative;

    z-index:
        3;

    display:
        block;

    inline-size:
        0;

    block-size:
        0;

    margin-inline-start:
        1px;

    border-block-start:
        3px solid transparent;

    border-block-end:
        3px solid transparent;

    border-inline-start:
        5px solid
        var(--y2k-lcd-dark);

    animation:
        y2k-play-pulse
        2.15s
        ease-in-out
        infinite;
}


/*//////////////BADGES//////////////////*/

.cs-header .cs-badges {
    flex-shrink:
        0;
}


.cs-badges,
.cs-badges--inline {
    opacity:
        0;

    animation:
        y2k-header-content-enter
        280ms
        calc(
            var(--y2k-header-content-delay)
            + 80ms
        )
        ease-out
        both;
}


/*//////////////USERNAME//////////////////*/

.cs-username,
.cs-username--inline {
    position:
        relative;

    min-inline-size:
        0;

    max-inline-size:
        100%;

    white-space:
        nowrap;

    color:
        var(--y2k-username);

    background:
        transparent !important;

    border:
        0 !important;

    box-shadow:
        none !important;
}


.cs-header .cs-username {
    margin-inline-start:
        3px;

    margin-inline-end:
        10px;
}


/*//////////////REAL USERNAME//////////////////*/

.nt-username-real {
    position:
        relative;

    display:
        inline-block;

    white-space:
        nowrap;
}


/*//////////////MP4//////////////////*/

.y2k-fileext {
    display:
        inline;

    margin:
        0;

    padding:
        0;

    color:
        currentColor;

    font:
        inherit;

    line-height:
        inherit;

    letter-spacing:
        inherit;
}


/*//////////////NORMAL CONTENT//////////////////*/

.cs-content {
    position:
        relative;

    z-index:
        5;

    min-inline-size:
        0;

    box-sizing:
        border-box;

    padding:
        calc(
            7px
            + var(--y2k-border-size)
        )
        calc(
            10px
            + var(--y2k-border-size)
        )
        calc(
            9px
            + var(--y2k-border-size)
        );

    overflow:
        hidden;

    clip-path:
        polygon(
            0 0,
            100% 0,
            100% calc(100% - var(--y2k-cut-end)),
            calc(100% - var(--y2k-cut-end)) 100%,
            var(--y2k-cut-start) 100%,
            0 calc(100% - var(--y2k-cut-start))
        );

    background:
        var(--y2k-border);
}


/*//////////////NORMAL CONTENT SURFACE//////////////////*/

.cs-content::before {
    content:
        "";

    position:
        absolute;

    z-index:
        0;

    inset:
        var(--y2k-border-size);

    pointer-events:
        none;

    clip-path:
        inherit;

    background-color:
        var(--y2k-body);

    background-image:

        linear-gradient(
            180deg,
            rgba(255,255,255,.45),
            transparent 38%
        ),

        linear-gradient(
            110deg,
            rgba(140,230,235,.08),
            transparent 30%,
            transparent 70%,
            rgba(185,166,236,.09)
        ),

        var(--y2k-body-gradient);
}


/*//////////////NORMAL CONTENT EDGE//////////////////*/

.cs-content::after {
    content:
        "";

    position:
        absolute;

    z-index:
        1;

    inset:
        calc(
            var(--y2k-border-size)
            + 3px
        );

    pointer-events:
        none;

    clip-path:
        inherit;

    border:
        1px solid
        rgba(255,255,255,.34);
}


/*//////////////CONTENT CHILDREN//////////////////*/

.cs-content > .cs-user--inline,
.cs-content > .cs-message,
.cs-content > .cs-events {
    position:
        relative;

    z-index:
        5;
}


/*//////////////MESSAGE//////////////////*/

.cs-message {
    position:
        relative;

    z-index:
        5;

    color:
        var(--y2k-text);

    font-family:
        var(
            --cs-message-font-family,
            "Roboto"
        ),
        "Roboto",
        Arial,
        sans-serif;

    font-size:
        var(
            --cs-message-font-size,
            14px
        );

    font-weight:
        var(
            --cs-message-font-weight,
            400
        );

    line-height:
        1.22;

    text-align:
        start;
}


/*//////////////REAL MESSAGE//////////////////*/

.nt-message-real {
    position:
        relative;

    display:
        block;

    min-inline-size:
        0;

    max-inline-size:
        100%;
}


/*//////////////NORMAL REVEAL//////////////////*/

.cs-bubble:not(.cs-event)
.nt-username-real,
.cs-bubble:not(.cs-event)
.nt-message-real {
    opacity:
        0;

    animation:
        y2k-real-content
        var(--y2k-reveal-time)
        var(--y2k-reveal-delay)
        steps(1,end)
        both;
}


/*//////////////EMOTES//////////////////*/

.cs-message .emote,
.cs-message img.emote {
    width:
        auto !important;

    inline-size:
        auto !important;

    max-width:
        none !important;

    max-inline-size:
        none !important;

    height:
        calc(
            var(--cs-message-font-size, 14px)
            * 1.55
        ) !important;

    block-size:
        calc(
            var(--cs-message-font-size, 14px)
            * 1.55
        ) !important;

    max-height:
        calc(
            var(--cs-message-font-size, 14px)
            * 1.55
        ) !important;

    max-block-size:
        calc(
            var(--cs-message-font-size, 14px)
            * 1.55
        ) !important;

    object-fit:
        contain;

    vertical-align:
        middle;
}


/*//////////////NORMAL TRANSMISSION//////////////////*/

.nt-transmission {
    position:
        absolute;

    z-index:
        20;

    inset:
        var(--y2k-border-size);

    display:
        grid;

    place-items:
        center;

    box-sizing:
        border-box;

    padding:
        8px;

    overflow:
        hidden;

    pointer-events:
        none;

    clip-path:
        inherit;

    background:
        linear-gradient(
            135deg,
            color-mix(
                in srgb,
                var(--y2k-body) 78%,
                var(--y2k-aqua) 22%
            ),
            color-mix(
                in srgb,
                var(--y2k-body) 75%,
                var(--y2k-lilac) 25%
            )
        );

    animation:
        y2k-player-cover
        var(--y2k-reveal-time)
        var(--y2k-reveal-delay)
        steps(1,end)
        both;
}


/*//////////////TRANSMISSION LCD//////////////////*/

.nt-transmission::before {
    content:
        "";

    position:
        absolute;

    inline-size:
        min(
            74%,
            220px
        );

    block-size:
        25px;

    border:
        1px solid
        rgba(61,89,79,.65);

    border-radius:
        3px;

    background:
        linear-gradient(
            180deg,
            var(--y2k-lcd-light),
            var(--y2k-lcd)
        );

    box-shadow:
        inset 0 1px 4px
        rgba(0,0,0,.18),

        0 0 0 1px
        rgba(255,255,255,.45);
}


/*//////////////TRANSMISSION STATUS//////////////////*/

.nt-transmission-status {
    position:
        relative;

    z-index:
        3;

    color:
        var(--y2k-lcd-dark);

    font-family:
        "Roboto",
        Arial,
        sans-serif;

    font-size:
        calc(
            var(--cs-message-font-size, 14px)
            * .82
        );

    font-weight:
        700;

    line-height:
        1;

    letter-spacing:
        .06em;

    text-align:
        center;

    white-space:
        nowrap;
}


.cs-bubble:not(.cs-event)
.nt-transmission-status::before {
    content:
        "BUFFERING";

    animation:
        y2k-player-status
        var(--y2k-reveal-time)
        var(--y2k-reveal-delay)
        steps(1,end)
        both;
}


/*//////////////////////////////////////////////////////*/
/*//////////////EVENT MEDIA PLAYER//////////////////////*/
/*//////////////////////////////////////////////////////*/


/*//////////////EVENT API//////////////////*/

.cs-bubble.cs-event {

    /*//////////////CUSTOMIZER DERIVED COLORS//////////////////*/

    --event-shell:
        color-mix(
            in srgb,
            var(--y2k-body) 58%,
            var(--y2k-border) 42%
        );

    --event-shell-light:
        color-mix(
            in srgb,
            var(--y2k-body) 82%,
            var(--y2k-border) 18%
        );

    --event-shell-dark:
        color-mix(
            in srgb,
            var(--y2k-border) 68%,
            var(--y2k-text) 32%
        );

    --event-screen:
        color-mix(
            in srgb,
            var(--y2k-title) 66%,
            var(--y2k-body) 34%
        );

    --event-screen-light:
        color-mix(
            in srgb,
            var(--y2k-title) 40%,
            var(--y2k-body) 60%
        );

    --event-screen-dark:
        color-mix(
            in srgb,
            var(--y2k-title) 48%,
            var(--y2k-text) 52%
        );


    /*//////////////EVENT SIZE//////////////////*/

    --y2k-event-min-width:
        300px;

    --y2k-event-min-height:
        82px;


    /*
        Kein min().
        Keine Berechnung gegen 100%.
        Dadurch bleibt der Event-Player
        zuverlässig mindestens 300px breit.
    */

    min-inline-size:
        var(--y2k-event-min-width);

    max-inline-size:
        var(
            --cs-bubble-width,
            400px
        );

    min-block-size:
        var(--y2k-event-min-height);

    box-sizing:
        border-box;

    flex-shrink:
        0;


    /*//////////////REVEAL TIMING//////////////////*/

    --event-reveal-delay:
        80ms;

    --event-shell-time:
        420ms;

    --event-screen-delay:
        260ms;

    --event-user-delay:
        450ms;

    --event-seek-delay:
        560ms;

    --event-controls-delay:
        730ms;

    --event-message-delay:
        980ms;
}


/*//////////////REMOVE NORMAL DECORATION//////////////////*/

.cs-bubble.cs-event
.nt-crt-layer,
.cs-bubble.cs-event
.nt-skin-back,
.cs-bubble.cs-event
.nt-skin-front,
.cs-bubble.cs-event
.nt-transmission {
    display:
        none !important;
}


/*//////////////REMOVE INLINE USER//////////////////*/

.cs-bubble.cs-event
.cs-user--inline {
    display:
        none !important;
}


/*//////////////EVENT SHELL//////////////////*/

.cs-bubble.cs-event
.nt-shell {
    inset:
        0;

    inline-size:
        100%;

    min-inline-size:
        100%;

    min-block-size:
        100%;

    clip-path:
        none;

    border-radius:
        7px;

    background:
        var(--event-shell-dark);

    box-shadow:
        0 2px 4px
        rgba(0,0,0,.15);

    opacity:
        0;

    transform:
        translateY(8px)
        scaleX(.94)
        scaleY(.76);

    transform-origin:
        center bottom;

    animation:
        y2k-event-shell-reveal
        var(--event-shell-time)
        var(--event-reveal-delay)
        cubic-bezier(.18,.78,.22,1.08)
        both !important;
}


/*//////////////EVENT SHELL INNER//////////////////*/

.cs-bubble.cs-event
.nt-shell::before {
    inset:
        var(--y2k-border-size);

    clip-path:
        none;

    border-radius:
        6px;

    background:
        linear-gradient(
            180deg,
            var(--event-shell-light),
            var(--event-shell)
        );
}


/*//////////////EVENT SHELL HIGHLIGHT//////////////////*/

.cs-bubble.cs-event
.nt-shell::after {
    inset:
        calc(
            var(--y2k-border-size)
            + 2px
        );

    clip-path:
        none;

    border:
        1px solid
        rgba(255,255,255,.24);

    border-radius:
        5px;

    opacity:
        0;

    animation:
        y2k-event-final-flash
        420ms
        1160ms
        ease-out
        both;
}


/*//////////////EVENT HEADER//////////////////*/

.cs-bubble.cs-event
.cs-header {
    position:
        relative;

    display:
        block;

    inline-size:
        100%;

    min-inline-size:
        100%;

    min-block-size:
        56px;

    box-sizing:
        border-box;

    padding:
        0;

    overflow:
        hidden;
}


/*//////////////EVENT SCREEN//////////////////*/

.cs-bubble.cs-event
.nt-titlebar {
    position:
        absolute;

    z-index:
        2;

    inset-inline:
        5px;

    inset-block-start:
        5px;

    inset-block-end:
        auto;

    block-size:
        46px;

    clip-path:
        none;

    border:
        1px solid
        var(--event-screen-dark);

    border-radius:
        4px;

    background:
        linear-gradient(
            180deg,
            var(--event-screen-light),
            var(--event-screen)
        );

    box-shadow:
        inset 0 1px 3px
        color-mix(
            in srgb,
            var(--event-screen-dark) 20%,
            transparent
        );

    opacity:
        0;

    transform:
        scaleX(.08)
        scaleY(.72);

    transform-origin:
        center;

    animation:
        y2k-event-screen-reveal
        430ms
        var(--event-screen-delay)
        cubic-bezier(.18,.82,.24,1)
        both !important;
}


/*//////////////EVENT ELAPSED TIME//////////////////*/

.cs-bubble.cs-event
.nt-titlebar::before {
    content:
        "00:13";

    position:
        absolute;

    inset-inline-start:
        8px;

    inset-block-start:
        20px;

    color:
        var(--event-screen-dark);

    font-family:
        "Roboto",
        Arial,
        sans-serif;

    font-size:
        8px;

    font-weight:
        700;

    line-height:
        1;

    clip-path:
        none;

    background:
        none;

    opacity:
        0;

    animation:
        y2k-event-ui-fade
        180ms
        520ms
        ease-out
        both;
}


/*//////////////EVENT REMAINING TIME//////////////////*/

.cs-bubble.cs-event
.nt-titlebar::after {
    content:
        "-02:28";

    position:
        absolute;

    inset-inline-end:
        8px;

    inset-inline-start:
        auto;

    inset-block-start:
        20px;

    inline-size:
        auto;

    block-size:
        auto;

    color:
        var(--event-screen-dark);

    font-family:
        "Roboto",
        Arial,
        sans-serif;

    font-size:
        8px;

    font-weight:
        700;

    line-height:
        1;

    background:
        none;

    opacity:
        0;

    animation:
        y2k-event-ui-fade
        180ms
        580ms
        ease-out
        both;
}


/*//////////////EVENT AVATAR OFF//////////////////*/

.cs-bubble.cs-event
.cs-avatar {
    display:
        none !important;
}


/*//////////////EVENT PLAY LCD OFF//////////////////*/

.cs-bubble.cs-event
.y2k-play-display {
    display:
        none !important;
}


/*//////////////EVENT BADGES OFF//////////////////*/

.cs-bubble.cs-event
.cs-header .cs-badges {
    display:
        none !important;
}


/*//////////////EVENT USER//////////////////*/

.cs-bubble.cs-event
.cs-header .cs-user {
    position:
        absolute;

    z-index:
        6;

    inset-inline-start:
        11px;

    inset-inline-end:
        11px;

    inset-block-start:
        9px;

    display:
        flex;

    align-items:
        center;

    block-size:
        12px;

    min-inline-size:
        0;

    max-inline-size:
        none;

    padding:
        0;

    margin:
        0;

    gap:
        0;

    opacity:
        0;

    transform:
        translateX(-7px);

    animation:
        y2k-event-filename-reveal
        280ms
        var(--event-user-delay)
        cubic-bezier(.2,.72,.3,1)
        both !important;
}


/*//////////////EVENT USERNAME//////////////////*/

.cs-bubble.cs-event
.cs-header .cs-username {
    margin:
        0;

    padding:
        0;

    color:
        var(--y2k-username);

    font-size:
        calc(
            var(--cs-username-font-size, 14px)
            * .88
        );

    font-weight:
        var(
            --cs-username-font-weight,
            700
        );

    line-height:
        1;

    text-shadow:
        0 1px 0
        rgba(255,255,255,.28);
}


.cs-bubble.cs-event
.nt-username-real {
    opacity:
        1;

    animation:
        none !important;
}


/*//////////////EVENT CONTROL AREA//////////////////*/

.cs-bubble.cs-event
.nt-window-panel {
    position:
        absolute;

    z-index:
        7;

    inset-inline-start:
        50%;

    inset-inline-end:
        auto;

    inset-block-start:
        30px;

    inset-block-end:
        auto;

    inline-size:
        70px;

    block-size:
        16px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    gap:
        14px;

    padding:
        0;

    overflow:
        visible;

    border:
        0;

    border-radius:
        0;

    background:
        none;

    box-shadow:
        none;

    transform:
        translateX(-50%);

    animation:
        none !important;
}


/*//////////////EVENT SEEK BAR//////////////////*/

.cs-bubble.cs-event
.nt-window-panel::before {
    content:
        "";

    position:
        absolute;

    z-index:
        -1;

    inset-inline-start:
        50%;

    inset-block-start:
        -5px;

    inline-size:
        86px;

    block-size:
        2px;

    border-radius:
        2px;

    opacity:
        0;

    transform:
        translateX(-50%)
        scaleX(0);

    transform-origin:
        left center;

    background:
        linear-gradient(
            90deg,
            var(--event-screen-dark) 0%,
            var(--event-screen-dark) 42%,
            color-mix(
                in srgb,
                var(--event-screen-dark) 20%,
                transparent
            ) 42%,
            color-mix(
                in srgb,
                var(--event-screen-dark) 20%,
                transparent
            ) 100%
        );

    animation:
        y2k-event-seek-reveal
        360ms
        var(--event-seek-delay)
        cubic-bezier(.2,.74,.25,1)
        both;
}


/*//////////////EVENT SEEK KNOB//////////////////*/

.cs-bubble.cs-event
.nt-window-panel::after {
    content:
        "";

    position:
        absolute;

    inset-inline-start:
        calc(
            50%
            - 7px
        );

    inset-block-start:
        -7px;

    inline-size:
        5px;

    block-size:
        5px;

    border:
        1px solid
        var(--event-screen-dark);

    border-radius:
        50%;

    background:
        var(--event-screen-light);

    opacity:
        0;

    transform:
        scale(.35);

    animation:
        y2k-event-knob-reveal
        240ms
        760ms
        cubic-bezier(.18,.85,.24,1.35)
        both;
}


/*//////////////EVENT CONTROL ICON BASE//////////////////*/

.cs-bubble.cs-event
.nt-window-control {
    position:
        relative;

    inline-size:
        13px;

    block-size:
        11px;

    color:
        var(--event-screen-dark);

    opacity:
        0;

    transform:
        translateY(5px)
        scale(.62);
}


/*//////////////EVENT PREVIOUS//////////////////*/

.cs-bubble.cs-event
.nt-window-min {
    animation:
        y2k-event-control-reveal
        260ms
        var(--event-controls-delay)
        cubic-bezier(.18,.84,.24,1.3)
        both;
}


.cs-bubble.cs-event
.nt-window-min::before {
    inset-inline-start:
        5px;

    inset-block-start:
        2px;

    border-block-start-width:
        3px;

    border-block-end-width:
        3px;

    border-inline-end-width:
        5px;
}


.cs-bubble.cs-event
.nt-window-min::after {
    inset-inline-start:
        2px;

    inset-block-start:
        2px;

    inline-size:
        2px;

    block-size:
        6px;
}


/*//////////////EVENT PLAY//////////////////*/

.cs-bubble.cs-event
.nt-window-max {
    animation:
        y2k-event-control-reveal
        280ms
        calc(
            var(--event-controls-delay)
            + 90ms
        )
        cubic-bezier(.18,.84,.24,1.3)
        both;
}


.cs-bubble.cs-event
.nt-window-max::before {
    inset-inline-start:
        4px;

    inset-block-start:
        2px;

    border-block-start-width:
        3px;

    border-block-end-width:
        3px;

    border-inline-start-width:
        5px;
}


/*//////////////EVENT PLAY CONFIRM//////////////////*/

.cs-bubble.cs-event
.nt-window-max::after {
    content:
        "";

    position:
        absolute;

    inset:
        -3px;

    border:
        1px solid
        currentColor;

    border-radius:
        50%;

    opacity:
        0;

    transform:
        scale(.45);

    pointer-events:
        none;

    animation:
        y2k-event-play-confirm
        420ms
        1010ms
        ease-out
        both;
}


/*//////////////EVENT NEXT//////////////////*/

.cs-bubble.cs-event
.nt-window-close {
    animation:
        y2k-event-control-reveal
