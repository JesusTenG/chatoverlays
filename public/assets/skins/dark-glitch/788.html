/* /////////////////////////////////
   HORROR SIGNAL / COLORS
///////////////////////////////// */

.cs-chat{
    --cs-chat-padding:5px;
}

.cs-bubble{
    --horror-black:#050505;
    --horror-panel:#090909;
    --horror-panel-soft:#0d0d0d;

    --horror-border:#252525;
    --horror-white:#e4e4e4;
    --horror-grey:#858585;

    --glitch-red:#ff153f;
    --glitch-cyan:#00f6ff;
    --glitch-blue:#2377ff;
    --glitch-magenta:#ff00a8;

    position:relative;

    display:grid;

    grid-template-columns:
        auto
        minmax(0,1fr);

    grid-template-rows:
        auto
        auto;

    column-gap:9px;
    row-gap:3px;

    inline-size:fit-content;

    min-inline-size:170px;

    max-inline-size:
        var(--cs-bubble-width,470px);

    isolation:isolate;

    overflow:hidden;

    rotate:-.45deg;

    padding-block-start:
        var(
            --cs-bubble-padding-top,
            var(--cs-bubble-padding,7px)
        );

    padding-inline-end:
        var(
            --cs-bubble-padding-right,
            var(--cs-bubble-padding,8px)
        );

    padding-block-end:
        var(
            --cs-bubble-padding-bottom,
            var(--cs-bubble-padding,7px)
        );

    padding-inline-start:
        var(
            --cs-bubble-padding-left,
            var(--cs-bubble-padding,8px)
        );

    background-color:
        var(
            --cs-bubble-background-color,
            var(--horror-black)
        );

    background-image:
        linear-gradient(
            115deg,
            rgba(255,255,255,.018),
            transparent 32%,
            rgba(255,255,255,.01)
        ),
        var(--cs-bubble-background-gradient,none);

    border-width:
        var(--cs-bubble-border-width,1px);

    border-style:
        var(--cs-bubble-border-style,solid);

    border-color:
        var(
            --cs-bubble-border-color,
            var(--horror-border)
        );

    border-radius:
        var(--cs-bubble-border-radius,10px);

    animation:
        horror-bubble-reveal
        760ms
        cubic-bezier(.2,.75,.18,1)
        both;
}


/* /////////////////////////////////
   ALTERNATING BUBBLE TILT
///////////////////////////////// */

.cs-bubble:nth-child(2n){
    rotate:.42deg;
}

.cs-bubble:nth-child(3n){
    rotate:-.62deg;
}

.cs-bubble:nth-child(4n){
    rotate:.55deg;
}

.cs-bubble:nth-child(5n){
    rotate:-.35deg;
}


/* /////////////////////////////////
   HEADER
///////////////////////////////// */

.cs-header{
    display:contents;
}


/* /////////////////////////////////
   STATIC DETAILS
///////////////////////////////// */

.cs-horror-signal{
    position:absolute;

    z-index:5;

    inset:0;

    pointer-events:none;

    opacity:.75;

    animation:
        horror-detail-reveal
        700ms
        130ms
        steps(1,end)
        both;
}

.cs-horror-signal::before{
    content:"";

    position:absolute;

    inset-block-start:0;
    inset-inline-start:17px;

    inline-size:27px;
    block-size:1px;

    background:#555555;

    rotate:1.4deg;
}

.cs-horror-signal::after{
    content:"";

    position:absolute;

    inset-inline-end:13px;
    inset-block-end:0;

    inline-size:18px;
    block-size:1px;

    background:#3d3d3d;

    rotate:-1.8deg;
}


/* /////////////////////////////////
   AVATAR
///////////////////////////////// */

.cs-avatar{
    position:relative;

    grid-column:1;
    grid-row:1 / span 2;

    align-self:center;

    overflow:hidden;

    z-index:3;

    rotate:1.8deg;
}

.cs-bubble:nth-child(2n) .cs-avatar{
    rotate:-1.5deg;
}

.cs-bubble:nth-child(3n) .cs-avatar{
    rotate:2.1deg;
}

.cs-avatar img{
    display:block;

    inline-size:
        var(--cs-avatar-size,35px);

    block-size:
        var(--cs-avatar-size,35px);

    object-fit:cover;

    padding:
        var(--cs-avatar-padding,0);

    background-color:
        var(
            --cs-avatar-background-color,
            #0b0b0b
        );

    border-width:
        var(--cs-avatar-border-width,1px);

    border-style:
        var(--cs-avatar-border-style,solid);

    border-color:
        var(
            --cs-avatar-border-color,
            #303030
        );

    border-radius:
        var(--cs-avatar-border-radius,8px);

    filter:
        grayscale(1)
        contrast(1.12)
        brightness(.73);

    opacity:.92;

    animation:
        horror-avatar-reveal
        600ms
        150ms
        steps(1,end)
        both;
}


/* /////////////////////////////////
   USER
///////////////////////////////// */

.cs-user{
    grid-column:2;
    grid-row:1;

    justify-self:start;
    align-self:end;

    min-inline-size:0;

    gap:4px;

    rotate:-1deg;

    padding-block-start:
        var(
            --cs-username-padding-top,
            var(--cs-username-padding,3px)
        );

    padding-inline-end:
        var(
            --cs-username-padding-right,
            var(--cs-username-padding,7px)
        );

    padding-block-end:
        var(
            --cs-username-padding-bottom,
            var(--cs-username-padding,3px)
        );

    padding-inline-start:
        var(
            --cs-username-padding-left,
            var(--cs-username-padding,7px)
        );

    background-color:
        var(
            --cs-username-background-color,
            var(--horror-panel-soft)
        );

    background-image:
        var(--cs-username-background-gradient,none);

    border-width:
        var(--cs-username-border-width,1px);

    border-style:
        var(--cs-username-border-style,solid);

    border-color:
        var(
            --cs-username-border-color,
            #202020
        );

    border-radius:
        var(--cs-username-border-radius,7px);

    animation:
        horror-user-reveal
        540ms
        270ms
        steps(1,end)
        both;
}

.cs-bubble:nth-child(2n) .cs-user{
    rotate:1.25deg;
}

.cs-bubble:nth-child(3n) .cs-user{
    rotate:-1.5deg;
}


/* /////////////////////////////////
   USERNAME
///////////////////////////////// */

.cs-username,
.cs-username--inline{
    color:
        var(
            --cs-username-font-color,
            #d0d0d0
        );

    line-height:1.05;

    letter-spacing:.045em;

    text-shadow:none;
}


/* /////////////////////////////////

///////////////////////////////// */

}


/* /////////////////////////////////
   BADGES
///////////////////////////////// */

.cs-badges{
    gap:3px;
}

.cs-badges img{
    filter:
        grayscale(1)
        contrast(1.1)
        brightness(.78);

    opacity:.72;

    border-radius:4px;

///////////////////////////////// */

.cs-content{

    grid-column:2;
    grid-row:2;

    min-inline-size:0;

    z-index:2;

/* /////////////////////////////////
   ROLE AVATAR / REVERSED TILT
///////////////////////////////// */

.cs-bubble:is(.cs-vip,.cs-mod,.cs-sub) .cs-avatar{
    rotate:-1.8deg;
}

.cs-bubble:is(.cs-vip,.cs-mod,.cs-sub):nth-child(2n) .cs-avatar{
    rotate:1.5deg;
}

.cs-bubble:is(.cs-vip,.cs-mod,.cs-sub):nth-child(3n) .cs-avatar{
    rotate:-2.1deg;
}
.cs-bubble:not(.cs-event){
    --mod-green:#28ff63;
    --mod-hot:#84ff9f;
    --mod-toxic:#b7ff35;
    --mod-dark:#073313;

    background-color:#050705 !important;

    border-color:#24552e !important;

    box-shadow:
        0 0 5px rgba(40,255,99,.09) !important;

    animation:
        mod-corrupt-reveal
        760ms
        steps(1,end)
        backwards,

        mod-corrupt-bubble
        7s
        1.4s
        steps(1,end)
        infinite !important;
}




.cs-bubble:not(.cs-event) .cs-user{
    background-color:#08100a !important;

    border-color:#24552e !important;

    animation:
        mod-user-reveal
        620ms
        130ms
        steps(1,end)
        backwards,

        mod-user-corrupt
        7s
        1.4s
        steps(1,end)
        infinite !important;
}




.cs-bubble:not(.cs-event) .cs-message{
    background-color:#070c08 !important;

    border-color:#193b20 !important;

    color:#d7e9d9 !important;

    animation:
        mod-message-reveal
        680ms
        210ms
        steps(1,end)
        backwards,

        mod-message-corrupt
        7s
        1.4s
        steps(1,end)
        infinite !important;
}




.cs-bubble:not(.cs-event) .cs-username,
.cs-bubble:not(.cs-event) .cs-username--inline{
