html,
body{
    margin:0;
    padding:0;

/*////////////// CHAT //////////////*/

.cs-chat{
    --cs-chat-padding-top:3px;
    --cs-chat-padding-right:20px;
    --cs-chat-padding-bottom:20px;
    --cs-chat-padding-left:3px;
}

.cs-bubble,
.cs-bubble *{
    box-sizing:border-box;
}

/*////////////// BUBBLE //////////////*/

.cs-bubble{
    --ink:#111;
    --white:#fff;

    --cs-bubble-border-color:
        var(--cs-usercolor,#f0b92e);

    --cs-bubble-background-color:#fff;
    --cs-avatar-background-color:#fff;
    --cs-message-background-color:#fff;

    --accent:
        var(
            --cs-bubble-border-color,
            var(--cs-usercolor,#f0b92e)
        );

    --check:16px;

    --cs-bubble-animation:bp-jack-in-the-box;

    --cs-checker-spring:
        linear(
            0 0%,
            .02 4%,
            .07 8%,
            .16 12%,
            .30 17%,
            .49 22%,
            .69 27%,
            .87 32%,
            1.01 37%,
            1.10 42%,
            1.14 47%,
            1.13 51%,
            1.09 56%,
            1.04 61%,
            1 66%,
            .978 71%,
            .972 75%,
            .98 80%,
            .994 84%,
            1.006 88%,
            1.011 92%,
            1.008 95%,
            1.003 97%,
            1 100%
        );

    position:relative;
    isolation:isolate;

    display:grid;

    grid-template-columns:
        minmax(16rem,max-content)
        minmax(18rem,1fr);

    align-items:center;

    gap:1rem;

    width:min(54rem,94vw);
    min-width:36rem;
    min-height:6.4rem;

    margin:3px;

    padding:1rem;

    color:var(--ink);

    background:
        conic-gradient(
            var(--ink) 25%,
            var(--cs-bubble-background-color,#fff) 0 50%,
            var(--ink) 0 75%,
            var(--cs-bubble-background-color,#fff) 0
        )
        0 0 /
        var(--check)
        var(--check);

    border:4px solid var(--ink);

    border-radius:18px;

    box-shadow:
        9px 9px 0 var(--ink),
        9px 15px 0 -3px var(--accent);

    transform-origin:15% 120%;

    transition:
        transform 720ms cubic-bezier(.22,.8,.22,1),
        translate 720ms cubic-bezier(.22,.8,.22,1),
        top 720ms cubic-bezier(.22,.8,.22,1),
        bottom 720ms cubic-bezier(.22,.8,.22,1),
        opacity 420ms ease;
}

/*////////////// HEADER //////////////*/

.cs-header{
    position:relative;
    z-index:2;

    display:flex;
    align-items:center;

    gap:.72rem;

    min-width:0;

    transform:rotate(-1.8deg);
}

/*////////////// AVATAR //////////////*/

.cs-avatar{
    position:relative;

    flex:0 0 auto;

    width:4.7rem;
    height:4.7rem;

    overflow:hidden;

    background:
        var(--cs-avatar-background-color,#fff);

    border:4px solid var(--ink);

    border-radius:12px;

    box-shadow:
        5px 5px 0 var(--accent);

    transform-origin:50% 65%;

    animation:
        cs-checker-avatar-in
        1050ms
        var(--cs-checker-spring)
        120ms
        both;
}

.cs-avatar img,
.cs-avatar video{
    display:block;

    width:100%;
    height:100%;

    object-fit:cover;
}

/*////////////// USER //////////////*/

.cs-user{
    display:flex;

    flex-direction:column;
    align-items:flex-start;

    gap:.42rem;

    min-width:0;

    transform:rotate(2.4deg);
}

/*////////////// BADGES //////////////*/

.cs-badges{
    display:flex;

    align-items:center;
    flex-wrap:wrap;

    gap:.35rem;

    min-height:1.9rem;

    padding:.27rem .42rem;

    background:var(--white);

    border:3px solid var(--ink);

    border-radius:7px;

    box-shadow:
        3px 3px 0 var(--ink);

    transform-origin:20% 70%;

    animation:
        cs-checker-badges-in
        950ms
        var(--cs-checker-spring)
        210ms
        both;
}

/*////////////// BADGE VISIBILITY //////////////*/

.cs-badges:not(:has(img,svg)){
    display:none;
}

.cs-badges:has(img,svg){
    display:flex;
}

.cs-badges img,
.cs-badges svg{
    display:block;

    width:1.6rem;
    height:1.6rem;

    object-fit:contain;
}

.cs-badges img:nth-child(odd),
.cs-badges svg:nth-child(odd){
    transform:rotate(-6deg);
}

.cs-badges img:nth-child(even),
.cs-badges svg:nth-child(even){
    transform:rotate(6deg);
}

/*////////////// USERNAME //////////////*/

.cs-username{
    position:relative;

    display:inline-flex;
    align-items:center;

    width:max-content;

        290ms
        both;

.cs-pronouns{

/*////////////// CONTENT //////////////*/

.cs-content{
    position:relative;
    z-index:2;

    display:flex;
    align-items:center;

    transform-origin:10% 55%;

.cs-user--inline{

.cs-message{
    position:relative;

    width:100%;
    min-height:4.15rem;

    padding:
        .9rem

.cs-message::after{
    content:"";

    top:.55rem;
    right:.65rem;

    width:.55rem;
    height:.55rem;

    background:var(--accent);

    border:2px solid var(--ink);

    border-radius:50%;

    transform:rotate(-6deg);

/*////////////// EVENT MESSAGE //////////////*/
