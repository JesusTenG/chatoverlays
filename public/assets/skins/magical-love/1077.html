/*////////////// EVENT //////////////*/

.cs-bubble.cs-event {
    --surface-base: #fff1f8;

    --cute-frame: #efa6ce;

    --cute-panel:
        color-mix(
            in srgb,
            var(--cute-frame) 49%,
            #fffafd 51%
        );

    --cute-username: #804b6c;
    --cute-message-text: #584753;

    flex-direction: row;

    align-items: center;

    gap: 6.6px;

    min-inline-size:
        min(
            202.125px,
            100%
        );

    min-block-size: 59.4px;

    padding-block-start: 14.85px;

    /*
        EVENT DECORS MUST BE ABLE TO ESCAPE
        THE BUBBLE STACKING CONTEXT.
    */
    isolation: auto;

    overflow: visible;

    /*
        STATIC RAINBOW MIDDLE BORDER.
        NO MASKING.
        NO BACKGROUND-POSITION ANIMATION.
    */
    border-color: transparent;

    background-color:
        var(--cute-surface);

    background-image:
        var(
            --cs-bubble-background-gradient,
            none
        ),

        linear-gradient(
            var(--cute-surface),
            var(--cute-surface)
        ),

        linear-gradient(
            90deg,
            #f5a7ce 0%,
            #ffd97f 17%,
            #aae7d1 35%,
            #a5daf6 54%,
            #cbb8f4 74%,
            #f6acd6 100%
        );

    background-origin:
        padding-box,
        padding-box,
        border-box;

    background-clip:
        padding-box,
        padding-box,
        border-box;

    /*
        BOTH WHITE BORDERS ARE STATIC.
    */
    box-shadow:
        0 0 0
        var(--frame-white-outer)
        #ffffff,

        inset 0 0 0
        var(--frame-white-inner)
        #ffffff;

    /*
        EVENT PARENT NEVER MOVES.
        WHITE BORDERS THEREFORE NEVER MOVE.
    */
    animation: none;

    opacity: 1;

    transform: none;
}


/*////////////// EVENT AURORA //////////////*/

.cs-bubble.cs-event::before {
    content: "";

    position: absolute;

    z-index: 1;

    inset:
        var(--frame-white-inner);

    pointer-events: none;

    border: 0;

    border-radius:
        calc(
            var(--cs-bubble-border-radius, 14.025px)
            - 1.65px
        );

    background:
        linear-gradient(
            112deg,
            rgba(246, 172, 214, .06) 0%,
            rgba(255, 221, 132, .10) 18%,
            rgba(169, 233, 211, .09) 36%,
            rgba(163, 216, 247, .10) 54%,
            rgba(204, 184, 244, .09) 74%,
            rgba(246, 172, 214, .06) 100%
        );

    opacity: 0;

    /*
        OPACITY ONLY.
        ONE RUN.
    */
    animation:
        sailor-event-aurora-in
        850ms
        calc(
            var(--cs-events-animation-delay, 0ms)
            + 100ms
        )
        ease-out
        both;
}


/*////////////// EVENT BUBBLE SWEEP OFF //////////////*/

.cs-bubble.cs-event::after {
    content: none;
}


/*////////////// EVENT LAYERS //////////////*/

.cs-bubble.cs-event

.cs-content {
    position: relative;

    z-index: 20;

.cs-bubble.cs-event

        -50%;

    --burst-y: -8.8px;

    --jewel-delay: 440ms;
    --float-delay: 7200ms;
}


.cs-bubble.cs-event
.cs-decor--heart-b {
    display: block;

    inset-inline-end:
        var(--border-center);

    inset-block-start: 34%;

    translate:
        50%
        -50%;

    rotate: 8deg;

    --burst-x: 11px;
    --burst-y: -4.4px;

    --jewel-delay: 590ms;
    --float-delay: 9600ms;
}


.cs-bubble.cs-event
.cs-decor--star-b {
    display: block;

        -50%
        50%;

    rotate: -8deg;

    --jewel-delay: 740ms;
    --float-delay: 12000ms;
}


/*////////////// EVENT SVG REVEAL //////////////*/

.cs-bubble.cs-event
.cs-decor svg {

        EVENT ONLY:
        STRONG RAINBOW ZOOM.
    */
    animation-name:
        sailor-event-jewel-in,
        sailor-event-jewel-float;

    animation-duration:
        1120ms,
        12000ms;

    animation-delay:
        calc(
            var(--cs-events-animation-delay, 0ms)
            + var(--jewel-delay)
        ),
        calc(
            var(--cs-events-animation-delay, 0ms)
            + var(--float-delay)
        );

    animation-timing-function:
        cubic-bezier(.16, .76, .18, 1),
        ease-in-out;

    animation-fill-mode:
        both,
        none;

    animation-iteration-count:
        1,
        infinite;
}





/*////////////// EVENT SVG OUTLINE //////////////*/

.cs-bubble.cs-event
.cs-decor-outline {
    stroke: #ffffff;

        NO DROP SHADOW.

        sailor-event-outline-in
        820ms
        calc(
            var(--cs-events-animation-delay, 0ms)
            + var(--jewel-delay)
        )

}

    }

        opacity: 1;
    }

/*////////////// EVENT PANEL RAINBOW //////////////*/

@keyframes sailor-event-panel-rainbow-flow {
    from {
        transform:

    }

    to {
        transform:
            translate3d(-264px, 0, 0);
    }
}


/*////////////// EVENT SVG RAINBOW ZOOM //////////////*/

@keyframes sailor-event-jewel-in {
    0% {
        opacity: 0;

        transform:
            translate(0, 0)
            scale(.12)
            rotate(-20deg);
    }

    16% {
        opacity: .18;

        transform:
            translate(
                calc(
                    var(--burst-x, 0px)
                    * .12
                ),
                calc(
                    var(--burst-y, 0px)
                    * .12
                )
            )
            scale(.34)
            rotate(-15deg);
    }

    32% {
        opacity: .72;

        transform:
            translate(
                calc(
                    var(--burst-x, 0px)
                    * .5
                ),
                calc(
                    var(--burst-y, 0px)
                    * .5
                )
            )
            scale(.82)
            rotate(-7deg);
    }

    48% {
        opacity: 1;

        transform:
            translate(
                calc(
                    var(--burst-x, 0px)
                    * .92
                ),
                calc(
                    var(--burst-y, 0px)
                    * .92
                )
            )
            scale(1.28)
            rotate(6deg);
    }

    60% {
        transform:
            translate(
                var(--burst-x, 0px),
                var(--burst-y, 0px)
            )
            scale(1.16)
            rotate(3deg);
    }

    72% {
        transform:
            translate(
                calc(
                    var(--burst-x, 0px)
                    * .42
                ),
                calc(
                    var(--burst-y, 0px)
                    * .42
                )
            )
            scale(.98)
            rotate(-1deg);
    }

    84% {
        transform:
            translate(
                calc(
                    var(--burst-x, 0px)
                    * .14
                ),
                calc(
                    var(--burst-y, 0px)
                    * .14
                )
            )
            scale(1.022)
            rotate(.4deg);
    }

    94% {
        transform:
            translate(
                calc(
                    var(--burst-x, 0px)
                    * .04
                ),
                calc(
                    var(--burst-y, 0px)
                    * .04
                )
            )
            scale(.997);
    }

    100% {
        opacity: 1;

        transform: none;
    }
}

@keyframes sailor-event-jewel-colour {

    }

    16.666% {
        fill: #ffd778;
    }

    33.333% {
        fill: #a8e7d0;
    }

    50% {
        fill: #9fd9f6;
    }

    66.666% {
        fill: #b7c6f7;
    }

        fill: #c9b6f2;
    }
}

        opacity: .68;
    }

    52% {
        opacity: 1;
    }

    100% {
        opacity: 1;
    }
}

@keyframes sailor-event-jewel-float {

    */
    0%,

    100% {

    }

    78% {
        transform:
            translateY(-.495px)
            scale(1.004);
    }

    82% {
        transform:

            scale(1.011);
    }

    86% {
        transform:
            translateY(-.825px)

    }

        transform:
            translateY(-.22px)
            scale(1.002);
    }

    93% {
        transform: none;
    }
}

        transform:
            translateX(-9.9px)
            scale(.95);
    }

    68% {
        opacity: 1;

        transform:
            translateX(.66px)

    }

/*////////////// RESPONSIVE //////////////*/

@media (max-width: 420px) {

    .cs-chat {
        padding-inline-start:
            var(
                --cs-chat-padding-left,
                var(--cs-chat-padding, 18.15px)
            );

        padding-inline-end:
            var(

                var(--cs-chat-padding, 18.15px)
            );
    }

    .cs-bubble {
        gap: 5.775px;

        padding-inline-start: 7.425px;
        padding-inline-end: 8.25px;
    }

    .cs-header {
        gap: 4.125px;
    }

    .cs-content {
        min-inline-size: 45.375px;

        max-inline-size: none;
    }

    .cs-bubble.cs-event {
        min-inline-size:
            min(
                177.375px,
                100%
            );

        gap: 4.95px;

        padding-block-start: 14.025px;
    }

    .cs-bubble.cs-event
    .cs-content {
        min-inline-size: 49.5px;
    }

    .cs-bubble.cs-event

        min-inline-size: 49.5px;
    }
}


/*////////////// VERY SMALL //////////////*/

@media (max-width: 320px) {

    .cs-bubble {
        --avatar-size:
            min(
                var(--cs-avatar-size, 34.65px),
                28.05px
            );

        --decor-size: 20.625px;
    }

    .cs-message {
        padding-inline-start: 5.775px;
        padding-inline-end: 5.775px;
    }

    .cs-username {
        padding-inline-start: 5.775px;
        padding-inline-end: 5.775px;
    }

    .cs-bubble.cs-event {
        min-inline-size:
            min(
                156.75px,
                100%
            );

        padding-inline-start: 6.6px;
        padding-inline-end: 6.6px;
    }
}


/*////////////// REDUCED MOTION //////////////*/

@media (prefers-reduced-motion: reduce) {

    .cs-bubble,
    .cs-avatar img,
    .cs-avatar video,
    .cs-badges,
    .cs-username,
    .cs-message,
    .cs-decor svg,
    .cs-decor-body,
    .cs-decor-outline,
    .cs-bubble.cs-event::before,
    .cs-bubble.cs-event::after,
    .cs-bubble.cs-event .cs-username::before,
    .cs-bubble.cs-event .cs-message::before {
        animation: none !important;
    }

    .cs-bubble.cs-event,
    .cs-bubble.cs-event
    .cs-decor svg {
        opacity: 1;

        transform: none;
    }

    .cs-bubble.cs-event::before {
        opacity: 1;
    }

    .cs-bubble.cs-event::after {
        opacity: 0;
    }

    .cs-bubble.cs-event .cs-username::before,
    .cs-bubble.cs-event .cs-message::before {
        transform: none;
    }

    .cs-bubble.cs-event
    .cs-decor-outline {
        opacity: 1;

        stroke: #ffffff;
    }
}

.cs-bubble,
.cs-bubble.cs-sub:not(.cs-event),
.cs-bubble.cs-vip:not(.cs-event),
.cs-bubble.cs-mod:not(.cs-event),
.cs-bubble.cs-broadcaster:not(.cs-event) {
    --surface-base: #fff5ff;
    --cute-frame: #c59de7;
    --cute-username: #765589;
    --cute-message-text: #62556b;

    --cute-panel:
        linear-gradient(
            135deg,
            #f6c4dc,
            #d5c7f5,
            #bfe8ee
        );

    --cute-name-panel:
        linear-gradient(
            135deg,
            #f4bfd8,
            #d6c4f3
        );

    --cute-badge-panel:
        #e7d4f3;

    --cute-message-panel:
        linear-gradient(
            135deg,
            #e7d5f4,
            #cce9ef
        );
}

.cs-bubble.cs-event {
    --surface-base: #fff5ff;
    --cute-frame: #b98ee1;
    --cute-username: #704f86;

    background-image:
        none,
        linear-gradient(
            var(--cute-surface),
            var(--cute-surface)
        ),
        linear-gradient(
            90deg,
            #f29fc6,
            #cba7eb,
            #a9dfea,
            #f2c5dc,
            #f29fc6
        );
}

.cs-bubble .cs-decor-body {
    animation: cotton-candy-cycle 5s linear infinite;
}

@keyframes cotton-candy-cycle {
    0%, 100% {
        fill: #f0a4c8;
    }

    33% {
        fill: #c09ce6;
    }

    66% {
        fill: #94d6df;
    }
