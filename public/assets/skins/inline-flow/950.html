html,
body {
  margin: 0;
  padding: 0;

  inline-size: 100%;
  min-inline-size: 0;

  overflow: visible;

  background: transparent;
}

.cs-bubble,
.cs-bubble *,
.cs-bubble::before,
.cs-bubble::after {
  box-sizing: border-box;
}

/*//////////////CHAT//////////////////*/

.cs-chat {
  --cs-bubble-gap: 3px;

  --cs-chat-padding-top: 0px;
  --cs-chat-padding-right: 8px;
  --cs-chat-padding-bottom: 0px;
  --cs-chat-padding-left: 8px;

  inline-size: 100%;
  min-inline-size: 0;
}

/*//////////////CHAT ITEMS//////////////////*/

/*
  Verhindert zusätzlichen Inline-
  beziehungsweise Baseline-Space auf
  eventuell vorhandenen äußeren
  Message-Wrappern.

  Der eigentliche Abstand zwischen
  Nachrichten kommt ausschließlich
  vom Framework über --cs-bubble-gap.
*/

.cs-chat > * {
  margin-block: 0;
  line-height: 0;
}

/*//////////////BUBBLE//////////////////*/

.cs-bubble {
  --cs-bubble-width: 600px;

  --cs-bubble-padding-top: 3px;
  --cs-bubble-padding-right: 16px;
  --cs-bubble-padding-bottom: 3px;
  --cs-bubble-padding-left: 5px;

  --cs-bubble-background-color:
    var(
      --cs-usercolor,
      #ffffff
    );

  --cs-bubble-border-width: 1px;
  --cs-bubble-border-style: solid;

  --cs-bubble-border-color:
    var(
      --cs-usercolor,
      #ffffff
    );

  --cs-bubble-border-radius: 0px;

  --cs-avatar-size: 24px;
  --cs-avatar-padding: 1px;

  --cs-avatar-border-width: 1px;
  --cs-avatar-border-style: solid;

  --cs-avatar-border-color:
    var(
      --cs-usercolor,
      #ffffff
    );

  --cs-avatar-border-radius: 0px;

  --cs-username-font-size: 13px;
  --cs-username-font-weight: 800;

  --cs-message-font-size: 13px;
  --cs-message-font-weight: 500;

  --cs-message-background-color: transparent;

  --cs-bubble-animation:
    bp-light-speed-in-right;

  --cs-bubble-animation-duration:
    750ms;

  --cs-bubble-animation-delay:
    0ms;

  --cs-bubble-animation-timing-function:
    ease-out;

  position: relative;

  display: flex;

  flex-direction: row;
  flex-wrap: nowrap;

  align-items: center;

  inline-size: fit-content;

  min-inline-size: 0;

  max-inline-size:
    min(
      var(--cs-bubble-width, 600px),
      100%
    );

  margin: 0;

  padding:
    var(--cs-bubble-padding-top)
    var(--cs-bubble-padding-right)
    var(--cs-bubble-padding-bottom)
    var(--cs-bubble-padding-left);

  column-gap: 8px;

  color:
    var(
      --cs-message-font-color,
      #ffffff
    );

  background-color:
    var(
      --cs-bubble-background-color,
      var(--cs-usercolor, #ffffff)
    );

  background-image:
    var(
      --cs-bubble-background-gradient,
      none
    );

  border-width:
    var(
      --cs-bubble-border-width,
      1px
    );

  border-style:
    var(
      --cs-bubble-border-style,
      solid
    );

  border-color:
    var(
      --cs-bubble-border-color,
      var(--cs-usercolor, #ffffff)
    );

  border-radius:
    var(
      --cs-bubble-border-radius,
      0px
    );

  line-height: 1;

  overflow: hidden;
}

/*//////////////STRUCTURE//////////////////*/

/*
  HTML-Struktur des Frameworks bleibt
  bestehen.

  Header und Content erzeugen nur keine
  zusätzliche Flex-Ebene, damit Avatar,
  User und Message in derselben Reihe
  angeordnet werden können.
*/

.cs-header,
.cs-content {
  display: contents;
}

/*//////////////AVATAR//////////////////*/

.cs-avatar {
  display: flex;

  align-items: center;
  justify-content: center;

  flex: 0 0 auto;

  inline-size: max-content;
  min-inline-size: max-content;

  margin: 0;
  padding: 0;

  order: 0;

  line-height: 1;
}

/*//////////////AVATAR IMAGE//////////////////*/

.cs-avatar img {
  display: block;

  inline-size:
    var(
      --cs-avatar-size,
      24px
    );

  block-size:
    var(
      --cs-avatar-size,
      24px
    );

  flex: 0 0 auto;

  margin: 0;

  padding:
    var(
      --cs-avatar-padding,
      1px
    );

  background-color:
    var(
      --cs-avatar-background-color,
      transparent
    );

  background-image:
    var(
      --cs-avatar-background-gradient,
      none
    );

  border-width:
    var(
      --cs-avatar-border-width,
      1px
    );

  border-style:
    var(
      --cs-avatar-border-style,
      solid
    );

  border-color:
    var(
      --cs-avatar-border-color,
      var(--cs-usercolor, #ffffff)
    );

  border-radius:
    var(
      --cs-avatar-border-radius,
      0px
    );

  object-fit: cover;
}

/*//////////////USER//////////////////*/

.cs-user,
.cs-user--inline {
  flex-direction: row;
  flex-wrap: nowrap;

  align-items: center;

  flex: 0 0 auto;

  inline-size: max-content;
  min-inline-size: max-content;
  max-inline-size: none;

  gap: 5px;

  line-height: 1;

  white-space: nowrap;

  overflow: visible;

  order: 1;
}

/*//////////////USERNAME//////////////////*/

.cs-username,
.cs-username--inline {
  flex: 0 0 auto;

  inline-size: max-content;
  min-inline-size: max-content;
  max-inline-size: none;

  color:
    var(
      --cs-username-font-color,
      #ffffff
    );

  font-family:
    var(
      --cs-username-font-family,
      inherit
    );

  font-size:
    var(
      --cs-username-font-size,
      13px
    );

  font-weight:
    var(
      --cs-username-font-weight,
      800
    );

  line-height: 13px;

  letter-spacing: -0.01em;

  white-space: nowrap;

  word-break: normal;
  overflow-wrap: normal;

  overflow: visible;
  text-overflow: clip;
}

/*//////////////SEPARATOR//////////////////*/

.cs-user::after,
.cs-user--inline::after {
  content: "";

  display: inline-block;

  inline-size: 1px;
  block-size: 13px;

  flex: 0 0 1px;

  margin-inline-start: 4px;
  margin-inline-end: 2px;

  background:
    rgba(
      255,
      255,
      255,
      0.72
    );

  opacity: 0.72;
}

/*//////////////PRONOUNS//////////////////*/

.cs-pronouns,
.cs-pronouns--inline {
  flex: 0 0 auto;

  inline-size: max-content;
  min-inline-size: max-content;

  margin: 0;

  color:
    var(
      --cs-pronouns-font-color,
      var(
        --cs-message-font-color,
        #ffffff
      )
    );

  font-family:
    var(
      --cs-pronouns-font-family,
      inherit
    );

  font-size:
    var(
      --cs-pronouns-font-size,
      10px
    );

  font-weight:
    var(
      --cs-pronouns-font-weight,
      500
    );

  line-height: 10px;

  white-space: nowrap;

  word-break: normal;
  overflow-wrap: normal;

  opacity: 0.6;
}

/*//////////////BADGES//////////////////*/

.cs-badges,
.cs-badges--inline {
  align-items: center;

  flex: 0 0 auto;

  inline-size: max-content;
  min-inline-size: max-content;

  gap: 3px;

  line-height: 1;

  white-space: nowrap;

  overflow: visible;
}

.cs-badges img,
.cs-badges--inline img {
  display: block;

  inline-size: 14px;
  block-size: 14px;

  flex: 0 0 14px;

  margin: 0;
  padding: 0;

  border: 0;
  border-radius: 0;

  object-fit: contain;
}

/*//////////////MESSAGE//////////////////*/

.cs-message,
.cs-bubble.cs-username-position-inline .cs-message {
  position: relative;

  display: block;

  /*
    Nur die Message darf horizontal
    schrumpfen.
  */
  flex: 1 1 auto;

  inline-size: auto;

  min-inline-size: 0;
  max-inline-size: 100%;

  order: 2;

  margin: 0;
  padding:
    var(
      --cs-message-padding-top,
      var(--cs-message-padding, 0px)
    )
    var(
      --cs-message-padding-right,
      var(--cs-message-padding, 0px)
    )
    var(
      --cs-message-padding-bottom,
      var(--cs-message-padding, 0px)
    )
    var(
      --cs-message-padding-left,
      var(--cs-message-padding, 0px)
    );

  color:
    var(
      --cs-message-font-color,
      #ffffff
    );

  background-color:
    var(
      --cs-message-background-color,
      transparent
    );

  background-image:
    var(
      --cs-message-background-gradient,
      none
    );

  font-family:
    var(
      --cs-message-font-family,
      inherit
    );

  font-size:
    var(
      --cs-message-font-size,
      13px
    );

  font-weight:
    var(
      --cs-message-font-weight,
      500
    );

  line-height: 17px;

  /*
    Ausschließlich hier darf
    Text umbrechen.
  */
  white-space: normal;

  word-break: normal;
  overflow-wrap: anywhere;

  overflow: visible;
  text-overflow: clip;
}

/*//////////////EMOTES//////////////////*/

.cs-message .emote {
  display: inline-block;

  flex: 0 0 auto;

  width: auto !important;
  inline-size: auto !important;

  height:
    calc(
      var(--cs-message-font-size, 13px)
      * 1.55
    )
    !important;

  block-size:
    calc(
      var(--cs-message-font-size, 13px)
      * 1.55
    )
    !important;

  max-width: none !important;
  max-inline-size: none !important;

  max-height:
    calc(
      var(--cs-message-font-size, 13px)
      * 1.55
    )
    !important;

  max-block-size:
    calc(
      var(--cs-message-font-size, 13px)
      * 1.55
    )
    !important;

  object-fit: contain;

  margin-inline: 1px;

  vertical-align: middle;
}

/*//////////////EMOTE ONLY//////////////////*/

.cs-bubble.cs-emote-only .cs-message,
.cs-bubble.cs-emote-only.cs-username-position-inline .cs-message {
  display: flex;

  flex: 0 1 auto;
  flex-wrap: nowrap;

  align-items: center;

  inline-size: max-content;

  min-inline-size: 0;
  max-inline-size: 100%;

  gap: 2px;

  line-height:
    calc(
      var(--cs-message-font-size, 13px)
      * 1.55
    );

  white-space: nowrap;

  word-break: normal;
  overflow-wrap: normal;
}

/*//////////////LINKS//////////////////*/

.cs-message a {
  color: inherit;

  overflow-wrap: anywhere;

  text-decoration: underline;

  text-decoration-color:
    rgba(
      255,
      255,
      255,
      0.8
    );

  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

/*//////////////DEFAULT ORDER//////////////////*/

.cs-avatar {
  order: 0;
}

.cs-user,
.cs-user--inline {
  order: 1;
}

.cs-message {
  order: 2;
}

/*//////////////AVATAR LEFT//////////////////*/

.cs-bubble.cs-avatar-position-left .cs-avatar {
  order: 0;
}

.cs-bubble.cs-avatar-position-left .cs-user,
.cs-bubble.cs-avatar-position-left .cs-user--inline {
  order: 1;
}

.cs-bubble.cs-avatar-position-left .cs-message {
  order: 2;
}

/*//////////////AVATAR CENTER//////////////////*/

.cs-bubble.cs-avatar-position-center .cs-user,
.cs-bubble.cs-avatar-position-center .cs-user--inline {
  order: 0;
}

.cs-bubble.cs-avatar-position-center .cs-avatar {
  order: 1;
}

.cs-bubble.cs-avatar-position-center .cs-message {
  order: 2;
}

/*//////////////AVATAR RIGHT//////////////////*/

.cs-bubble.cs-avatar-position-right .cs-user,
.cs-bubble.cs-avatar-position-right .cs-user--inline {
  order: 0;
}

.cs-bubble.cs-avatar-position-right .cs-message {
  order: 1;
}

.cs-bubble.cs-avatar-position-right .cs-avatar {
  order: 2;
}
