/*//////////////BASE//////////////*/

html,
body {
    margin: 0;
    padding: 0;

    overflow: visible;

    background: transparent;
}

.cs-bubble,
.cs-bubble *,
.cs-bubble::before,
.cs-bubble::after {
    box-sizing: border-box;
}



/*//////////////BUBBLE//////////////*/

.cs-bubble {
    --cat-source:
        var(
            --cs-avatar-background-color,
            var(--cs-usercolor, #e99aae)
        );

    --cat-fur:
        color-mix(
            in srgb,
            var(--cat-source) 78%,
            #ffffff 22%
        );

    --cat-pattern:
        color-mix(
            in srgb,
            var(--cat-source) 67%,
            #49393d 33%
        );

    --cat-deep:
        color-mix(
            in srgb,
            var(--cat-source) 35%,
            #292529 65%
        );

    --cat-cream:
        color-mix(
            in srgb,
            var(--cat-source) 4%,
            #fff9f2 96%
        );

    --cat-pink:
        color-mix(
            in srgb,
            var(--cat-source) 18%,
            #efa2b6 82%
        );

    --cat-outline:
        #30292b;


    /*//////////////TILT//////////////*/

    --tilt-avatar: -2.4deg;
    --tilt-user: 1.2deg;
    --tilt-message: -.8deg;
    --tilt-bubble: -.25deg;


    position: relative;
    isolation: isolate;

    overflow: visible;

    inline-size: fit-content;

    min-inline-size: 145px;

    max-inline-size:
        min(
            var(--cs-bubble-width, 350px),
            calc(100vw - 12px)
        );

    rotate:
        var(--tilt-bubble);
}



/*//////////////ALTERNATING TILT//////////////*/

.cs-chat > .cs-bubble:nth-child(even) {
    --tilt-avatar: 2.2deg;
    --tilt-user: -1.1deg;
    --tilt-message: .75deg;
    --tilt-bubble: .25deg;
}



/*//////////////INNER STITCH//////////////*/

.cs-bubble::before {
    content: "";

    position: absolute;
    z-index: 0;

    inset: 5px;

    border:
        2px dashed
        color-mix(
            in srgb,
            var(
                --cs-bubble-border-color,
                #4b363d
            ) 38%,
            transparent
        );

    border-radius:
        max(
            0px,
            calc(
                var(
                    --cs-bubble-border-radius,
                    10px
                )
                - 3px
            )
        );

    pointer-events: none;
}



/*//////////////PAW PRINT//////////////*/

.cs-bubble::after {
    content: "";

    position: absolute;
    z-index: 0;

    inset-inline-end: 7px;
    inset-block-end: 6px;

    inline-size: 17px;
    block-size: 14px;

    opacity: .18;

    background:
        radial-gradient(
            ellipse at 50% 72%,
            var(--cs-usercolor, #e99aae)
            0 3.5px,
            transparent 3.8px
        ),

        radial-gradient(
            circle at 13% 29%,
            var(--cs-usercolor, #e99aae)
            0 1.7px,
            transparent 2px
        ),

        radial-gradient(
            circle at 38% 12%,
            var(--cs-usercolor, #e99aae)
            0 1.8px,
            transparent 2.1px
        ),

        radial-gradient(
            circle at 67% 14%,
            var(--cs-usercolor, #e99aae)
            0 1.8px,
            transparent 2.1px
        ),

        radial-gradient(
            circle at 89% 34%,
            var(--cs-usercolor, #e99aae)
            0 1.6px,
            transparent 1.9px
        );

    pointer-events: none;
}



/*//////////////CAT HOLDER//////////////*/

.cs-cat-art {
    position: absolute;
    z-index: 10;

    display: none;

    inset-block-start: 0;
    inset-inline-end: 8px;

    inline-size: 100px;
    max-inline-size: 100px;

    aspect-ratio: 1200 / 420;

    transform:
        translateY(-68.57%);

    /*
        KEINE ANIMATION.

        Katze steht ab dem ersten Frame
        exakt an ihrer finalen Position.
    */

    animation: none;

    pointer-events: none;
}



/*//////////////SHOW CAT ROLES//////////////*/

.cs-bubble:is(
    .cs-sub,
    .cs-vip,
    .cs-mod,
    .cs-broadcaster,
    .cs-event
)
.cs-cat-art {
    display: block;
}



/*//////////////FOLLOWER//////////////*/

.cs-bubble:not(.cs-sub):not(.cs-vip):not(.cs-mod):not(.cs-broadcaster):not(.cs-event)
.cs-cat-art {
    display: none;
}



/*//////////////CAT BASE//////////////*/

.cs-cat {
    position: absolute;
    inset: 0;

    display: none;

    inline-size: 100%;
    block-size: 100%;

    overflow: visible;

    color:
        var(--cat-outline);

    animation: none;
}



/*//////////////CAT COLORS//////////////*/

.cs-cat .cat-fur {
    fill:
        var(--cat-fur);
}

.cs-cat .cat-pattern {
    fill:
        var(--cat-pattern);
}

.cs-cat .cat-deep {
    fill:
        var(--cat-deep);
}

.cs-cat .cat-cream {
    fill:
        var(--cat-cream);
}

.cs-cat .cat-pink {
    fill:
        var(--cat-pink);
}



/*//////////////SUBSCRIBER//////////////*/

.cs-bubble.cs-sub:not(
    .cs-vip,
    .cs-mod,
    .cs-broadcaster,
    .cs-event
)
.cs-cat--calico {
    display: block;
}



/*//////////////VIP//////////////*/

.cs-bubble.cs-vip:not(
    .cs-mod,
    .cs-broadcaster,
    .cs-event
)
.cs-cat--dark {
    display: block;
}



/*//////////////MODERATOR//////////////*/

.cs-bubble.cs-mod:not(
    .cs-broadcaster,
    .cs-event
) {
    --cat-source:
        var(
            --cs-avatar-background-color,
            #b9e7c6
        );

    --cat-fur:
        color-mix(
            in srgb,
            var(--cat-source) 82%,
            #f4fff7 18%
        );

    --cat-pattern:
        color-mix(
            in srgb,
            var(--cat-source) 68%,
            #6f9f7f 32%
        );

    --cat-deep:
        color-mix(
            in srgb,
            var(--cat-source) 72%,
            #7ca88a 28%
        );

    --cat-cream:
        #f6fff8;

    --cat-pink:
        #efb7c3;

    --cat-outline:
        #30292b;
}

.cs-bubble.cs-mod:not(
    .cs-broadcaster,
    .cs-event
)
.cs-cat--dark {
    display: block;
}



/*//////////////BROADCASTER//////////////*/

.cs-bubble.cs-broadcaster:not(.cs-event) {
    /*
        Bewusst unabhängig vom Avatar Background.
    */

    --cat-source:
        #ef667a;

    /*
        ROTER BODY
    */

    --cat-fur:
        #f07889;

    /*
        SCHWARZE / DUNKLE STREIFEN
    */

    --cat-pattern:
        #30292b;

    --cat-deep:
        #d9556b;

    --cat-cream:
        #fff0f3;

    --cat-pink:
        #ff9daf;

    /*
        NORMALER STROKE
    */

    --cat-outline:
        #30292b;
}

.cs-bubble.cs-broadcaster:not(.cs-event)
.cs-cat--tabby {
    display: block;
}



/*//////////////EVENT//////////////*/

.cs-bubble.cs-event
.cs-cat--tabby {
    display: block;
}



/*//////////////HEADER//////////////*/

.cs-header {
    position: relative;
    z-index: 2;

    display: flex;
    align-items: center;

    inline-size: 100%;
    min-inline-size: 0;

    gap: 7px;

    margin-block-end: 7px;
}



/*//////////////AVATAR//////////////*/

.cs-avatar {
    position: relative;

    flex: 0 0 auto;

    rotate:
        var(--tilt-avatar);
}

.cs-avatar img {
    display: block;

    object-fit: cover;

    background-color:
        var(
            --cs-avatar-background-color,
            var(--cs-usercolor, #e99aae)
        );


    /*
        TEMPLATE REVEAL

        Der Name wird hier absichtlich direkt
        gesetzt.

        Dadurch kann ein vom Runtime-System
        geliefertes "none" die Animation
        nicht mehr komplett abschalten.

        Duration / Delay / Timing verwenden
        weiterhin die Framework-Variablen.
    */

    animation-name:
        cs-cat-avatar-bounce;

    animation-duration:
        var(
            --cs-avatar-animation-duration,
            700ms
        );

    animation-delay:
        calc(
            600ms +
            var(
                --cs-avatar-animation-delay,
                0ms
            )
        );

    animation-timing-function:
        var(
            --cs-avatar-animation-timing-function,
            cubic-bezier(.18, .82, .24, 1)
        );

    animation-fill-mode:
        both;

    transform-origin:
        center;
}



/*//////////////USER//////////////*/

.cs-user {
    min-inline-size: 0;

    flex-wrap: wrap;

    gap: 4px;

    rotate:
        var(--tilt-user);


    /*
        USERNAME STARTET 180ms
        NACH DEM AVATAR.
    */

    animation-name:
        cs-cat-username-bounce;

    animation-duration:
        var(
            --cs-username-animation-duration,
            720ms
        );

    animation-delay:
        calc(
            780ms +
            var(
                --cs-username-animation-delay,
                0ms
            )
        );

    animation-timing-function:
        var(
            --cs-username-animation-timing-function,
            cubic-bezier(.18, .82, .24, 1)
        );

    animation-fill-mode:
        both;

    transform-origin:
        left center;
}



/*//////////////USERNAME//////////////*/

.cs-username,
.cs-username--inline {
    min-inline-size: 0;

    line-height: 1.08;

    letter-spacing: .01em;

    white-space: normal;

    overflow-wrap: anywhere;
}



/*//////////////PRONOUNS//////////////*/

.cs-pronouns {
    margin-inline-end: 3px;

    padding:
        1px 4px;

    border-radius:
        var(
            --cs-username-border-radius,
            10px
        );

    font-size: .68em;
    font-weight: 800;
}



/*//////////////BADGES//////////////*/

.cs-badges,
.cs-badges--inline {
    gap: 3px;
}

.cs-badges img,
.cs-badges--inline img {
    object-fit: contain;

    border-radius: 3px;
}



/*//////////////CONTENT//////////////*/

.cs-content {
    position: relative;
    z-index: 2;

    min-inline-size: 0;
}



/*//////////////MESSAGE//////////////*/

.cs-message {
    min-inline-size: 0;
    max-inline-size: 100%;

    line-height: 1.35;

    overflow-wrap: anywhere;

    rotate:
        var(--tilt-message);


    /*
        MESSAGE STARTET WEITERE 180ms

    animation-name:
        cs-cat-message-bounce;

    animation-duration:
        var(

.cs-username--inline,

.cs-bubble.cs-event
.cs-message {
    text-align: center;
}

.cs-bubble.cs-event
.cs-message {
    justify-content: center;

    rotate: .65deg;
}



/*//////////////AVATAR BOUNCE//////////////*/

@keyframes cs-cat-avatar-bounce {
    0% {
        opacity: 0;

        transform:
            translateY(12px)
            scale(.5);
    }

    45% {
        opacity: 1;

        transform:
            translateY(-3px)
            scale(1.09);
    }

    64% {
        transform:
            translateY(1.5px)
            scale(.965);
    }

    78% {
        transform:
            translateY(-1px)
            scale(1.025);
    }

    89% {
        transform:
            translateY(.4px)
            scale(.992);
    }

    100% {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}



/*//////////////USERNAME BOUNCE//////////////*/

@keyframes cs-cat-username-bounce {
    0% {
        opacity: 0;

        transform:
            translateX(-12px)
            scaleX(.66)
            scaleY(.76);
    }

    45% {
        opacity: 1;

        transform:
            translateX(2.5px)
            scaleX(1.07)
            scaleY(1.06);
    }

    64% {
        transform:
            translateX(-1px)
            scale(.965);
    }

    78% {
        transform:
            translateX(.5px)
            scale(1.022);
    }

    89% {
        transform:
            scale(.994);
    }

    100% {
        opacity: 1;

        transform:
            translateX(0)
            scale(1);
    }
}



/*//////////////MESSAGE BOUNCE//////////////*/

@keyframes cs-cat-message-bounce {
    0% {
        opacity: 0;

        transform:
            translateY(14px)
            scaleX(.78)
            scaleY(.66);
    }

    45% {
        opacity: 1;

        transform:
            translateY(-3px)
            scaleX(1.035)
            scaleY(1.075);
    }

    64% {
        transform:
            translateY(1.5px)
            scaleX(.985)
            scaleY(.96);
    }

    78% {
        transform:
            translateY(-.7px)
            scale(1.018);
    }

    89% {
        transform:
            translateY(.3px)
            scale(.995);
    }

    100% {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}



/*//////////////SMALL VIEWPORT//////////////*/

@media (max-width: 420px) {
    .cs-bubble {
        min-inline-size: 135px;

        max-inline-size:
            min(
                var(--cs-bubble-width, 350px),
                calc(100vw - 12px)
            );
    }

    .cs-cat-art {
        inline-size: 92px;
        max-inline-size: 92px;
    }
}

/*//////////////VIP CAT MIRROR - RIGHT SIDE//////////////*/

.cs-bubble.cs-vip:not(
    .cs-mod,
    .cs-broadcaster,
    .cs-event
)
.cs-cat-art {
    inset-inline-start: auto;
    inset-inline-end: 8px;

    transform:
        translateY(-68.57%)
        scaleX(-1);
}

/*//////////////MOD CAT MIRROR - LEFT SIDE//////////////*/

.cs-bubble.cs-mod:not(
    .cs-broadcaster,
    .cs-event
)
.cs-cat-art {
    inset-inline-start: 8px;
    inset-inline-end: auto;

    transform:
        translateY(-68.57%)
        scaleX(-1);
}

/*//////////////REDUCED MOTION//////////////*/

@media (prefers-reduced-motion: reduce) {
    .cs-avatar img,
    .cs-user,
    .cs-user--inline,
    .cs-message {
        animation: none;
    }
}

/*//////////////EMOTES//////////////////*/

.cs-message .emote {
    display: inline-block;

    flex: 0 0 auto;

    width: auto !important;
    inline-size: auto !important;

    height:
        calc(
            var(--cs-message-font-size, 13px)
            * 1.55
        )
        !important;

    block-size:
        calc(
            var(--cs-message-font-size, 13px)
            * 1.55
        )
        !important;

    max-width: none !important;
    max-inline-size: none !important;

    max-height:
        calc(
            var(--cs-message-font-size, 13px)
            * 1.55
        )
        !important;

    max-block-size:
        calc(
            var(--cs-message-font-size, 13px)
            * 1.55
        )
        !important;

    object-fit: contain;

    margin-inline: 2px;

    vertical-align: middle;
}
