/*//////////////SYSTEM//////////////*/

.cs-bubble{

    --signal-accent:
        color-mix(
            in srgb,
            var(--signal-source) 72%,
            #d9faff 28%
        );

    --signal-bright:
        color-mix(
            in srgb,
            var(--signal-accent) 68%,
            #ffffff 32%
        );

    --signal-dim:
        color-mix(
            in srgb,
            var(--signal-accent) 34%,

    --signal-soft:
        color-mix(
            in srgb,
            var(--signal-accent) 14%,
            #080b0e 86%
        );

    --signal-glitch:
        color-mix(
            in srgb,
            var(--signal-accent) 54%,
            #ff36c7 46%

    --signal-text:
        color-mix(
            in srgb,
            #f3f7f8 92%,
            var(--signal-accent) 8%
        );

    --node-label:"NODE";

    position:relative;
    isolation:isolate;
    box-sizing:border-box;

    inline-size:
        min(
            100%,

    overflow:hidden;

    padding-block-start:
        var(
            --cs-bubble-padding-top,
            var(--cs-bubble-padding,9px)

    padding-inline-end:

        );

        var(
            --cs-bubble-padding-bottom,

        );

    border-end-start-radius:

/*//////////////CONNECTED BORDER//////////////*/

.cs-bubble::before,
.cs-bubble::after{
    content:"";

    position:absolute;
    inset:0;

    z-index:20;

    box-sizing:border-box;

    border:1px solid;
    border-radius:inherit;

    pointer-events:none;

    opacity:0;
}

.cs-bubble::before{

    animation:
        border-glitch-a
        .82s
        steps(1,end)
        .06s
        both;
}

.cs-bubble::after{

    animation:
        border-glitch-b
        .86s
        steps(1,end)
        .12s
        both;
}


/*//////////////NANO LAYER//////////////*/

.cs-nano-layer{
    position:absolute;
    inset:0;

    z-index:1;

    overflow:hidden;

    pointer-events:none;
}

.cs-nano{
    position:absolute;

    fill:none;

    stroke:var(--signal-dim);
    stroke-width:1px;

    stroke-linecap:square;
    stroke-linejoin:miter;

    opacity:.82;
}

        .12s

.cs-nano circle{

    transform-box:fill-box;

        node-in

    justify-content:center;

    max-inline-size:100%;

    margin-inline:auto;

    text-align:center;
}


/*//////////////INLINE EVENT//////////////*/

.cs-event.cs-username-position-inline .cs-header{
    display:none;
}

.cs-event.cs-username-position-inline .cs-content{
    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    inline-size:100%;

    padding-block-start:12px;

    text-align:center;
}

.cs-event.cs-username-position-inline .cs-user--inline{
    display:flex;

    align-items:center;
    justify-content:center;

    inline-size:100%;

    margin-inline:auto;

    text-align:center;
}

.cs-event.cs-username-position-inline .cs-username--inline{
    display:block;

    inline-size:100%;

    text-align:center;
}


/*//////////////EVENT CONTINUOUS GLITCH//////////////*/

.cs-event::before{
    animation:
        event-border-a
        2.8s
        steps(1,end)
        .35s
        infinite;
}

.cs-event::after{
    animation:
        event-border-b
        3.3s
        steps(1,end)
        .7s
        infinite;
}

.cs-event .cs-username,
.cs-event .cs-username--inline{
    animation:
        username-in
        .5s
        steps(1,end)
        .53s
        forwards,

        event-text-a
        3.4s
        steps(1,end)
        1.25s
        infinite;
}

.cs-event .cs-message{
    animation:
        message-in
        .54s
        steps(1,end)
        .68s
        forwards,

        event-text-b
        3.9s
        steps(1,end)
        1.55s
        infinite;
}

.cs-event .cs-glitch--1{
    animation:
        event-glitch-a
        2.5s
        steps(1,end)
        .25s
        infinite;
}

.cs-event .cs-glitch--2{
    animation:
        event-glitch-b
        3s
        steps(1,end)
        .68s
        infinite;
}

.cs-event .cs-glitch--3{
    animation:
        event-glitch-c
        2.7s
        steps(1,end)
        .95s
        infinite;
}

@media(max-width:400px){

    .cs-bubble{
        max-inline-size:
            var(--cs-bubble-width,100%);

        padding-inline-start:
            var(
                --cs-bubble-padding-left,
                var(--cs-bubble-padding,10px)
            );

        padding-inline-end:
            var(
                --cs-bubble-padding-right,
                var(--cs-bubble-padding,10px)
            );
    }

    .cs-header{
        padding-inline-end:92px;
        gap:7px;
    }

    .cs-avatar img{
        inline-size:
            var(--cs-avatar-size,30px);

        block-size:
            var(--cs-avatar-size,30px);
    }

    .cs-node-type{
        font-size:6px;
    }

    .cs-timestamp{
        font-size:7px;
    }

    .cs-event .cs-header{
        padding-inline:0;
    }
}


/*//////////////REDUCED MOTION//////////////*/

@media(prefers-reduced-motion:reduce){

    .cs-glitch,
    .cs-bubble::before,
    .cs-bubble::after{
        display:none;
    }

    .cs-nano path,
    .cs-role-nano path{
        animation:none;
        stroke-dashoffset:0;
    }

    .cs-nano circle,
    .cs-role-nano circle,
    .cs-meta,
    .cs-avatar,
    .cs-avatar::before,
    .cs-avatar-corner,
    .cs-badges,
    .cs-badges--inline,
    .cs-username,
    .cs-username--inline,
    .cs-message{
        animation:none;

        opacity:1;
        transform:none;

        clip-path:none;
        text-shadow:none;
    }
}

.cs-bubble:not(.cs-event)
.cs-nano-layer::before{
    content:"";

    position:absolute;

    z-index:5;

    inset-inline-start:72%;
    inset-block-start:50%;

    inline-size:18px;
    block-size:18px;

    pointer-events:none;

    border:
        1px solid #f1d8ff;

    background:
        conic-gradient(
            from 45deg,
            rgba(255,62,201,.55),
            rgba(104,224,255,.55),
            rgba(190,102,255,.65),
            rgba(255,62,201,.55)
        );

    opacity:0;

    transform:
        translate(-50%,-50%)
        rotate(45deg)
        scale(.2);

    animation:
        prism-core
        7s
        cubic-bezier(.6,0,.35,1)
        infinite;
}




.cs-bubble:not(.cs-event)
.cs-nano-layer::after{
    content:"";

    position:absolute;

    z-index:2;

    inset-inline-start:72%;
    inset-block-start:50%;

    inline-size:100px;
    block-size:100px;

    pointer-events:none;

    border-radius:50%;

    background:
        conic-gradient(
            from 0deg,
            transparent,
            rgba(255,62,201,.14),
            transparent,
            rgba(100,225,255,.16),
            transparent,
            rgba(183,99,255,.2),
            transparent
        );

    opacity:0;

    transform:
        translate(-50%,-50%)
        rotate(0deg)
        scale(.2);

    animation:
        prism-halo
        7s
        ease-in-out
        infinite;
}
