/*//////////////EVENT PETAL FLOW//////////////////*/

.cs-bubble.cs-event

.cs-flower {
    animation-iteration-count: 5;
}

.cs-bubble.cs-event
.cs-petals--back
.cs-flower {
    animation-iteration-count: 5;

    animation-delay:
        calc(
            var(--d) + .7s
        );

    filter:
        drop-shadow(
            0 2px 2px #6c2a4314
        );
}


/*//////////////PETAL TRAVEL//////////////////*/

@keyframes a {
    0% {
        inset-inline-start: -20px;
    }

    100% {
        inset-inline-start: var(--x);
    }
}


/*//////////////PETAL ROTATION//////////////////*/

@keyframes b {
    0% {
        transform:
            rotate(0)
            scale(.8);
    }

    18% {
        transform:
            rotate(
                calc(
                    24deg *
                    var(--m, 1)
                )
            )
            scale(.92);
    }

    58% {
        transform:
            translateY(var(--a))
            rotate(
                calc(
                    var(--r) *
                    var(--m, 1)
                )
            )
            scale(1);
    }

    100% {
        transform:
            translateY(var(--y))
            rotate(
                calc(
                    var(--r) *
                    var(--m, 1)
                )
            )
            scale(.95);
    }
}


/*//////////////PETAL OPACITY//////////////////*/

@keyframes c {
    0% {
        opacity: 0;

    8%,

    82% {

    100% {

}
