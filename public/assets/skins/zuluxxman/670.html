/*//////////////SHINE ANIMATION//////////////////*/

@keyframes shine {
    0% {
        left:
            var(--shine-a);

        opacity: 0;
    }

    12%,
    70% {
        opacity: .9;
    }

    100% {
        left:
            var(--shine-b);

        opacity: 0;
    }
}

/*//////////////MARKER ANIMATION//////////////////*/

@keyframes marker-in {
    0% {
        opacity: 0;

        transform:
            translateX(
                var(--marker-x)
            );
    }

    14% {
        opacity: 1;
    }

    100% {
        opacity: 1;

        transform:
            translateX(0);
    }
}

/*//////////////EVENT PREMIUM REVEAL//////////////////*/

@keyframes event-premium-in {
    0% {
        opacity: 0;

        transform:
            translateX(
                var(--event-enter-x)
            )
            scaleX(.94)
            scaleY(.92);

        filter:
            brightness(.65)
            saturate(.65);
    }

    18% {
        opacity: .45;

        transform:
            translateX(
                calc(
                    var(--event-enter-x) * .55
                )
            )
            scaleX(.965)
            scaleY(.96);

        filter:
            brightness(.9)
            saturate(.85);
    }

    42% {
        opacity: 1;

        transform:
            translateX(0)
            scaleX(1.012)
            scaleY(1);

        filter:
            brightness(1.45)
            saturate(1.18)
            drop-shadow(
                0 0 4px
                color-mix(
                    in srgb,
                    var(--cs-bubble-border-color) 48%,
                    transparent
                )
            );
    }

    58% {
        transform:
            translateX(0)
            scaleX(.997)
            scaleY(1);

        filter:
            brightness(1.12)
            saturate(1.08)
            drop-shadow(
                0 0 2px
                color-mix(
                    in srgb,
                    var(--cs-bubble-border-color) 28%,
                    transparent
                )
            );
    }

    76% {
        transform:
            translateX(0)
            scaleX(1.002)
            scaleY(1);

        filter:
            brightness(1.04)
            saturate(1.02);
    }

    100% {
        opacity: 1;

        transform:
            translateX(0)
            scaleX(1)
            scaleY(1);

        filter:
            brightness(1)
            saturate(1);
    }
}

/*//////////////EVENT SHINE ANIMATION//////////////////*/

@keyframes event-shine-loop {
    0%,
    70% {
        left:
            var(--shine-a);

        opacity: 0;
    }

    74% {
        opacity: .22;
    }

    79% {
        opacity: .82;
    }

    90% {
        left:
            var(--shine-b);

        opacity: .6;
    }

    95%,
    100% {
        left:
            var(--shine-b);

        opacity: 0;
    }
}

/*//////////////SUB STAR PULSE//////////////////*/

@keyframes sub-scan {
    0%,
    58%,
    100% {
        transform:
            scale(1);

        fill:
            #fff;

        stroke:
            #fff;

        opacity: 1;

        filter: none;
    }

    63% {
        transform:
            scale(1.04);

        fill:
            #fff;

        stroke:
            #fff;

        opacity: 1;

        filter:
            drop-shadow(
                0 0 2px
                rgba(255, 255, 255, .75)
            );
    }

    67% {
        transform:
            scale(1.11);

        fill:
            #fff;

        stroke:
            #fff;

        opacity: 1;

        filter:
            drop-shadow(
                0 0 2px
                #fff
            )
            drop-shadow(
                0 0 5px
                rgba(255, 255, 255, .85)
            )
            drop-shadow(
                0 0 8px
                color-mix(
                    in srgb,
                    var(--cs-bubble-border-color) 40%,
                    transparent
                )
            );
    }

    71% {
        transform:
            scale(.985);

        fill:
            #fff;

        stroke:
            #fff;

        opacity: 1;

        filter:
            drop-shadow(
                0 0 2px
                rgba(255, 255, 255, .65)
            );
    }

    76% {
        transform:
            scale(1);

        fill:
            #fff;

        stroke:
            #fff;

        opacity: 1;

        filter: none;
    }
}

@keyframes raid-scan {
